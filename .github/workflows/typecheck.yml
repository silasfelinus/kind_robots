name: TypeScript Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-serendipity-cutover:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/serendipity-canonical-route' && github.actor != 'github-actions[bot]'
    name: Apply Serendipity cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: codex/serendipity-canonical-route
          fetch-depth: 0

      - name: Apply canonical route and identities
        run: python utils/scripts/applySerendipityRouteCutover.py

      - name: Exclude workflow changes from generated commit
        run: |
          rm -f .github/workflows/serendipity-route-contract.yml
          rm -f utils/scripts/applySerendipityRouteCutover.py

      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make Serendipity the canonical voice route"
          git push origin HEAD:codex/serendipity-canonical-route

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/kindrobots

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run test > /tmp/typecheck.log 2>&1

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          retention-days: 3
          if-no-files-found: warn
          path: /tmp/typecheck.log
