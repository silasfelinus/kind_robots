name: Apply Project art control visibility fix

on:
  push:
    branches:
      - fix/project-art-controls-visible

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-art-controls-visible
          fetch-depth: 0
      - name: Patch Boolean prop fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/pages/conductor-art-gallery.vue')
          text = path.read_text()
          old = 'const mayEdit = computed(() => props.canEdit ?? userStore.isAdmin)'
          new = 'const mayEdit = computed(() => props.canEdit || userStore.isAdmin)'
          if old not in text:
              raise SystemExit('Expected mayEdit expression was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-project-art-controls-visible.yml
      - name: Commit surgical fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/pages/conductor-art-gallery.vue .github/workflows/fix-project-art-controls-visible.yml
          git commit -m "fix: show Project art controls for admins"
          git push origin HEAD:fix/project-art-controls-visible
