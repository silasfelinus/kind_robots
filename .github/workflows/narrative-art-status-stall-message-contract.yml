name: Narrative Art Status Stall Message Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: narrative-art-status-stall-message-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Narrative art status stall message contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify narrative art status stall message guard
        run: node utils/scripts/verifyNarrativeArtStatusStallMessageGuard.mjs
