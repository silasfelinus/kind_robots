name: Navigation Consolidation Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/channels/home/**'
      - 'content/channels/admin/**'
      - 'content/channels/arcade/**'
      - 'content/channels/arcade/**'
      - 'content/channels/projects/**'
      - 'components/home/home-page.vue'
      - 'components/home/home-visitor-directory.vue'
      - 'components/navigation/account-hub.vue'
      - 'stores/channelContentStore.ts'
      - 'content/account.md'
      - 'content/connect.md'
      - 'content/about.md'
      - 'content/serendipity.md'
      - 'content/user-admin.md'
      - 'content/artjob.md'
      - 'components/home/home-account-links.vue'
      - 'components/resources/resource-manager.vue'
      - 'components/animation/animation-manager.vue'
      - 'content/build/animation-manager.md'
      - 'utils/projectPlacements.ts'
      - 'components/user/account-center.vue'
      - 'components/pages/about-page.vue'
      - 'components/user/forum-moderation-panel.vue'
      - 'components/user/user-admin-center.vue'
      - 'components/navigation/navigation-trimmed.vue'
      - 'components/navigation/workspace-header.vue'
      - 'components/navigation/channel-select.vue'
      - 'components/navigation/tab-select.vue'
      - 'pages/admin/forum-moderation.vue'
      - 'stores/helpers/channelCards.ts'
      - 'utils/channelTabGroups.ts'
      - 'utils/scripts/verifyNavigationConsolidation.ts'
      - 'utils/scripts/verifyRequestedChannelGroups.test.ts'
      - 'utils/homeShowcase.ts'
      - 'utils/scripts/verifyHomeShowcaseLabels.test.ts'
      - 'pages/play/zuzu-ghost-trail.vue'
      - 'content/play/aquarium.md'
      - 'content/play/memory.md'
      - '.github/workflows/navigation-consolidation-contract.yml'
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  navigation-consolidation:
    name: Navigation consolidation verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Verify consolidated navigation
        run: |
          npx tsx utils/scripts/verifyNavigationConsolidation.ts
          npx tsx utils/scripts/verifyRequestedChannelGroups.test.ts
          npx tsx utils/scripts/verifyHomeShowcaseLabels.test.ts
