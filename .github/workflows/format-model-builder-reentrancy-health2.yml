name: Normalize Model Builder reentrancy guard

on:
  push:
    branches:
      - worker/model-builder-t029-reentrancy-health2
    paths:
      - .github/workflows/format-model-builder-reentrancy-health2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/model-builder-t029-reentrancy-health2
          fetch-depth: 1

      - name: Normalize regression guard text
        shell: python
        run: |
          from pathlib import Path

          checker_path = Path('utils/scripts/verifyModelBuilderAutoBuildDraftGate.ts')
          checker = checker_path.read_text()
          old = """  const claimIndex = fn.body.indexOf('autoBuildingItemSingleton.claim(item.id)')
          const reentrancyGuard = /if\\s*\\(\\s*state\\.autoBuildingItemId\\s*===\\s*item\\.id\\s*\\)\\s*return false/.exec(
            fn.body,
          )
          if (
            claimIndex < 0 ||
            !reentrancyGuard ||
            reentrancyGuard.index > claimIndex
          ) {
            errors.push(
              `${FN_NAME}() must return false when state.autoBuildingItemId already ` +
                'equals item.id before claiming autoBuildingItemSingleton. Without ' +
                'that entry guard, the item-level Auto action can overlap with batch ' +
                'or run-level auto-build for the same item and duplicate draft, render, ' +
                'or commit work.',
            )
          }

          for (const { field, stageKey } of DRAFT_GATES) {
          """
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = """  const claimIndex = fn.body.indexOf('autoBuildingItemSingleton.claim(item.id)')
            const reentrancyGuard =
              /if\\s*\\(\\s*state\\.autoBuildingItemId\\s*===\\s*item\\.id\\s*\\)\\s*return false/.exec(
                fn.body,
              )
            if (
              claimIndex < 0 ||
              !reentrancyGuard ||
              reentrancyGuard.index > claimIndex
            ) {
              errors.push(
                `${FN_NAME}() must return false when state.autoBuildingItemId already ` +
                  'equals item.id before claiming autoBuildingItemSingleton. Without ' +
                  'that entry guard, the item-level Auto action can overlap with batch ' +
                  'or run-level auto-build for the same item and duplicate draft, render, ' +
                  'or commit work.',
              )
            }

            for (const { field, stageKey } of DRAFT_GATES) {
          """
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if checker.count(old) != 1:
              raise SystemExit(f'expected one malformed checker block, found {checker.count(old)}')
          checker_path.write_text(checker.replace(old, new, 1))

          test_path = Path('utils/scripts/verifyModelBuilderAutoBuildDraftGate.test.ts')
          test = test_path.read_text()
          test = test.replace(
              "// shape (result captured and gated), and autoBuildItem being absent entirely.\n",
              "// shape (result captured and gated), the same-item reentrancy guard, and\n// autoBuildItem being absent entirely.\n",
              1,
          )
          test = test.replace(
              "  'Model Builder auto-build draft gate checker verified: flags the pre-fix ' +\n    'shape (discarded draftText results feeding straight into an ' +\n    'unconditional approveStage), clears the fixed shape, and flags ' +\n    'autoBuildItem being absent entirely.',",
              "  'Model Builder auto-build gate checker verified: flags discarded draft ' +\n    'results and missing same-item reentrancy protection, clears the fixed shape, ' +\n    'and flags autoBuildItem being absent entirely.',",
              1,
          )
          test_path.write_text(test)

          Path('.github/workflows/format-model-builder-reentrancy-health2.yml').unlink()

      - name: Commit normalization
        run: |
          git config user.name "kind-robots-health-bot"
          git config user.email "actions@users.noreply.github.com"
          git add utils/scripts/verifyModelBuilderAutoBuildDraftGate.ts utils/scripts/verifyModelBuilderAutoBuildDraftGate.test.ts .github/workflows/format-model-builder-reentrancy-health2.yml
          git commit -m "test(model-builder): cover auto-build reentrancy"
          git push origin HEAD:worker/model-builder-t029-reentrancy-health2
