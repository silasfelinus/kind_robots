name: Refine Taskmaster Checkpoint Boundary

on:
  push:
    branches:
      - codex/taskmaster-checkpoint-engine
    paths:
      - .github/workflows/refine-taskmaster-checkpoint-boundary.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/taskmaster-checkpoint-engine
          fetch-depth: 0
      - name: Refine checkpoint boundary
        run: python utils/scripts/refineTaskmasterCheckpointBoundary.py
      - name: Remove one-time refinement machinery
        run: |
          rm utils/scripts/refineTaskmasterCheckpointBoundary.py
          rm .github/workflows/refine-taskmaster-checkpoint-boundary.yml
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stores/taskmasterStore.ts components/pages/taskmaster-page.vue utils/scripts/refineTaskmasterCheckpointBoundary.py .github/workflows/refine-taskmaster-checkpoint-boundary.yml
          git commit -m "fix: keep Taskmaster write-back proposals optional"
          git push origin HEAD:codex/taskmaster-checkpoint-engine
