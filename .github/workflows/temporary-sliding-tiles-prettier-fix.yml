name: Temporary sliding tile formatting repair
on:
  push:
    branches:
      - worker/sliding-tiles-t003-admin-preview-20261014-gpt6-64ad
permissions:
  contents: write
jobs:
  fix-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install formatter
        run: npm ci --ignore-scripts
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Format only reported files
        run: |
          npx prettier --write pages/admin/sliding-tile-gallery.vue stores/slidingTileGalleryStore.ts utils/scripts/verifySlidingTileGallery.test.ts
          npx prettier --check pages/admin/sliding-tile-gallery.vue stores/slidingTileGalleryStore.ts utils/scripts/verifySlidingTileGallery.test.ts
      - name: Commit repaired formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/admin/sliding-tile-gallery.vue stores/slidingTileGalleryStore.ts utils/scripts/verifySlidingTileGallery.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(sliding-tiles): satisfy Prettier ratchet'
            git push
          fi
