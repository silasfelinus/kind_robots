name: Plumber Airlock Formatter (Temporary)
on:
  push:
    branches:
      - feat/plumber-jet-activated-airlocks-20261028
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'silasfelinus/kind_robots' && github.ref == 'refs/heads/feat/plumber-jet-activated-airlocks-20261028'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply repo Prettier
        run: |
          npx prettier --write \
            utils/arcade/games/savePlumberPreview.ts \
            utils/arcade/games/savePlumberMaker.ts \
            components/arcade/plumber-maker-sidebar.vue \
            components/arcade/plumber-level-maker.vue \
            utils/scripts/verifySavePlumberMaker.test.ts \
            docs/save-plumber-maker-capability-audit.md
      - name: Commit Prettier changes
        run: |
          git add \
            utils/arcade/games/savePlumberPreview.ts \
            utils/arcade/games/savePlumberMaker.ts \
            components/arcade/plumber-maker-sidebar.vue \
            components/arcade/plumber-level-maker.vue \
            utils/scripts/verifySavePlumberMaker.test.ts \
            docs/save-plumber-maker-capability-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(plumber-maker): format airlock puzzles"
          git push origin HEAD:refs/heads/feat/plumber-jet-activated-airlocks-20261028
