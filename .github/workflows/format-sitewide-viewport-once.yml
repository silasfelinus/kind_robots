name: One-shot sitewide viewport formatter
on:
  push:
    branches:
      - worker/interface-vision-t104-sitewide-viewport-18b8
    paths:
      - .github/workflows/format-sitewide-viewport-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/interface-vision-t104-sitewide-viewport-18b8
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write utils/scripts/auditResponsiveLayout.mjs utils/scripts/verifyRequestedChannelGroups.test.ts pages/play/zuzu-ghost-trail.vue pages/play/zuzu-pinball.vue pages/play/zuzu-showdown.vue
      - name: Commit formatted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utils/scripts/auditResponsiveLayout.mjs utils/scripts/verifyRequestedChannelGroups.test.ts pages/play/zuzu-ghost-trail.vue pages/play/zuzu-pinball.vue pages/play/zuzu-showdown.vue
          if ! git diff --cached --quiet; then
            git commit -m 'style: format viewport-first sitewide pass'
            git push origin HEAD:worker/interface-vision-t104-sitewide-viewport-18b8
          fi
