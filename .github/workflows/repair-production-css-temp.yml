name: Temporary production CSS repair

on:
  push:
    branches:
      - worker/interface-vision-t104-publish-fix-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: worker/interface-vision-t104-publish-fix-20260906
          fetch-depth: 0

      - name: Remove remaining obsolete DaisyUI bordered modifiers
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('assets/css/tailwind.css')
          text = css.read_text(encoding='utf-8')
          expected = {
              '@apply textarea textarea-bordered w-full bg-base-100;': 1,
              '@apply textarea textarea-bordered w-full bg-base-200;': 1,
              '@apply input input-bordered w-full bg-base-100;': 1,
              '@apply input input-bordered w-full bg-base-200;': 1,
          }
          for needle, count in expected.items():
              actual = text.count(needle)
              if actual != count:
                  raise SystemExit(f'Expected {count} occurrence of {needle!r}, found {actual}')

          text = text.replace('textarea-bordered ', '')
          text = text.replace('input-bordered ', '')
          css.write_text(text, encoding='utf-8')
          Path('.github/workflows/repair-production-css-temp.yml').unlink()
          PY

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "kind-robots-worker"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css/tailwind.css .github/workflows/repair-production-css-temp.yml
          git commit -m "fix: remove remaining DaisyUI v4 bordered modifiers"
          git push origin HEAD:worker/interface-vision-t104-publish-fix-20260906
