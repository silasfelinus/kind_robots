name: Generated Client Parity

# kind-robots/t-087: catch a prisma/schema.prisma edit that ships with a
# stale checked-in prisma/generated/ client -- the class of bug that left
# server/api/agent-profiles/*.ts silently type-broken on main after PR #2284
# added AgentProfile/AgentProfileCredential to the schema without
# regenerating the committed client. See
# utils/scripts/verifyGeneratedClientParity.ts.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: generated-client-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CYPRESS_INSTALL_BINARY: '0'
      DATABASE_URL: 'mysql://user:pass@127.0.0.1:3306/kindrobots'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generated Prisma client parity
        run: npm run test:generated-client-parity
