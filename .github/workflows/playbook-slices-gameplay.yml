name: Playbook Slices Gameplay

# Exercise the newly authored deterministic play loops before the two
# console routes can regress. This is intentionally DB-free.
on:
  pull_request:
    paths:
      - 'utils/cometAcademy/**'
      - 'utils/playbook/runReview.ts'
      - 'components/playbook/playbook-run-review.vue'
      - 'utils/scripts/verifyPlaybookRunReview.test.ts'
      - 'utils/gameOfCaptains/**'
      - 'stores/cometAcademyStore.ts'
      - 'stores/gameOfCaptainsStore.ts'
      - 'pages/play/comet-city-academy.vue'
      - 'pages/play/game-of-captains.vue'
      - 'components/home/home-visitor-directory.vue'
      - 'utils/scripts/verifyCometCityAcademy.test.ts'
      - 'utils/scripts/verifyCometPatrolStories.test.ts'
      - 'utils/scripts/verifyCometOctoberCast.test.ts'
      - 'utils/scripts/verifyCometConsoleScreens.test.ts'
      - 'utils/scripts/verifyCometPlaytestReadiness.test.ts'
      - 'components/play/cometAcademy/**'
      - 'utils/scripts/verifyPromVillainHenchmen.test.ts'
      - 'utils/cometAcademy/identityCampaignStages.json'
      - 'utils/cometAcademy/identityCampaignStages.ts'
      - 'utils/scripts/verifyPromCampaignStages.test.ts'
      - 'utils/scripts/verifyComicCharacterReveals.test.ts'
      - 'components/comic-character-reveal.vue'
      - 'components/play/cometAcademy/AcademyOpening.vue'
      - 'pages/admin/every-villain-tactics.vue'
      - 'utils/scripts/verifyCapesStyleCheck.test.ts'
      - 'utils/capesStyleCheck.ts'
      - 'stores/capesStyleCheckStore.ts'
      - 'server/api/capes/style-check.get.ts'
      - 'pages/admin/capes.vue'
      - 'content/channels/admin/capes.md'
      - 'utils/scripts/verifyGameOfCaptains.test.ts'
      - 'utils/scripts/verifyGameOfCaptainsExpedition.test.ts'
      - 'utils/scripts/verifyGameOfCaptainsCharacters.test.ts'
      - 'utils/scripts/verifyGameOfCaptainsTraces.test.ts'
      - 'utils/scripts/spaceCouchTraceHarness.ts'
      - 'utils/scripts/fixtures/spaceCouchSaves-2026-10-29.json'
      - '.github/workflows/playbook-slices-gameplay.yml'
  push:
    branches: [main]
    paths:
      - 'utils/cometAcademy/**'
      - 'utils/playbook/runReview.ts'
      - 'components/playbook/playbook-run-review.vue'
      - 'utils/scripts/verifyPlaybookRunReview.test.ts'
      - 'utils/gameOfCaptains/**'
      - 'pages/play/comet-city-academy.vue'
      - 'pages/play/game-of-captains.vue'
      - 'components/play/cometAcademy/**'
      - '.github/workflows/playbook-slices-gameplay.yml'
  workflow_dispatch:

jobs:
  seeded-playthroughs:
    name: Seeded game-playthrough contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: End-of-run reviews across Playbook endings
        run: npm run test:playbook-run-review
      - name: Academy seeded term and saved outcome verification
        run: npm run test:comet-city-academy
      - name: Signature origin missions, villain lairs and lieutenant parity
        run: npx tsx utils/scripts/verifyPromCampaignStages.test.ts
      - name: Shared comic character reveals across both games
        run: npx tsx utils/scripts/verifyComicCharacterReveals.test.ts
      - name: Shared Capes style gate and live-job projection contract
        run: npx tsx utils/scripts/verifyCapesStyleCheck.test.ts
      - name: Villain-specific one-hit bestiary parity
        run: npx tsx utils/scripts/verifyPromVillainHenchmen.test.ts
      - name: Captains seeded missions and ethical ending verification
        run: npm run test:game-of-captains
      - name: Space Couch expedition roster, fatalities and allocation verification
        run: npx tsx utils/scripts/verifyGameOfCaptainsExpedition.test.ts
      - name: Space Couch character signatures and dossiers
        run: npx tsx utils/scripts/verifyGameOfCaptainsCharacters.test.ts
