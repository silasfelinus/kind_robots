name: Coat Dance VACE pilot
on:
  pull_request:
    paths:
      - 'scripts/coat_dance_vace_worker.py'
      - 'scripts/tests/test_coat_dance_vace_worker.py'
      - 'server/api/video-restyle/**'
      - 'server/utils/videoRestyleJobs.ts'
      - 'utils/videoRestylePlan.ts'
      - 'pages/admin/coat-dance.vue'
      - '.github/workflows/coat-dance-vace-pilot.yml'
permissions:
  contents: read
concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Native VACE graph, exact frame overlap and audio preservation
        run: python3 -m unittest discover -s scripts/tests -p 'test_coat_dance_vace_worker.py' -v
