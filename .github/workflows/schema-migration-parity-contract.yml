name: Schema Migration Parity

# kind-robots/t-072: catch a prisma/*.prisma structural edit that ships with
# no matching prisma/migrations/ file -- the class of bug that broke
# production in kind-robots/t-071 (schema edited, client regenerated, no
# migration ever written or run). See utils/scripts/verifySchemaMigrationParity.ts.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schema-migration-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-t075:
    if: github.event_name == 'pull_request' && github.head_ref == 'worker/kind-robots-t-075-20260827-a7c9'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rescue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Merge current main, resolve Prisma, and self-clean
        env:
          CYPRESS_INSTALL_BINARY: '0'
          # validate/generate need a syntactically valid datasource URL but do
          # not connect to it. Migration commands remain credential-gated by
          # prisma.config.ts and are never invoked by this helper.
          DATABASE_URL: 'mysql://ci:ci@127.0.0.1:3306/kind_robots_ci'
        run: |
          set -euo pipefail
          git config user.name "kind-robots-t075-sync[bot]"
          git config user.email "kind-robots-t075-sync[bot]@users.noreply.github.com"
          git fetch origin main

          if ! git merge --no-ff --no-commit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              case "$path" in
                prisma/schema.prisma|prisma/generated/prisma/internal/prismaNamespace.ts|prisma/generated/prisma/internal/prismaNamespaceBrowser.ts|prisma/generated/prisma/models/Character.ts)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected merge conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain" >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          fi

          # These two workflow edits exist only to perform this connector-safe
          # sync. They must not survive in the implementation diff.
          git checkout origin/main -- .github/workflows/schema-migration-parity-contract.yml
          if git ls-files --error-unmatch .github/workflows/t075-sync-main.yml >/dev/null 2>&1; then
            git rm .github/workflows/t075-sync-main.yml
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('prisma/schema.prisma')
          text = path.read_text()
          size_line = '  size                 Int                    @default(1)\n'
          comment = '''  /// cthulhuquarium/t-032: tank-capacity weight for this species when placed as\n  /// AquariumStock. Consumed against Aquarium.sizeCap (weighed pool, distinct\n  /// from the counted setSlotsCap -- see SYSTEMS.md "Capacity: two pools, two\n  /// units"). Required going forward; existing rows default to the smallest\n  /// unit so nothing is retroactively over its cap. [v1 placeholder -- actual\n  /// per-species values are a data/authoring pass, not this migration's job.]\n'''
          if size_line not in text or comment not in text:
              raise SystemExit('Expected Character.size/comment block not found on current main; refusing an unreviewed edit')
          text = text.replace(comment + size_line, '', 1)
          path.write_text(text)
          PY

          npm ci
          npx prisma validate
          npx prisma generate
          npm run test:schema-migration-parity-selftest
          GITHUB_BASE_REF=main npm run test:schema-migration-parity

          git add -A
          git diff --cached --check
          git commit -m "Merge current main into t-075 rescue and regenerate Prisma"

          allowed='^(prisma/schema\.prisma|prisma/generated/prisma/internal/prismaNamespace\.ts|prisma/generated/prisma/internal/prismaNamespaceBrowser\.ts|prisma/generated/prisma/models/Character\.ts|prisma/migration-provenance/20260827233000_drop_character_size\.pending\.txt|utils/scripts/schemaMigrationParity\.ts|utils/scripts/schemaMigrationParity\.test\.ts|utils/scripts/verifySchemaMigrationParity\.ts)$'
          unexpected="$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected final PR diff after syncing main:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          echo "Final PR diff:"
          git diff --stat origin/main...HEAD
          git push origin HEAD:${{ github.head_ref }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Schema/migration parity self-test
        run: npm run test:schema-migration-parity-selftest

      - name: Schema/migration parity
        run: npm run test:schema-migration-parity
