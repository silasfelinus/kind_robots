name: t042 schema restore once

on:
  push:
    branches:
      - worker/cthulhuquarium-t042-client-restore

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore t-042 schema fragments exactly
        run: python3 .github/t042_restore_schema.py

      - name: Install and regenerate Prisma client
        run: |
          npm ci
          npx prisma validate
          npx prisma generate

      - name: Commit only the real restoration and remove one-shot helpers
        run: |
          rm .github/workflows/t042-schema-restore-once.yml
          rm .github/t042_restore_schema.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "cthulhuquarium/t-042: restore Prisma client schema wiring"
          git push origin HEAD:worker/cthulhuquarium-t042-client-restore
