name: Storybook Table Deep Link Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/storybook-table-deep-link-contract.yml'
      - 'components/storybook/storybook-table.vue'
      - 'utils/scripts/verifyStorybookTableDeepLinkGuard.mjs'
  workflow_dispatch:

concurrency:
  group: storybook-table-deep-link-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Storybook table deep link contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Storybook table deep link guard
        run: node utils/scripts/verifyStorybookTableDeepLinkGuard.mjs
