name: Apply Faster Art UI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'perf/faster-art-turnaround' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/faster-art-turnaround
      - name: Tune active Project job polling
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('components/pages/conductor-art-gallery.vue')
          source = component.read_text(encoding='utf-8')
          anchor = "const CONDUCTOR_IMAGE_BASE =\n  'https://raw.githubusercontent.com/silasfelinus/conductor/main/projects/images'\n"
          replacement = anchor + 'const PROJECT_ART_STATUS_POLL_MS = 2_000\n'
          if 'const PROJECT_ART_STATUS_POLL_MS = 2_000' not in source:
              if anchor not in source:
                  raise SystemExit('missing Project polling constant anchor')
              source = source.replace(anchor, replacement, 1)
          source = source.replace(
              '    pollTimer = setTimeout(poll, 5000)\n',
              '    pollTimer = setTimeout(poll, PROJECT_ART_STATUS_POLL_MS)\n',
              1,
          )
          component.write_text(source, encoding='utf-8')

          contract = Path('utils/scripts/verifyEntityArtManager.ts')
          check = contract.read_text(encoding='utf-8')
          anchor = "  'startPolling(jobId)',\n])"
          replacement = "  'startPolling(jobId)',\n  'const PROJECT_ART_STATUS_POLL_MS = 2_000',\n  'setTimeout(poll, PROJECT_ART_STATUS_POLL_MS)',\n])"
          if 'PROJECT_ART_STATUS_POLL_MS = 2_000' not in check:
              if anchor not in check:
                  raise SystemExit('missing entity-art contract anchor')
              check = check.replace(anchor, replacement, 1)
          contract.write_text(check, encoding='utf-8')
          PY
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/pages/conductor-art-gallery.vue utils/scripts/verifyEntityArtManager.ts
          git diff --cached --quiet || git commit -m "perf(art): refresh active Project jobs every two seconds"
          git push origin HEAD:perf/faster-art-turnaround
