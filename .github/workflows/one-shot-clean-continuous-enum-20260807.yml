name: One-shot clean continuous enum diff 2026-08-07

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-clean-continuous-enum-20260807.yml
  push:
    branches:
      - claude/project-continuous-enum-20260807
    paths:
      - .github/workflows/one-shot-clean-continuous-enum-20260807.yml

permissions:
  contents: write

env:
  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/kind_robots_ci

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-continuous-enum-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fold in current main
        run: git merge --no-edit origin/main
      - name: Restore compact gallery formatting and reapply lifecycle additions
        run: |
          git show origin/main:components/pages/conductor-project-gallery-page.vue > /tmp/conductor-project-gallery-page.vue
          python - <<'PY'
          from pathlib import Path
          src = Path('/tmp/conductor-project-gallery-page.vue').read_text(encoding='utf-8')
          replacements = [
              ("type Status = 'ACTIVE' | 'PAUSED' | 'DONE' | 'BRAINSTORM' | 'ARCHIVED'", "type Status = 'ACTIVE' | 'CONTINUOUS' | 'PAUSED' | 'DONE' | 'BRAINSTORM' | 'ARCHIVED'"),
              ("const filters = [{ value: 'ACTIVE' as const, label: 'Active', icon: 'kind-icon:sparkles' }, { value: 'PAUSED' as const, label: 'Paused', icon: 'kind-icon:pause' },", "const filters = [{ value: 'ACTIVE' as const, label: 'Active', icon: 'kind-icon:sparkles' }, { value: 'CONTINUOUS' as const, label: 'Continuous', icon: 'kind-icon:refresh' }, { value: 'PAUSED' as const, label: 'Paused', icon: 'kind-icon:pause' },"),
              ("const statusClass = (value: Status) => value === 'DONE' ? 'badge-success' : value === 'PAUSED' ? 'badge-warning' : value === 'ARCHIVED' ? 'badge-ghost' : value === 'BRAINSTORM' ? 'badge-secondary' : 'badge-primary'", "const statusClass = (value: Status) => value === 'DONE' ? 'badge-success' : value === 'CONTINUOUS' ? 'badge-accent' : value === 'PAUSED' ? 'badge-warning' : value === 'ARCHIVED' ? 'badge-ghost' : value === 'BRAINSTORM' ? 'badge-secondary' : 'badge-primary'"),
          ]
          for old, new in replacements:
              if old not in src:
                  raise SystemExit(f'gallery anchor drifted: {old[:60]}')
              src = src.replace(old, new, 1)
          Path('components/pages/conductor-project-gallery-page.vue').write_text(src, encoding='utf-8')
          PY
      - name: Install and regenerate Prisma client from restored split schema
        run: |
          npm ci
          npx prisma generate
      - name: Verify focused lifecycle contract
        run: |
          npx prisma validate
          npm run test:conductor-api-auth-guards
          npx nuxi prepare
          npx vue-tsc --noEmit
          npx eslint server/utils/conductorProjectRegistry.ts server/api/projects/index.ts server/api/conductor/project-state.post.ts server/api/conductor/sync.post.ts server/api/conductor/overrides.post.ts components/pages/conductor-page.vue components/pages/conductor-project-gallery-page.vue utils/scripts/verifyConductorProjectRegistry.ts
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-clean-continuous-enum-20260807.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: trim continuous lifecycle diff" || exit 0
          git push origin HEAD:claude/project-continuous-enum-20260807
