name: Zuzu temporary scoped formatter
on:
  push:
    branches: [worker/zuzu-shifting-lands-t006-journey-20261009-f83c]
    paths:
      - '.github/workflows/zuzu-prettier-one-shot.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/zuzu-shifting-lands-t006-journey-20261009-f83c
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx prettier --write utils/scripts/importShiftingLandsWorld.mjs utils/scripts/verifyShiftingJourney.test.ts utils/shiftingLands/journey.ts
      - name: Commit only formatted source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utils/scripts/importShiftingLandsWorld.mjs utils/scripts/verifyShiftingJourney.test.ts utils/shiftingLands/journey.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Format Shifting Lands journey source and contract tests'
            git push origin HEAD:worker/zuzu-shifting-lands-t006-journey-20261009-f83c
          fi
