name: Aquarium Console Layout

on:
  pull_request:
    paths:
      - 'components/conductor/aquarium-page.vue'
      - 'components/cthulhuquarium/cthulhuquarium-game.vue'
      - 'utils/scripts/verifyCthulhuquariumConsole.mjs'
      - '.github/workflows/aquarium-console-layout.yml'

concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  console-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure one bounded game stage and overlay rooms
        run: node utils/scripts/verifyCthulhuquariumConsole.mjs
