name: Apply retired-provider cleanup rescue

on:
  push:
    branches:
      - worker/retired-provider-cleanup-rescue-20260812
    paths:
      - .github/workflows/apply-retired-provider-cleanup-rescue.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rescue branch
        uses: actions/checkout@v4
        with:
          ref: worker/retired-provider-cleanup-rescue-20260812
          fetch-depth: 0

      - name: Reapply the scoped cleanup from PR 1830
        run: |
          set -euo pipefail
          git fetch origin e006d162ed8fb07574dd85bcd20344067ba46cf1 16782337a26b51175a4871b3bf2835d34b192f22
          git diff e006d162ed8fb07574dd85bcd20344067ba46cf1 16782337a26b51175a4871b3bf2835d34b192f22 -- \
            .github/workflows/publish-container.yml \
            .github/workflows/stored-art-paths.yml \
            scripts/check-deploy-noop.mjs \
            scripts/db-connection-retry.mjs \
            scripts/db-write-smoke.mjs \
            scripts/lib/deployIgnorePaths.mjs \
            utils/scripts/verifyAppBaseUrl.ts \
            utils/scripts/verifyDatabasePoolDefaults.ts \
            utils/scripts/verifyDeployWaitNoOp.ts \
            > /tmp/scoped-cleanup.patch
          git apply --3way /tmp/scoped-cleanup.patch

      - name: Clean references that predate or postdate PR 1830
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '.github/workflows/fallback-snapshot.yml': [('Vercel env vars', 'retired hosting-provider env vars')],
              'scripts/db-write-repro.mjs': [('Vercel→ProxySQL TLS', 'retired serverless host→ProxySQL TLS')],
              'scripts/run_facet_catalog_maintenance.ts': [('Vercel production deployments can overlap', 'Serverless production deployments can overlap')],
              'utils/scripts/auditGalleryChrome.ts': [('https://<preview>.vercel.app', 'https://<preview-host>')],
              'utils/scripts/exportPageBackdropArt.ts': [('Vercel cannot write to the', 'ephemeral serverless runtimes cannot write to the')],
              'utils/scripts/offloadArtImageData.ts': [('Vercel cannot', 'ephemeral serverless runtimes cannot')],
              'utils/scripts/repairRewardImagePaths.ts': [('which Vercel 307s to', 'which the retired host redirected to')],
              'utils/scripts/seedFacetCatalog.ts': [("Vercel's max build time", 'the former serverless build-time limit')],
              'utils/scripts/verifyArtImageCaching.ts': [('Vercel function invocations', 'serverless function invocations')],
              'utils/scripts/verifyMigrateOnDeploy.ts': [
                  ('Migrations stopped running anywhere when Vercel was retired:', 'Migrations stopped running when the former hosted deploy path was retired:'),
                  ('`scripts/vercel-build.mjs` had been the thing that ran them, and the container', 'The provider-specific build script had been the thing that ran them, and the container'),
              ],
              'utils/scripts/verifyNoPromiseInStoreState.ts': [('kind-robots.vercel.app', 'the former production host')],
              'utils/scripts/verifyNoUnquotedReservedWordTables.ts': [('`npm run vercel-build`', 'the former provider-specific build command')],
              'server/utils/databasePoolDefaults.ts': [('Vercel deployment path', 'former serverless deployment path')],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in changes:
                  text = text.replace(old, new)
              path.write_text(text)

          ignore_files = [
              'utils/scripts/verifyAdminFlagCasts.ts',
              'utils/scripts/verifyCaptureGroupGuards.ts',
              'utils/scripts/verifyFetchGenericPinning.ts',
              'utils/scripts/verifyNoPrismaJsonCast.ts',
              'utils/scripts/verifyNoUnquotedReservedWordTables.ts',
          ]
          for filename in ignore_files:
              path = Path(filename)
              lines = path.read_text().splitlines(keepends=True)
              path.write_text(''.join(line for line in lines if "'.vercel'" not in line.lower()))
          PY

      - name: Verify combined cleanup
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-retired-provider-cleanup-rescue.yml
          node utils/scripts/verifyRetiredProviderRefs.mjs

      - name: Push non-workflow cleanup
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts utils server
          git commit -m 'chore: remove retired provider references from scripts'
          git push origin HEAD:worker/retired-provider-cleanup-rescue-20260812
