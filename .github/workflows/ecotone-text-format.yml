name: Ecotone text formatting pass
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ecotone-text-format.yml
      - utils/ecotone/**
      - utils/scripts/verifyEcotone.test.ts
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.number == 3903
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: worker/ecotone-complete-text-art-pitches-20261020
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format files in the authored script pass
        run: |
          npx prettier --write \
            utils/ecotone/regionalPremises.json \
            utils/ecotone/regionalData/*.json \
            utils/ecotone/regionalQuestFactory.ts \
            utils/ecotone/conceptArtPitches.ts \
            utils/ecotone/journeySignatures.ts \
            utils/ecotone/regionalCallbacks.ts \
            utils/ecotone/content.ts \
            utils/ecotone/questExpansion.ts \
            utils/ecotone/story.ts \
            utils/scripts/verifyEcotone.test.ts
          npx prettier --write docs/ecotone/text-kit/*.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/ecotone utils/scripts/verifyEcotone.test.ts docs/ecotone/text-kit
          if ! git diff --cached --quiet; then
            git commit -m "style(ecotone): format complete narrative scripts and art brief registry"
            git pull --rebase origin worker/ecotone-complete-text-art-pitches-20261020
            git push origin HEAD:worker/ecotone-complete-text-art-pitches-20261020
          fi
