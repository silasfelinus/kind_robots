# Repair Reward.imagePath — put the /images root back.
#
# Every stored Reward.imagePath begins `/rewards/...`; the real files live under
# `/images/rewards/...`. `/rewards/anything.webp` does not 404 — it falls through
# to the SPA catch-all and returns 200 with the Nuxt app shell, so 214 of 227
# rewards have been serving 142 KB of HTML where an image belongs, with every
# status-code check reading it as healthy.
#
# The database is not reachable from an agent sandbox (TCP to the ProxySQL port
# is blocked), and it IS reachable from here. See
# utils/scripts/repairRewardImagePaths.ts for the measurements.
#
# workflow_dispatch only, dry_run true by default. This writes to production
# rows; nothing should trigger it as a side effect of a push or a schedule.
name: Repair Reward Image Paths

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the plan without writing (recommended first)'
        type: boolean
        default: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # ProxySQL enforces TLS; the script's adapter is the same SSL-aware one
      # server/utils/prisma.ts uses, and reads either form of the CA.
      DATABASE_SSL_CA_BASE64: ${{ secrets.DATABASE_SSL_CA_BASE64 }}
      DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
    steps:
      - name: Require the database secret
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is not set; nothing to do."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Generate Prisma client
        run: npx prisma generate

      # The rewrite rule decides which rows get written, so prove it still
      # refuses /api/art paths before pointing it at production.
      - name: Self-test the rewrite rule
        run: npm run test:reward-image-paths-selftest

      - name: Repair reward image paths
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx utils/scripts/repairRewardImagePaths.ts
          else
            npx tsx utils/scripts/repairRewardImagePaths.ts --apply
          fi
