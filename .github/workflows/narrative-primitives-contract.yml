name: Narrative Primitives Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/narrative-primitives-contract.yml'
      - 'components/narrative/narrative-ingredient-card.vue'
      - 'components/narrative/narrative-ingredient-picker.vue'
      - 'components/narrative/kr-chat-window.vue'
      - 'utils/narrativeTurns.ts'
      - 'components/narrative/narrative-response-composer.vue'
      - 'components/conductor/storybook-page.vue'
      - 'utils/scripts/verifyNarrativePrimitives.mjs'
  workflow_dispatch:

concurrency:
  group: narrative-primitives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Shared narrative UI contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify shared narrative primitives
        run: node utils/scripts/verifyNarrativePrimitives.mjs
