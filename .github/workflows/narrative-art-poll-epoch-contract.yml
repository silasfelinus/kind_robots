name: Narrative Art Poll Epoch Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/narrative-art-poll-epoch-contract.yml'
      - 'stores/helpers/narrativeArtJobsHelper.ts'
      - 'utils/scripts/verifyNarrativeArtPollEpochGuard.mjs'
  workflow_dispatch:

concurrency:
  group: narrative-art-poll-epoch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Narrative art poll epoch contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify narrative art poll epoch guard
        run: node utils/scripts/verifyNarrativeArtPollEpochGuard.mjs
