name: Emperor of Dust Dispatch Contract

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'utils/emperorOfDust/**'
      - 'utils/scripts/verifyEmperorFortress.test.ts'
      - 'utils/scripts/verifyEmperorFortressBalance.test.ts'
      - 'utils/scripts/verifyEmperorFortressAdversarial.test.ts'
      - 'utils/scripts/verifyEmperorRefugeeLegacy.test.ts'
      - 'utils/scripts/verifyEmperorYardWaterDebt.test.ts'
      - 'utils/scripts/verifyEmperorMarketAccount.test.ts'
      - 'utils/scripts/verifyEmperorMarketAccountMatrix.test.ts'
      - 'utils/scripts/verifyEmperorEditorialAcceptance.test.ts'
      - 'utils/scripts/verifyEmperorGuidedCampaigns.test.ts'
      - 'utils/scripts/verifyEmperorSecondPassTraces.test.ts'
      - 'utils/scripts/verifyEmperorEndingWitnesses.test.ts'
      - 'utils/scripts/verifyEmperorFortressStore.test.ts'
      - 'tests/emperorScrapbook.test.ts'
      - 'utils/scripts/verifyEmperorFortressOnboardingLayout.test.ts'
      - 'utils/scripts/verifyEmperorRoleFirstProse.test.ts'
      - 'utils/scripts/verifyEmperorFortressChanceEvents.test.ts'
      - 'utils/scripts/verifyEmperorQuestBriefs.test.ts'
      - 'utils/scripts/verifyEmperorQuestArt.test.ts'
      - 'utils/scripts/verifyEmperorArtRouteCoverage.test.ts'
      - 'utils/scripts/verifyEmperorIllustratedAftermaths.test.ts'
      - 'utils/scripts/verifyEmperorArtDelivery.test.ts'
      - 'utils/scripts/verifyEmperorArtReview.test.ts'
      - 'server/api/admin/emperor-of-dust/**'
      - 'public/emperor-of-dust/**'
      - 'utils/scripts/verifyEmperorItemArt.test.ts'
      - 'utils/emperorOfDust/fortress/items.ts'
      - 'utils/scripts/verifyEmperorFortressSecretTalks.test.ts'
      - 'utils/scripts/verifyEmperorTalkPlates.test.ts'
      - 'utils/scripts/verifyEmperorOfDustAchievements.test.ts'
      - 'utils/achievements/catalog/main/emperor-of-dust.ts'
      - 'utils/scripts/emperorFortressBalanceReport.ts'
      - 'stores/emperorFortressStore.ts'
      - 'stores/emperorArtReviewStore.ts'
      - 'pages/admin/emperor-art-review.vue'
      - 'components/EmperorFortressThrone.vue'
      - 'components/EmperorFortressBarracks.vue'
      - 'components/EmperorFortressDawn.vue'
      - 'components/EmperorFortressChronicle.vue'
      - 'components/EmperorFortressEndings.vue'
      - 'components/EmperorFortressEndingPlate.vue'
      - 'components/EmperorFortressIntro.vue'
      - 'components/EmperorFortressQuests.vue'
      - 'components/EmperorFortressMapRoom.vue'
      - 'components/EmperorFortressCodex.vue'
      - 'components/EmperorFortressFinish.vue'
      - 'components/EmperorFortressLedger.vue'
      - 'components/EmperorFortressPortrait.vue'
      - 'components/EmperorFortressDialogue.vue'
      - 'components/EmperorFortressBriefing.vue'
      - 'components/EmperorFortressEpilogue.vue'
      - 'components/EmperorFortressMarket.vue'
      - 'components/EmperorFortressMarketRow.vue'
      - 'components/EmperorFortressCodexNote.vue'
      - 'components/EmperorFortressQuestImage.vue'
      - 'pages/play/emperor-of-dust.vue'
      - '.github/workflows/emperor-dispatch-contract.yml'
concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Seeded dispatch and recovery contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx tsx utils/scripts/verifyEmperorFortress.test.ts
      - run: npx tsx utils/scripts/verifyEmperorFortressBalance.test.ts
      - run: npx tsx utils/scripts/verifyEmperorFortressStore.test.ts
      - run: npx tsx tests/emperorScrapbook.test.ts
      - run: npx tsx utils/scripts/verifyEmperorFortressOnboardingLayout.test.ts
      - run: npx tsx utils/scripts/verifyEmperorRoleFirstProse.test.ts
      - run: npx tsx utils/scripts/verifyEmperorFortressChanceEvents.test.ts
      - run: npx tsx utils/scripts/verifyEmperorQuestBriefs.test.ts
      - run: npx tsx utils/scripts/verifyEmperorQuestArt.test.ts
      - name: Verify every authored scene has physical illustration coverage
        run: npx tsx utils/scripts/verifyEmperorArtRouteCoverage.test.ts
        env:
          KIND_ROBOTS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify illustrated answers and barracks dialogue after save and rewind
        run: npx tsx utils/scripts/verifyEmperorIllustratedAftermaths.test.ts
      - run: npx tsx utils/scripts/verifyEmperorArtDelivery.test.ts
      - run: npx tsx utils/scripts/verifyEmperorArtReview.test.ts
      - run: npx tsx utils/scripts/verifyEmperorItemArt.test.ts
      - run: npx tsx utils/scripts/verifyEmperorFortressSecretTalks.test.ts
      - run: npx tsx utils/scripts/verifyEmperorTalkPlates.test.ts
      - run: npx tsx utils/scripts/verifyEmperorOfDustAchievements.test.ts
      - run: npx tsx utils/scripts/verifyEmperorFortressAdversarial.test.ts
      - name: Verify refugee-ledger choices endure to the final epilogue
        run: npx tsx utils/scripts/verifyEmperorRefugeeLegacy.test.ts
      - name: Verify Yard water debt across three acts and public record endings
        run: npx tsx utils/scripts/verifyEmperorYardWaterDebt.test.ts
      - name: Verify the market account across four acts and ending records
        run: npx tsx utils/scripts/verifyEmperorMarketAccount.test.ts
      - name: Exhaustively verify 54 market-account paths and resource gates
        run: npx tsx utils/scripts/verifyEmperorMarketAccountMatrix.test.ts
      - name: Eighteen real five-act campaigns through earned recent choices
        run: npx tsx utils/scripts/verifyEmperorGuidedCampaigns.test.ts
      - name: Record sixteen replayable model-simulation transcripts
        run: npx tsx utils/scripts/verifyEmperorSecondPassTraces.test.ts
        env:
          KIND_ROBOTS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record eight earned ending-family campaign witnesses
        run: npx tsx utils/scripts/verifyEmperorEndingWitnesses.test.ts
        env:
          KIND_ROBOTS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Complete authored narrative screening and independent 50-day campaigns
        run: npx tsx utils/scripts/verifyEmperorEditorialAcceptance.test.ts
      - name: Preserve per-scene, quest and follower score register
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emperor-editorial-screening
          path: |
            artifacts/emperor/editorial-*
            artifacts/emperor/second-pass-*
          retention-days: 30
          if-no-files-found: warn
