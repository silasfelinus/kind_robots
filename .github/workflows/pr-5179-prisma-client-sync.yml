name: PR 5179 one-shot Prisma client sync

on:
  push:
    branches:
      - worker/zuzu-gamebook-t015-cloud-continue-c931
    paths:
      - .github/workflows/pr-5179-prisma-client-sync.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the existing PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked generator dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Regenerate Prisma client from the PR schema
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://user:pass@127.0.0.1:3306/kindrobots
      - name: Commit the generated client only
        shell: bash
        run: |
          set -euo pipefail
          git add -f prisma/generated/prisma
          git diff --cached --quiet && { echo 'No generated changes to commit'; exit 0; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(prisma): regenerate client for Zuzu account saves'
          git push origin "HEAD:$GITHUB_REF_NAME"
