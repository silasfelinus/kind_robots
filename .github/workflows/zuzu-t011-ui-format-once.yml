name: One-shot Shifting Lands trial UI formatter
on:
  push:
    branches: [worker/zuzu-shifting-lands-t011-authored-trials-20261011-b58c]
    paths: ['.github/workflows/zuzu-t011-ui-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/zuzu-shifting-lands-t011-authored-trials-20261011-b58c
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Format source and self-remove
        run: |
          npx prettier --write components/shifting-lands-journey-board.vue
          git rm .github/workflows/zuzu-t011-ui-format-once.yml
          git add components/shifting-lands-journey-board.vue
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(shifting-lands): format nullable boss result display'
          git push origin HEAD:refs/heads/worker/zuzu-shifting-lands-t011-authored-trials-20261011-b58c
