name: Temporary production CSS repair

on:
  push:
    branches:
      - worker/interface-vision-t104-publish-fix-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: worker/interface-vision-t104-publish-fix-20260906
          fetch-depth: 0

      - name: Remove obsolete DaisyUI bordered modifiers
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('assets/css/tailwind.css')
          text = css.read_text(encoding='utf-8')
          replacements = {
              'input input-bordered input-sm': 'input input-sm',
              'select select-bordered select-sm': 'select select-sm',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f'Expected exactly 2 occurrences of {old!r}, found {count}')
              text = text.replace(old, new)
          css.write_text(text, encoding='utf-8')

          Path('.github/workflows/repair-production-css-temp.yml').unlink()
          PY

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "kind-robots-worker"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css/tailwind.css .github/workflows/repair-production-css-temp.yml
          git commit -m "fix: restore DaisyUI v5 production CSS build"
          git push origin HEAD:worker/interface-vision-t104-publish-fix-20260906
