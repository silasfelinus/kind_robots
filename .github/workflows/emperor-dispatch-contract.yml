name: Emperor of Dust Dispatch Contract

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'utils/emperorOfDust/**'
      - 'utils/scripts/verifyEmperorFortress.test.ts'
      - 'utils/scripts/verifyEmperorFortressBalance.test.ts'
      - 'utils/scripts/verifyEmperorFortressAdversarial.test.ts'
      - 'utils/scripts/verifyEmperorFortressStore.test.ts'
      - 'utils/scripts/verifyEmperorFortressOnboardingLayout.test.ts'
      - 'utils/scripts/verifyEmperorRoleFirstProse.test.ts'
      - 'utils/scripts/verifyEmperorFortressChanceEvents.test.ts'
      - 'utils/scripts/verifyEmperorQuestBriefs.test.ts'
      - 'utils/scripts/verifyEmperorFortressSecretTalks.test.ts'
      - 'utils/scripts/emperorFortressBalanceReport.ts'
      - 'stores/emperorFortressStore.ts'
      - 'components/EmperorFortress*.vue'
      - 'pages/play/emperor-of-dust.vue'
      - '.github/workflows/emperor-dispatch-contract.yml'
jobs:
  dispatch:
    name: Seeded dispatch and recovery contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx tsx utils/scripts/verifyEmperorFortress.test.ts
      - run: npx tsx utils/scripts/verifyEmperorFortressBalance.test.ts
      - run: npx tsx utils/scripts/verifyEmperorFortressStore.test.ts
      - run: npx tsx utils/scripts/verifyEmperorFortressOnboardingLayout.test.ts
      - run: npx tsx utils/scripts/verifyEmperorRoleFirstProse.test.ts
      - run: npx tsx utils/scripts/verifyEmperorFortressChanceEvents.test.ts
      - run: npx tsx utils/scripts/verifyEmperorQuestBriefs.test.ts
      - run: npx tsx utils/scripts/verifyEmperorFortressSecretTalks.test.ts
      - run: npx tsx utils/scripts/verifyEmperorFortressAdversarial.test.ts
