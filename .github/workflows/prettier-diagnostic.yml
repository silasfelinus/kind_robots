name: Temporary Prettier Diagnostic

on:
  pull_request:
    paths:
      - 'components/dreams/dream-narration.vue'
      - '.github/workflows/prettier-diagnostic.yml'

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write components/dreams/dream-narration.vue
          git diff -- components/dreams/dream-narration.vue
          test -z "$(git status --short components/dreams/dream-narration.vue)"
