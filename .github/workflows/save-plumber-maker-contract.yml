name: Save Plumber Maker Gameplay Contract
on:
  pull_request:
    paths:
      - 'utils/arcade/games/savePlumberMaker.ts'
      - 'utils/arcade/games/savePlumberLevels.ts'
      - 'utils/arcade/games/savePlumberPreview.ts'
      - 'utils/arcade/games/savePlumberWorlds.ts'
      - 'utils/arcade/games/savePlumberOverworld.ts'
      - 'utils/arcade/games/savePlumberGen2Worlds.json'
      - 'components/arcade/plumber-level-maker.vue'
      - 'components/arcade/plumber-maker-sidebar.vue'
      - 'stores/savePlumberMakerStore.ts'
      - 'utils/scripts/verifySavePlumberMaker.test.ts'
      - 'utils/scripts/verifySavePlumberMovementReplay.test.ts'
      - 'utils/scripts/verifySavePlumberOverworld.test.ts'
      - 'utils/scripts/verifySavePlumberGears.test.ts'
      - 'utils/scripts/verifySavePlumberPreview.test.ts'
      - 'utils/scripts/verifyCabinetSavePlumberScalePlates.test.ts'
      - 'utils/scripts/verifyCabinetSavePlumberSpringfruit.test.ts'
      - 'utils/scripts/verifyCabinetSavePlumberGurgle.test.ts'
      - 'utils/scripts/verifyCabinetSavePlumberWildwater.test.ts'
      - 'utils/scripts/verifyCabinetSavePlumberPottingShed.test.ts'
      - 'utils/scripts/verifyCabinetSavePlumberWorldOneRooms.test.ts'
      - '.github/workflows/save-plumber-maker-contract.yml'
permissions:
  contents: read
env:
  CYPRESS_INSTALL_BINARY: '0'

concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  maker-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify playable Maker geometry, templates, controls and campaign isolation
        run: npx tsx utils/scripts/verifySavePlumberMaker.test.ts
      - name: Verify campaign movement, physics and checkpoints
        run: npx tsx utils/scripts/verifySavePlumberMovementReplay.test.ts
      - name: Verify overworld exits, progression and save round trips
        run: npx tsx utils/scripts/verifySavePlumberOverworld.test.ts
      - name: Verify secret routes are physically reachable
        run: npx tsx utils/scripts/verifySavePlumberGears.test.ts --secret-exits-only
      - name: Verify opening flow, music and action cues
        run: npx tsx utils/scripts/verifySavePlumberPreview.test.ts
      - name: Verify scale plates and sluice gates
        run: npx tsx utils/scripts/verifyCabinetSavePlumberScalePlates.test.ts
      - name: Verify springfruit bounce, carry, plates and Rootcellar solo route
        run: npx tsx utils/scripts/verifyCabinetSavePlumberSpringfruit.test.ts
      - name: Verify Gurgle swimming, slurping and save isolation
        run: npx tsx utils/scripts/verifyCabinetSavePlumberGurgle.test.ts
      - name: Verify Wildwater activation, rooftop climb and persistent pearl
        run: npx tsx utils/scripts/verifyCabinetSavePlumberWildwater.test.ts
      - name: Verify Copper Greenhouses shed and chimney traversal
        run: npx tsx utils/scripts/verifyCabinetSavePlumberPottingShed.test.ts
      - name: Verify Rustbolt press duct and Pump Tower boiler loop
        run: npx tsx utils/scripts/verifyCabinetSavePlumberWorldOneRooms.test.ts
