name: Storybook Character Deep Link Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: storybook-character-deep-link-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Storybook character deep link contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Storybook character deep link guard
        run: node utils/scripts/verifyStorybookCharacterDeepLinkGuard.mjs
