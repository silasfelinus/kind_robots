name: Temporary Daily Pitch Formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  formatted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project formatter
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Format daily pitch additions
        run: npx prettier --write 'pages/play/daily-pitches/index.vue' 'pages/play/daily-pitches/[slug].vue' 'server/api/conductor/pitch-ready.post.ts' 'server/utils/conductorPitchVote.ts' 'server/utils/conductorProjection.ts' 'stores/conductorStore.ts' 'utils/approvedPitchProgress.ts' 'utils/scripts/verifyApprovedPitchProgress.test.ts' 'utils/scripts/verifyPitchDecision.test.ts'
      - name: Emit formatted manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = ["pages/play/daily-pitches/index.vue","pages/play/daily-pitches/[slug].vue","server/api/conductor/pitch-ready.post.ts","server/utils/conductorPitchVote.ts","server/utils/conductorProjection.ts","stores/conductorStore.ts","utils/approvedPitchProgress.ts","utils/scripts/verifyApprovedPitchProgress.test.ts","utils/scripts/verifyPitchDecision.test.ts"]
          print('KR_FORMATTED_PITCH_JSON:' + json.dumps({path: Path(path).read_text() for path in paths}, ensure_ascii=True))
          PY
