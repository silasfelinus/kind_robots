name: Temporary Tzaddik formatting export
on:
  push:
    branches:
      - worker/tzaddik-gallery-top36-voting-20261011-1726-a8
permissions:
  contents: read
jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format edited files and export formatted source
        shell: bash
        run: |
          npx prettier --write components/tzaddik/tzaddik-ranked-card.vue content/channels/admin/tzaddik-gallery.md pages/tzaddik-gallery.vue server/api/tzaddik/index.get.ts server/api/tzaddik/vote.post.ts stores/tzaddikStore.ts
          node <<'NODE'
          const fs = require('node:fs')
          for (const path of [
            'components/tzaddik/tzaddik-ranked-card.vue',
            'content/channels/admin/tzaddik-gallery.md',
            'pages/tzaddik-gallery.vue',
            'server/api/tzaddik/index.get.ts',
            'server/api/tzaddik/vote.post.ts',
            'stores/tzaddikStore.ts',
          ]) {
            console.log('TZADDIK_FORMATTED_JSON:' + JSON.stringify({path, content: fs.readFileSync(path, 'utf8')}))
          }
          NODE
