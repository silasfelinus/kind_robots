name: Fast Changed-File Formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: changed-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prettier-changed:
    name: Changed-file Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install formatter without project lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify changed-file selector
        run: npm run test:format-changed

      - name: Check PR formatting and print exact fixes if needed
        run: npm run format:check-changed -- --show-fix
