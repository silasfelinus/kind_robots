name: Apply Component Schema Retirement

on:
  push:
    branches:
      - gpt/component-schema-retirement
    paths:
      - 'scripts/apply-component-schema-retirement.mjs'
      - '.github/workflows/component-schema-retirement-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/component-schema-retirement
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Apply deterministic retirement transform
        run: node scripts/apply-component-schema-retirement.mjs

      - name: Regenerate Prisma client
        run: npx prisma generate

      - name: Remove one-shot tooling
        run: |
          rm scripts/apply-component-schema-retirement.mjs
          rm .github/workflows/component-schema-retirement-apply.yml

      - name: Commit transformed schema
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: retire Component database schema'
          git push origin HEAD:gpt/component-schema-retirement
