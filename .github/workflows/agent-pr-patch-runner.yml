name: Agent PR Patch Runner

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/agent_patch_project_gallery.py"

permissions:
  contents: write

jobs:
  patch-project-gallery:
    if: github.head_ref == 'agent/project-gallery-art-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply repository-aware patch
        run: python scripts/agent_patch_project_gallery.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install validation dependencies
        run: npm ci --ignore-scripts

      - name: Format patched files
        run: npx prettier --write components/pages/conductor-overview-gallery-page.vue plugins/missing-image-reporter.client.ts server/api/conductor/art-request.post.ts server/api/conductor/project-art-complete.post.ts server/utils/artRequestYaml.ts utils/scripts/verifyArtRequestYaml.ts

      - name: Validate art request YAML contract
        run: npm run test:art-request-yaml

      - name: Commit finished patch
        run: |
          rm scripts/agent_patch_project_gallery.py
          rm .github/workflows/agent-project-gallery-art-pipeline.yml
          git config user.name "kind-conductor"
          git config user.email "kind-conductor@users.noreply.github.com"
          git add -A
          git commit -m "fix project gallery filtering and art completion sync"
          git push origin HEAD:${{ github.head_ref }}
