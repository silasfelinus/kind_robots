name: Temporary Zuzu gamebook branch formatter

on:
  push:
    branches:
      - worker/zuzu-gamebook-play-20261007-1727

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Format only new gamebook code using pinned Prettier
        run: |
          npx prettier --write pages/play/zuzu-gamebook.vue stores/zuzuGamebookStore.ts utils/zuzuGamebook/adventure.ts utils/scripts/verifyZuzuGamebook.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/play/zuzu-gamebook.vue stores/zuzuGamebookStore.ts utils/zuzuGamebook/adventure.ts utils/scripts/verifyZuzuGamebook.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(zuzu-gamebook): format new files with Prettier'
            git push origin HEAD:worker/zuzu-gamebook-play-20261007-1727
          fi
