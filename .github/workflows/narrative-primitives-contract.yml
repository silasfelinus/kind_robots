name: Narrative Primitives Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: narrative-primitives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Shared narrative UI contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify shared narrative primitives
        run: node utils/scripts/verifyNarrativePrimitives.mjs
