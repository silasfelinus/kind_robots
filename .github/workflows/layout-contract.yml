name: Layout Contract

# Guards the Kind Robots layout contract (conductor project interface-vision).
# The baseline in utils/scripts/layout-contract-baseline.json is a RATCHET: this
# job fails when a PR introduces a violation that is not already in it, and the
# --update flag refuses to record a larger count. See
# utils/scripts/verifyLayoutContract.ts for the rules and the reasoning.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: layout-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Verify layout contract
        run: npm run test:layout-contract

      - name: Verify mixed pane primitive fixture
        run: npx tsx utils/scripts/verifyMixedPanePrimitivesFixture.ts

      - name: Layout header contract self-test
        run: npm run test:layout-header-contract-selftest

      - name: Syntax-check changed shell scripts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mapfile -d '' shell_files < <(git diff --name-only --diff-filter=ACMR -z "${{ github.event.pull_request.base.sha }}...HEAD" -- '*.sh')
          for file in "${shell_files[@]}"; do
            echo "bash -n $file"
            bash -n "$file"
          done

      - name: Audit test-prefixed commits for executable assertions
        if: github.event_name == 'pull_request'
        run: bash scripts/check-test-commit-assertions.sh "${{ github.event.pull_request.base.sha }}"
