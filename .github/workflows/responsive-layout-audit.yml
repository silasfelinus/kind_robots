name: Responsive Layout Audit

# Measures real rendered geometry against the current production site. Preview
# deployments are retired; scheduled and manual runs exercise kindrobots.org.
on:
  schedule:
    # Daily, not hourly: the sweep costs ~an hour of runner time against
    # production and competes with PR checks for runner slots. Dispatch
    # manually after a layout-heavy deploy if you need a fresh reading sooner.
    - cron: '41 12 * * *' # 12:41 UTC ≈ 4:41am Pacific
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to audit (defaults to production)'
        required: false
        default: 'https://kindrobots.org'
      routes:
        description: 'Comma-separated routes to audit'
        required: false
        default: ''

concurrency:
  group: responsive-layout-audit-database
  cancel-in-progress: false

jobs:
  # interface-vision/t-154: the single-job sweep (~78 routes x 3 viewports)
  # outgrew its 60-minute timeout every day, and the Clash, gallery-chrome and
  # tablet-menu audits queued behind it were skipped. The route sweep is now a
  # matrix of disjoint round-robin shards (every route still audited at every
  # viewport), and the other audits run in their own job so a slow sweep can
  # never skip them.
  audit:
    name: Route sweep shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Measured 2026-11-16 against production: ~34s per route/viewport
      # page, so 234 pages is ~130 runner-minutes. Six shards keep each job
      # near 22 minutes; three at a time limits concurrent load on prod.
      max-parallel: 3
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve target URL
        id: target
        env:
          INPUT_URL: ${{ github.event.inputs.base_url }}
        run: |
          set -euo pipefail
          url="${INPUT_URL:-https://kindrobots.org}"
          url="${url%/}"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "Auditing $url"

      - name: Wait for the site to answer
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          echo "Waiting up to 300s for ${BASE_URL} to return 200..."
          deadline=$(( $(date +%s) + 300 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${BASE_URL}/" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "Site is answering."
              exit 0
            fi
            echo "  got ${code}; retrying in 10s..."
            sleep 10
          done
          echo "::error::${BASE_URL} never returned 200 within 300s."
          exit 1

      - name: Wait for the database
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          echo "Waiting for three consecutive healthy database checks..."
          deadline=$(( $(date +%s) + 180 ))
          consecutive=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -sf --max-time 15 "${BASE_URL}/api/health/database" \
                 | jq -e '.success == true and .statusCode == 200' >/dev/null 2>&1; then
              consecutive=$(( consecutive + 1 ))
              echo "  database healthy (${consecutive}/3)"
              [ "$consecutive" -ge 3 ] && exit 0
            else
              consecutive=0
              echo "  database unavailable; retrying in 5s..."
            fi
            sleep 5
          done
          echo "::error::Database was not healthy for three consecutive checks; an audit now would measure empty states rather than real galleries."
          exit 1

      - name: Audit responsive layout
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          ROUTES: ${{ github.event.inputs.routes }}
          SHARD: ${{ matrix.shard }}/6
        run: |
          set -euo pipefail
          if [ -n "${ROUTES:-}" ]; then
            npm run audit:responsive -- --base "$BASE_URL" --shard "$SHARD" --routes "$ROUTES" --shots audit-shots --viewport-report audit-shots/viewport-ownership.json
          else
            npm run audit:responsive -- --base "$BASE_URL" --shard "$SHARD" --shots audit-shots --viewport-report audit-shots/viewport-ownership.json
          fi

      - name: Upload screenshots and viewport ownership atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: audit-shots/
          retention-days: 7
          if-no-files-found: ignore

  controls:
    name: Clash, gallery chrome and tablet menu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Resolve target URL
        id: target
        env:
          INPUT_URL: ${{ github.event.inputs.base_url }}
        run: |
          set -euo pipefail
          url="${INPUT_URL:-https://kindrobots.org}"
          url="${url%/}"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "Auditing $url"

      - name: Wait for the site to answer
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          echo "Waiting up to 300s for ${BASE_URL} to return 200..."
          deadline=$(( $(date +%s) + 300 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${BASE_URL}/" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "Site is answering."
              exit 0
            fi
            echo "  got ${code}; retrying in 10s..."
            sleep 10
          done
          echo "::error::${BASE_URL} never returned 200 within 300s."
          exit 1

      - name: Wait for the database
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          echo "Waiting for three consecutive healthy database checks..."
          deadline=$(( $(date +%s) + 180 ))
          consecutive=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -sf --max-time 15 "${BASE_URL}/api/health/database" \
                 | jq -e '.success == true and .statusCode == 200' >/dev/null 2>&1; then
              consecutive=$(( consecutive + 1 ))
              echo "  database healthy (${consecutive}/3)"
              [ "$consecutive" -ge 3 ] && exit 0
            else
              consecutive=0
              echo "  database unavailable; retrying in 5s..."
            fi
            sleep 5
          done
          echo "::error::Database was not healthy for three consecutive checks; an audit now would measure empty states rather than real galleries."
          exit 1

      # /play/slime-city needs an account, so this audit signs in as an
      # ordinary non-admin audit account. Until those two secrets exist the
      # step reports that it skipped instead of failing every day.
      - name: Audit Slime City Clash controls
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          KR_AUDIT_USERNAME: ${{ secrets.KR_AUDIT_USERNAME }}
          KR_AUDIT_PASSWORD: ${{ secrets.KR_AUDIT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KR_AUDIT_USERNAME" ] || [ -z "$KR_AUDIT_PASSWORD" ]; then
            echo "::notice::Slime City Clash controls audit skipped: no audit account. Add a non-admin account as the KR_AUDIT_USERNAME and KR_AUDIT_PASSWORD repository secrets to turn it on."
            exit 0
          fi
          npm run audit:slime-city-clash-layout -- --base "$BASE_URL" --shots audit-shots

      - name: Audit gallery chrome budget
        if: always()
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
        run: npm run audit:gallery-chrome -- --base "$BASE_URL"

      - name: Audit tablet navigation menu
        if: always()
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
        run: npm run audit:tablet-nav -- --base "$BASE_URL"

      - name: Audit tablet rotation in WebKit
        if: always()
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
        run: node utils/scripts/auditTabletRotation.mjs --base "$BASE_URL" --screenshots audit-shots/tablet-rotation

      - name: Upload control and rotation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-${{ github.run_id }}-controls
          path: audit-shots/
          retention-days: 7
          if-no-files-found: ignore
