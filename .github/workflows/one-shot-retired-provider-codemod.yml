name: One-shot retired provider codemod

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-retired-provider-codemod.yml'
      - 'scripts/retire-provider-literals-v2.mjs'

permissions:
  contents: write

jobs:
  codemod:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore target files from cleanup base
        run: |
          git checkout e006d162ed8fb07574dd85bcd20344067ba46cf1 -- \
            .github/workflows/fallback-snapshot.yml \
            .github/workflows/publish-container.yml \
            .github/workflows/stored-art-paths.yml \
            scripts/db-write-repro.mjs \
            scripts/db-write-smoke.mjs \
            scripts/run_facet_catalog_maintenance.ts \
            utils/scripts/auditGalleryChrome.ts \
            utils/scripts/exportPageBackdropArt.ts \
            utils/scripts/offloadArtImageData.ts \
            utils/scripts/repairRewardImagePaths.ts \
            utils/scripts/seedFacetCatalog.ts \
            utils/scripts/verifyAdminFlagCasts.ts \
            utils/scripts/verifyArtImageCaching.ts \
            utils/scripts/verifyCaptureGroupGuards.ts \
            utils/scripts/verifyFetchGenericPinning.ts \
            utils/scripts/verifyNoPrismaJsonCast.ts \
            utils/scripts/verifyNoPromiseInStoreState.ts \
            utils/scripts/verifyNoUnquotedReservedWordTables.ts

      - name: Apply targeted literal cleanup
        run: node scripts/retire-provider-literals-v2.mjs

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No codemod changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fallback-snapshot.yml \
            .github/workflows/publish-container.yml \
            .github/workflows/stored-art-paths.yml \
            scripts/db-write-repro.mjs \
            scripts/db-write-smoke.mjs \
            scripts/run_facet_catalog_maintenance.ts \
            utils/scripts/auditGalleryChrome.ts \
            utils/scripts/exportPageBackdropArt.ts \
            utils/scripts/offloadArtImageData.ts \
            utils/scripts/repairRewardImagePaths.ts \
            utils/scripts/seedFacetCatalog.ts \
            utils/scripts/verifyAdminFlagCasts.ts \
            utils/scripts/verifyArtImageCaching.ts \
            utils/scripts/verifyCaptureGroupGuards.ts \
            utils/scripts/verifyFetchGenericPinning.ts \
            utils/scripts/verifyNoPrismaJsonCast.ts \
            utils/scripts/verifyNoPromiseInStoreState.ts \
            utils/scripts/verifyNoUnquotedReservedWordTables.ts
          git commit -m 'remove remaining retired provider literals'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
