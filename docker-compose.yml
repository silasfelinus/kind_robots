# The image CI publishes, not one built on the box.
#
# Both services previously carried `build: context: .` and `image:
# kind-robots:local`, so `docker compose up` compiled from whatever the local
# checkout happened to be. publish-container.yml was pushing to GHCR on every
# merge and nothing ever consumed it -- the two halves of the deploy did not
# join up, and what ran in production was not what CI had built or tested.
#
# Deploying is now `docker compose pull && docker compose up -d`.
#
# The anchor is load-bearing: migrate and kind-robots must be the SAME image.
# Migrating with one build and serving with another is how a schema arrives that
# the running code does not expect, and it would be invisible until something
# broke at runtime.
#
# Pin a rollback with KIND_ROBOTS_IMAGE — every build is also tagged sha-<short>:
#   KIND_ROBOTS_IMAGE=ghcr.io/silasfelinus/kind_robots:sha-1a2b3c4 docker compose up -d
#
# GHCR may require `docker login ghcr.io` on this host with a token that can
# read packages, if the package is not public.
x-kind-robots-image: &kind-robots-image ${KIND_ROBOTS_IMAGE:-ghcr.io/silasfelinus/kind_robots:latest}

services:
  # Applies pending migrations, then exits. The app will not start until this
  # has completed successfully, so schema and code move together instead of the
  # schema drifting behind whatever was last deployed by hand.
  #
  # This is a SEPARATE service on purpose, not a step inside the app container.
  # docs/runbooks/migration-credential-boundary.md keeps schema-write capability
  # out of the ordinary application lane, and scripts/prisma-migrate-deploy.mjs
  # refuses DATABASE_URL outright. A long-running app container holding
  # MIGRATION_DATABASE_URL is exactly what that boundary prevents; a container
  # whose entire lifetime is the migration is not.
  #
  # `migrate deploy` applies pending migrations only. It never resets, never
  # drops, and never generates. Re-running it is a no-op.
  migrate:
    image: *kind-robots-image
    container_name: kind-robots-migrate
    restart: "no"
    env_file:
      - ${KIND_ROBOTS_ENV_FILE:-.env}
    environment:
      # Deliberately not read from the app env file. Compose fails loudly here
      # if it is unset rather than silently skipping migrations -- a deploy that
      # cannot migrate should stop, not quietly serve old schema.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL to the kindrobot_migrate credential; see docs/runbooks/migration-credential-boundary.md}
    command: ["node", "scripts/prisma-migrate-deploy.mjs"]
    networks:
      - cafepurr

  kind-robots:
    image: *kind-robots-image
    container_name: kind-robots
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${KIND_ROBOTS_PORT:-3009}:3000"
    env_file:
      - ${KIND_ROBOTS_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      IMAGES_PATH: /app/.output/public/images
    volumes:
      - ${KIND_ROBOTS_ENV_FILE:-./.env}:/config/kind-robots.env:ro
      - ${KIND_ROBOTS_MEDIA_PATH:-/mnt/user/pc/kindrobots/images}:/app/.output/public/images:rw
    networks:
      - cafepurr

networks:
  cafepurr:
    external: true
