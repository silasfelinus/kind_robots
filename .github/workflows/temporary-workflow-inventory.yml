name: Temporary workflow inventory

on:
  push:
    branches:
      - worker/workflow-audit-20260804
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Report targeted workflow history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          import yaml

          root = pathlib.Path('.github/workflows')
          paths = sorted([*root.glob('*.yml'), *root.glob('*.yaml')])
          source = {}
          for path in paths:
              data = yaml.load(path.read_text(encoding='utf-8'), Loader=yaml.BaseLoader) or {}
              triggers = data.get('on', {})
              if isinstance(triggers, str):
                  events = [triggers]
              elif isinstance(triggers, list):
                  events = triggers
              elif isinstance(triggers, dict):
                  events = list(triggers.keys())
              else:
                  events = []
              source[path.as_posix()] = {'name': data.get('name'), 'events': events}

          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']

          def api(path):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          workflows = []
          page = 1
          while True:
              batch = api(f'/actions/workflows?per_page=100&page={page}').get('workflows', [])
              workflows.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          current_paths = set(source)
          stale = [workflow for workflow in workflows if workflow.get('path') not in current_paths]
          print(json.dumps({
              'source_count': len(source),
              'api_count': len(workflows),
              'stale_historical_count': len(stale),
          }, sort_keys=True))

          targets = []
          for workflow in workflows:
              path = workflow.get('path')
              details = source.get(path)
              if not details:
                  continue
              name = str(workflow.get('name') or '')
              events = details['events']
              if (
                  'WonderLab' in name
                  or 'schedule' in events
                  or events == ['workflow_dispatch']
              ):
                  targets.append((workflow, details))

          print('TARGET_HISTORY_BEGIN')
          for workflow, details in targets:
              runs = api(f"/actions/workflows/{workflow['id']}/runs?per_page=5").get('workflow_runs', [])
              print(json.dumps({
                  'id': workflow['id'],
                  'name': workflow.get('name'),
                  'path': workflow.get('path'),
                  'events': details['events'],
                  'state': workflow.get('state'),
                  'runs': [
                      {
                          'id': run.get('id'),
                          'event': run.get('event'),
                          'conclusion': run.get('conclusion'),
                          'created_at': run.get('created_at'),
                          'head_branch': run.get('head_branch'),
                      }
                      for run in runs
                  ],
              }, sort_keys=True))
          print('TARGET_HISTORY_END')
          PY
