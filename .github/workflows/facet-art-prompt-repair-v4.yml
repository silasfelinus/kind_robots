name: Krea Entity Art Prompt Repair v4

# One-shot production repair for contextual Krea prompts. Facet v2/v3 has a
# provenance-specific repair; the second pass covers contextual entity-art jobs
# for the main Kind Robots object families (Facet, Character, Bot, Dream,
# Scenario, Reward). Old ArtImages are preserved and replacements are only
# queued when the tainted job still owns, or is still filling, its target slot.
# The workflow is intentionally triggered only by this file landing on main;
# after a successful repair run the worker deletes it in a cleanup PR.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/facet-art-prompt-repair-v4.yml'

concurrency:
  group: krea-entity-art-prompt-repair-v4
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_CA_BASE64: ${{ secrets.DATABASE_SSL_CA_BASE64 }}
      DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
    steps:
      - name: Require production queue secrets
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty."
            exit 1
          fi
          if [ -z "$TS_OAUTH_CLIENT_ID" ] || [ -z "$TS_OAUTH_SECRET" ]; then
            echo "::error::TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET are empty."
            exit 1
          fi
          if [ -z "$DATABASE_SSL_CA_BASE64" ] && [ -z "$DATABASE_SSL_CA" ]; then
            echo "::warning::No database CA secret is set; ProxySQL normally requires TLS."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Resubmit tainted Facet v2/v3 artwork with semantic Krea prompts
        run: >-
          npx tsx scripts/run_facet_catalog_maintenance.ts
          --art-only
          --repair-tainted
          --reason=one-shot-krea-context-prompt-repair-v4

      - name: Audit contextual Krea entity-art jobs
        run: npx tsx scripts/repair_krea_context_entity_art.ts

      - name: Resubmit contextual Krea entity-art jobs
        run: npx tsx scripts/repair_krea_context_entity_art.ts --write

      - name: Report replacement ArtJob IDs
        run: |
          npx tsx -e 'import { createScriptPrismaClient } from "./scripts/lib/databaseRetry"; (async () => { const prisma = createScriptPrismaClient(); try { const facetJobs = await prisma.artJob.findMany({ where: { projectSlug: "facet-catalog", payload: { contains: "\"repairReason\":\"krea-context-prompt-text\"" } }, orderBy: { id: "asc" }, select: { id: true, status: true, artImageId: true } }); const entityJobs = await prisma.artJob.findMany({ where: { payload: { contains: "\"kreaSemanticRepair\"" } }, orderBy: { id: "asc" }, select: { id: true, status: true, artImageId: true, projectSlug: true } }); console.log("[krea-art-repair] Facet v4 replacement ArtJobs:", facetJobs); console.log("[krea-art-repair] main-entity replacement ArtJobs:", entityJobs); } finally { await prisma.$disconnect(); } })().catch((error) => { console.error(error); process.exit(1); })'
