name: Temporary Shifting Lands Format
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-shifting-lands-format.yml'
permissions:
  contents: write
jobs:
  format-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'worker/zuzu-shifting-lands-t015-illustrated-board-20261010-c8f4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/zuzu-shifting-lands-t015-illustrated-board-20261010-c8f4
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx prettier --write components/shifting-lands-journey-board.vue pages/admin/zuzu-shifting-lands.vue stores/shiftingLandsJourneyStore.ts utils/scripts/verifyShiftingBoard.test.ts
      - name: Push formatting
        run: |
          git add -- components/shifting-lands-journey-board.vue pages/admin/zuzu-shifting-lands.vue stores/shiftingLandsJourneyStore.ts utils/scripts/verifyShiftingBoard.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Format Shifting Lands board and contracts with Prettier'
          git push origin HEAD:refs/heads/worker/zuzu-shifting-lands-t015-illustrated-board-20261010-c8f4
