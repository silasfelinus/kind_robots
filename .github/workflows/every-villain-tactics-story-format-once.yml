name: One-shot First Bell story formatting
on:
  push:
    branches:
      - worker/every-villain-tactics-t-003-20261029-f4q8
    paths:
      - '.github/workflows/every-villain-tactics-story-format-once.yml'
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/every-villain-tactics-t-003-20261029-f4q8
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install formatter
        run: npm ci --ignore-scripts
      - name: Format scoped files
        run: npx prettier --write utils/everyVillainTactics/firstBellStory.ts utils/everyVillainTactics/training.ts stores/everyVillainTacticsStore.ts pages/admin/every-villain-tactics.vue utils/scripts/verifyEveryVillainStory.test.ts package.json .github/workflows/every-villain-tactics.yml
      - name: Commit formatting without force
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/everyVillainTactics/firstBellStory.ts utils/everyVillainTactics/training.ts stores/everyVillainTacticsStore.ts pages/admin/every-villain-tactics.vue utils/scripts/verifyEveryVillainStory.test.ts package.json .github/workflows/every-villain-tactics.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(tactics): format First Bell role scenes and animations"
            git push origin HEAD:worker/every-villain-tactics-t-003-20261029-f4q8
          fi
