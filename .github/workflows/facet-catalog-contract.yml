name: Facet Catalog Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: facet-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  facet-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql://facet_contract:facet_contract@127.0.0.1:3306/facet_contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Validate Facet schema and cutover
        run: npm run test:facet-catalog

      - name: Verify Facet seed policy
        run: node utils/scripts/verifyFacetCatalogSeedPolicy.mjs

      - name: Verify retired Facet sources
        run: |
          node utils/scripts/verifyFacetLegacySeedSnapshots.mjs
          node utils/scripts/verifyRetiredRewardRandomizers.mjs

      - name: Verify Facet generation contracts
        run: |
          npx tsx utils/scripts/verifyFacetArtGeneration.ts
          npx tsx utils/scripts/verifyDreamRandomCompatibility.ts
          npx tsx utils/scripts/verifyFacetLibraryAdvanced.ts

      - name: Verify illustrated Builder Facet coverage
        id: builder-coverage
        continue-on-error: true
        run: npx tsx utils/scripts/verifyFacetBuilderCoverage.ts 2>&1 | tee facet-builder-coverage-report.txt

      - name: Upload Builder Facet coverage diagnostics
        if: steps.builder-coverage.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: facet-builder-coverage-diagnostics
          path: facet-builder-coverage-report.txt
          if-no-files-found: error

      - name: Enforce illustrated Builder Facet coverage
        if: steps.builder-coverage.outcome == 'failure'
        run: exit 1

      - name: Verify curated Facet artwork
        id: artwork
        run: npx tsx utils/scripts/verifyFacetArtworkMigration.ts 2>&1 | tee facet-artwork-report.txt

      - name: Upload Facet artwork diagnostics
        if: failure() && steps.artwork.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: facet-artwork-diagnostics
          path: facet-artwork-report.txt
          if-no-files-found: error
