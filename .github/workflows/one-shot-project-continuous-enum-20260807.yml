name: One-shot Project continuous enum 2026-08-07

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - utils/scripts/_projectContinuousEnumPatch20260807.py
      - .github/workflows/one-shot-project-continuous-enum-20260807.yml
  push:
    branches:
      - claude/project-continuous-enum-20260807
    paths:
      - utils/scripts/_projectContinuousEnumPatch20260807.py
      - .github/workflows/one-shot-project-continuous-enum-20260807.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-continuous-enum-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply first-class continuous lifecycle patch
        run: python utils/scripts/_projectContinuousEnumPatch20260807.py
      - name: Install dependencies
        run: npm ci
      - name: Regenerate Prisma client
        run: npx prisma generate
      - name: Verify schema and lifecycle contract
        run: |
          npx prisma validate
          npm run test:conductor-api-auth-guards
          npx nuxi prepare
          npx vue-tsc --noEmit
          npx eslint server/utils/conductorProjectRegistry.ts server/api/projects/index.ts server/api/conductor/project-state.post.ts server/api/conductor/sync.post.ts server/api/conductor/overrides.post.ts components/pages/conductor-page.vue components/pages/conductor-project-gallery-page.vue utils/scripts/verifyConductorProjectRegistry.ts
          npx prettier --check prisma/schema.prisma server/utils/conductorProjectRegistry.ts server/api/projects/index.ts server/api/conductor/overrides.post.ts components/pages/conductor-page.vue components/pages/conductor-project-gallery-page.vue utils/scripts/verifyConductorProjectRegistry.ts docs/conductor-projection.md prisma/migrations/20260807110500_add_project_continuous_status/migration.sql
      - name: Remove one-shot helpers
        run: |
          rm utils/scripts/_projectContinuousEnumPatch20260807.py
          rm .github/workflows/one-shot-project-continuous-enum-20260807.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: make Project CONTINUOUS a first-class lifecycle" || exit 0
          git push origin HEAD:claude/project-continuous-enum-20260807
