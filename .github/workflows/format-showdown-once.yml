name: One-shot Showdown formatter
on:
  push:
    branches:
      - worker/interface-vision-t104-sitewide-viewport-18b8
    paths:
      - .github/workflows/format-showdown-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/interface-vision-t104-sitewide-viewport-18b8
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write pages/play/zuzu-showdown.vue
      - name: Commit formatted Showdown
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/play/zuzu-showdown.vue
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Showdown viewport disclosure'
            git push origin HEAD:worker/interface-vision-t104-sitewide-viewport-18b8
          fi
