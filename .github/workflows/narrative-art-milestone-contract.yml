name: Narrative Art Milestone Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: narrative-art-milestones-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Narrative art milestone classifier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify milestone classifier
        run: npx tsx utils/scripts/verifyNarrativeArtMilestones.ts

      - name: Verify coordinator boundary
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const plugin = fs.readFileSync('plugins/narrative-milestone-art.client.ts', 'utf8')
          // The Taskmaster tokens (selectTaskmasterArtMilestone, seenTaskBeats,
          // requestTaskArt) left this list on 2026-09-14 with the /taskmaster
          // route, in storybook task t-047. The plugin's taskmaster half watched
          // a client-held session that no longer exists -- a taskmaster quest is
          // a server-side run. The Storybook tokens below still pin the same
          // coordinator boundary for the one client beat loop that remains.
          // (Task ids are written without a slash inside `run:` blocks.
          // verifyWorkflowPaths.ts scans shell steps for bare lowercase
          // slash-joined tokens and reads a project-qualified task id as a
          // repo-relative path that does not exist.)
          for (const token of [
            'selectStorybookArtMilestone',
            'seenStoryBeats',
            "{ flush: 'post' }",
            'if (!beat.art) requestStoryArt(beat)',
          ]) {
            if (!plugin.includes(token)) throw new Error(`Missing coordinator boundary: ${token}`)
          }
          if (plugin.includes('immediate: true')) {
            throw new Error('Milestone coordinator must not retroactively generate art on restore')
          }
          console.log('Narrative milestone coordinator boundary passed.')
          NODE
