name: Hybridizer temporary Prisma client sync
on:
  push:
    branches:
      - worker/hybridizer-t-004-fusion-cache-20261028
    paths:
      - .github/workflows/hybridizer-prisma-sync-temp.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked deps
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci --ignore-scripts
      - name: Generate checked-in Prisma client
        env:
          DATABASE_URL: mysql://dummy:dummy@127.0.0.1:3306/kindrobots
        run: npx prisma generate
      - name: Commit generated client to feature branch only
        run: |
          git add prisma/generated/prisma
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(hybridizer): sync generated Prisma client'
          git push origin HEAD:worker/hybridizer-t-004-fusion-cache-20261028
