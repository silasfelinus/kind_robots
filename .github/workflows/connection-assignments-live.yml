name: Connection Assignments Live

# Production write lane for the fitness pass: Scenario<->Character,
# Scenario<->Dream and Character<->Dream links.
#
# Manual only, gated on a typed phrase, same as the comment lanes. What this
# writes is additive and reversible by hand -- the publisher only ever calls
# `connect`, never `set` or `disconnect` -- so the risk here is a wrong link
# rather than a lost one. That is still a production write and still gets a gate.
#
# Required repository Actions secrets:
#   DATABASE_URL
#   DATABASE_SSL_CA_BASE64 or DATABASE_SSL_CA
#   TS_OAUTH_CLIENT_ID
#   TS_OAUTH_SECRET

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CONNECT to write the assignments to production'
        required: true
        default: ''
      dry_run:
        description: 'Validate against live state and stop before the first write'
        type: boolean
        default: false

concurrency:
  group: connection-assignments-live
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_CA_BASE64: ${{ secrets.DATABASE_SSL_CA_BASE64 }}
      DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
    steps:
      - name: Require the typed confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "CONNECT" ]; then
            echo "::error::confirm must be exactly CONNECT. Got: '${{ inputs.confirm }}'"
            exit 1
          fi

      - name: Require production DB lane
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty. Add it as a REPOSITORY ACTIONS SECRET."
            exit 1
          fi
          if [ -z "$TS_OAUTH_CLIENT_ID" ] || [ -z "$TS_OAUTH_SECRET" ]; then
            echo "::error::Tailscale OAuth secrets are empty."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: '0'

      # Offline, over public HTTP, before the tailnet opens. Names every bad row
      # at once instead of one per production run.
      - name: Verify assignments against live state
        run: npm run test:connections

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write the connections
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx utils/scripts/publishConnectionAssignments.ts --dry-run
          else
            npx tsx utils/scripts/publishConnectionAssignments.ts
          fi
