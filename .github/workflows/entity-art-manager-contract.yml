name: Entity Art Manager Contract

on:
  pull_request:
    paths:
      - 'components/art/entity-art-manager.vue'
      - 'components/bots/bot-interact.vue'
      - 'components/characters/character-interact.vue'
      - 'components/scenarios/scenario-interact.vue'
      - 'components/rewards/reward-interact.vue'
      - 'components/facets/facet-manager.vue'
      - 'server/api/art/enqueue.post.ts'
      - 'server/api/art/queue/[id]/complete.post.ts'
      - 'server/api/art/entities/**'
      - 'server/utils/entityArt.ts'
      - 'utils/scripts/verifyEntityArtManager.ts'
      - '.github/workflows/entity-art-manager-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-types:
    if: github.head_ref == 'agent/shared-entity-art-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shared-entity-art-manager
          fetch-depth: 0
      - name: Patch precise TypeScript errors
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('components/art/entity-art-manager.vue')
          text = component.read_text()
          if 'const qualityPreset: GenerationPreset' not in text:
              old = """const recreatePresets: GenerationPreset[] = [
  {
    key: 'quality',
    label: 'Quality default',
    description: 'Uses the current quality-focused workflow defaults.',
  },
"""
              new = """const qualityPreset: GenerationPreset = {
  key: 'quality',
  label: 'Quality default',
  description: 'Uses the current quality-focused workflow defaults.',
}
const recreatePresets: GenerationPreset[] = [
  qualityPreset,
"""
              if old not in text:
                  raise RuntimeError('quality preset anchor not found')
              text = text.replace(old, new, 1)
              old = """const selectedPreset = computed(
  () =>
    availablePresets.value.find((preset) => preset.key === presetKey.value) ||
    availablePresets.value[0] ||
    recreatePresets[0],
)
"""
              new = """const selectedPreset = computed<GenerationPreset>(
  () =>
    availablePresets.value.find((preset) => preset.key === presetKey.value) ??
    availablePresets.value[0] ??
    qualityPreset,
)
"""
              if old not in text:
                  raise RuntimeError('selected preset anchor not found')
              component.write_text(text.replace(old, new, 1))

          service = Path('server/utils/entityArt.ts')
          text = service.read_text()
          if "import type prisma from '~/server/utils/prisma'" not in text:
              old = """import type {
  Prisma,
  PrismaClient,
} from '~/prisma/generated/prisma/client'
"""
              new = """import type { Prisma } from '~/prisma/generated/prisma/client'
import type prisma from '~/server/utils/prisma'
"""
              if old not in text:
                  raise RuntimeError('Prisma import anchor not found')
              text = text.replace(old, new, 1)
              old = "type EntityArtDb = PrismaClient | Prisma.TransactionClient\n"
              new = """type EntityArtDb = Pick<
  typeof prisma,
  'bot' | 'character' | 'scenario' | 'reward' | 'facet' | 'artImage'
>
"""
              if old not in text:
                  raise RuntimeError('EntityArtDb anchor not found')
              service.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then
            echo 'Entity art TypeScript boundaries already patched.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/art/entity-art-manager.vue server/utils/entityArt.ts
          git commit -m "Fix shared entity art TypeScript boundaries"
          git push origin HEAD

  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/kindrobots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx utils/scripts/verifyEntityArtManager.ts
