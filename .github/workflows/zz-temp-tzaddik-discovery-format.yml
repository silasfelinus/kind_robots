name: Temporary Tzaddik Discovery Formatter

on:
  push:
    branches:
      - feat/tzaddik-discovery-pool-popculture-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Format touched discovery files
        run: |
          set -euo pipefail
          files=(
            "pages/tzaddik-gallery.vue"
            "server/api/tzaddik/discovery/replenish.post.ts"
            "server/api/tzaddik/index.get.ts"
            "stores/tzaddikStore.ts"
          )
          npx --yes prettier@3.6.2 --write "${files[@]}"
          for file in "${files[@]}"; do
            printf 'FMT::%s::' "$file"
            base64 -w0 "$file"
            printf '\n'
          done
