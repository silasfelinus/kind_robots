name: Temporary Tzaddik Formatter V2

on:
  push:
    branches:
      - fix/tzaddik-wikipedia-images-20260928-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Format touched files and emit
        run: |
          set -euo pipefail
          files=(
            ".github/workflows/tzaddik-seed-bootstrap.yml"
            "components/tzaddik/tzaddik-card.vue"
            "components/tzaddik/tzaddik-detail-sheet.vue"
            "pages/tzaddik-gallery.vue"
            "scripts/backfill-tzaddik-image-provenance.mjs"
            "server/api/tzaddik/[id]/image.get.ts"
            "server/api/tzaddik/recheck.post.ts"
            "server/utils/tzaddikSourceRefresh.ts"
            "stores/tzaddikStore.ts"
            "utils/tzaddikImage.ts"
          )
          npx --yes prettier@3.6.2 --write "${files[@]}"
          for file in "${files[@]}"; do
            printf 'FMT::%s::' "$file"
            base64 -w0 "$file"
            printf '\n'
          done
