name: Contract Tests

# Fast, DB-free contract checks for cross-repo and content-driven contracts.
# No database or Nuxt build is needed, so these can gate every pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Contract verifiers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Art-request YAML indentation contract
        run: npm run test:art-request-yaml

      - name: Art prompt contract
        run: npm run test:art-prompt-contract

      - name: ArtJob sampler repair contract
        run: npm run test:artjob-sampler-repair

      - name: Comfy-only generation contract
        run: npm run test:comfy-only-generation

      - name: Channel content contract
        run: npm run test:channel-content

      - name: No Promise in Pinia store state
        run: npm run test:no-promise-in-store-state

      - name: UI tier vocabulary (workspace stays with navigation)
        run: npm run test:ui-tier-vocabulary

      - name: Card action contract (cards emit, galleries decide)
        run: npm run test:card-action-contract

      - name: Channel resolver contract
        run: npm run test:channel-resolver

      - name: Gallery adoption contract
        run: npm run test:gallery-adoption

      - name: Gallery consistency contract
        run: npm run test:gallery-consistency

      - name: Disabled-affordance contract
        run: npm run test:disabled-affordances

      - name: Route gallery contract
        run: npm run test:route-gallery-contract

      - name: Narrative roles contract
        run: npm run test:narrative-roles

      - name: Narrative cast tiers contract
        run: npm run test:narrative-cast-tiers

      - name: Earned-karma wiring contract
        run: npm run test:earned-karma-wiring

      - name: Component reachability contract
        run: npm run test:component-reachability

      - name: Page backdrop contract
        run: npm run test:page-backdrop

      - name: Art image caching contract
        run: npm run test:art-image-caching

      - name: ArtImage offload contract
        run: npm run test:art-image-offload

      - name: ESLint ratchet
        run: npm run test:lint-ratchet

      - name: Data surface manifest contract
        run: npm run test:data-surface-manifest

      - name: Mature-term matcher self-test
        run: npm run test:mature-terms

      - name: No content route shadowed by a page
        run: npm run test:no-shadowed-content-routes

      - name: Nav manifest contract
        run: npm run test:nav-manifest

      - name: Database pool defaults contract
        run: npm run test:database-pool-defaults

      - name: Project scaffold Todo parity contract
        run: npm run test:project-scaffold-todo-parity

      - name: Maturity and privacy generation contract
        run: npx tsx utils/scripts/verifyMaturityPrivacyContract.ts

      - name: Dream store fetch merge contract
        run: npx tsx utils/scripts/verifyDreamStoreFetchMerge.ts

      - name: User directory cache safety contract
        run: npx tsx utils/scripts/verifyUserStoreCacheSafety.ts

      - name: Achievement hydration safety contract
        run: npm run test:achievement-store

      - name: Achievement catalog, trigger, popup, and artwork contract
        run: npm run test:achievement-catalog

      - name: Known failed Prisma migration repair contract
        run: node utils/scripts/verify-known-migration-repair.mjs

      - name: Academy style-detail caller-doc contract
        run: npm run test:academy-style-detail-callers

      - name: Academy starter manifest provenance contract
        run: npm run test:academy-starter-manifest

      - name: Academy examples manifest provenance contract
        shell: bash
        run: npm run test:academy-examples-manifest 2>&1 | tee academy-examples-contract.txt

      - name: Academy style gallery disclosure contract
        run: npm run test:academy-style-gallery-disclosure

      - name: Navigation route access contract
        run: npx tsx utils/scripts/verifyNavigationRouteAccess.ts

      - name: Workflow path references contract
        run: npm run test:workflow-paths

      - name: Workflow pipefail contract
        run: npm run test:workflow-pipefail

      - name: Deploy-wait ancestry check contract
        run: npm run test:deploy-wait-ancestry

      - name: Deploy-wait no-op check contract
        run: npm run test:deploy-wait-noop

      - name: Prisma JSON-cast contract
        run: npm run test:no-prisma-json-cast

      - name: Admin-flag cast contract
        run: npm run test:admin-flag-casts

      - name: UserRole expand migration contract
        run: npm run test:user-role-expand

      - name: UserRole predicate contract
        run: npm run test:user-role-predicates

      - name: CHILD maturity restriction contract
        run: npm run test:child-maturity

      - name: Narrative conversation kit contract
        run: npm run test:narrative-kit

      - name: Unquoted reserved-word table identifier contract
        run: npm run test:no-unquoted-reserved-word-tables

      - name: $fetch generic-pinning contract
        run: npm run test:fetch-generic-pinning

      - name: Existing-owner-id nullability contract
        run: npm run test:existing-owner-id-nullability

      - name: Ownership nullability regression contract
        run: npm run test:ownership-nullability

      - name: Ratchet-baseline helper self-test
        run: npm run test:ratchet-baseline-selftest

      - name: Capture-group guard checker self-test
        run: npm run test:capture-group-guards-selftest

      - name: Conductor API auth-guard checker self-test
        run: npm run test:conductor-api-auth-guards-selftest

      - name: Conductor API auth-guard contract
        run: npm run test:conductor-api-auth-guards

      - name: Conductor roadmap progress parity contract
        run: npm run test:conductor-progress-parity

      - name: Da Vinci narration bounds contract
        run: npm run test:davinci-narration

      - name: Pack manifest validator self-test
        run: npm run test:pack-manifest

      - name: Pack scaffold extraction self-test
        run: npm run test:pack-scaffold-extraction

      - name: Pitch detector accuracy contract
        run: npm run test:pitch-detector-accuracy

      - name: mysql:// URL parser contract
        run: npm run test:parse-mysql-url

      - name: Newsfeed aggregation contract
        run: npm run test:newsfeed-aggregation

      - name: Newsfeed programmable filters contract
        run: npm run test:newsfeed-filters

      - name: Newsfeed perspective balance contract
        run: npm run test:newsfeed-perspective-balance

      - name: Tutorial channel resolver contract
        run: npm run test:tutorial-channel-resolver

      - name: Model Builder link-coverage contract
        run: npm run test:model-builder-link-coverage

      - name: Model Builder completion-gate checker self-test
        run: npm run test:model-builder-completion-gate-selftest

      - name: Model Builder completion-gate contract
        run: npm run test:model-builder-completion-gate

      - name: Model Builder commit cancelled-run guard checker self-test
        run: npm run test:model-builder-commit-cancelled-run-guard-selftest

      - name: Model Builder commit cancelled-run guard contract
        run: npm run test:model-builder-commit-cancelled-run-guard

      - name: Model Builder draft approval guard checker self-test
        run: npm run test:model-builder-draft-approval-guard-selftest

      - name: Model Builder draft approval guard contract
        run: npm run test:model-builder-draft-approval-guard

      - name: Model Builder auto-build draft gate checker self-test
        run: npm run test:model-builder-auto-build-draft-gate-selftest

      - name: Model Builder auto-build draft gate contract
        run: npm run test:model-builder-auto-build-draft-gate

      - name: Model Builder run-writable guard checker self-test
        run: npm run test:model-builder-run-writable-guard-selftest

      - name: Model Builder run-writable guard contract
        run: npm run test:model-builder-run-writable-guard

      - name: Model Builder open-run identity guard checker self-test
        run: npm run test:model-builder-open-run-identity-guard-selftest

      - name: Model Builder open-run identity guard contract
        run: npm run test:model-builder-open-run-identity-guard

      - name: Model Builder commit name/title field guard checker self-test
        run: npm run test:model-builder-commit-name-field-guard-selftest

      - name: Model Builder commit name/title field guard contract
        run: npm run test:model-builder-commit-name-field-guard

      - name: Model Builder commit stale-snapshot guard checker self-test
        run: npm run test:model-builder-commit-stale-snapshot-guard-selftest

      - name: Model Builder commit stale-snapshot guard contract
        run: npm run test:model-builder-commit-stale-snapshot-guard

      - name: Kontext mask forwarding contract
        run: npm run test:kontext-mask-forwarding

      - name: Mana-gate on-behalf-of target authorization contract
        run: npm run test:mana-gate-on-behalf-of-target

      - name: Animation catalog contract
        run: npm run test:animation-catalog

      # These generic first-party author + draft contracts survive WonderLab.
      # They are the foundation for moving the 706 authored voice pieces onto
      # actual reviewable Kind Robots objects.
      - name: Reaction first-party author expand migration contract
        run: npx tsx utils/scripts/verifyReactionFirstPartyAuthorExpand.ts

      - name: Reaction first-party author runtime contract
        run: npx tsx utils/scripts/verifyFirstPartyReactionAuthor.ts

      - name: Review draft storage expand contract
        run: npx tsx utils/scripts/verifyReviewDraftStorageExpand.ts

      - name: Review draft admin API contract
        run: npx tsx utils/scripts/verifyReviewDraftAdminApi.ts

      - name: Review draft publication contract
        run: npx tsx utils/scripts/verifyReviewDraftPublication.ts

      - name: Review draft curator UI contract
        run: npx tsx utils/scripts/verifyReviewDraftCuratorUi.ts

      - name: Review draft generation contract
        run: npx tsx utils/scripts/verifyReviewDraftGeneration.ts

      - name: Fetch main for capture-group guard diff
        run: git fetch origin main

      - name: Capture-group guard contract (new/changed lines vs main)
        run: npm run test:capture-group-guards -- origin/main

      - name: Challenge Center contracts and seed validation (dry run, no database)
        run: |
          npm run test:challenge-center
          npm run test:seed-challenges
          npm run test:seed-contenders

      - name: Channel artwork audit
        shell: bash
        run: npm run audit:channel-assets 2>&1 | tee channel-artwork-audit.txt

      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-diagnostics
          path: |
            academy-examples-contract.txt
            channel-artwork-audit.txt
          if-no-files-found: warn
          retention-days: 14
