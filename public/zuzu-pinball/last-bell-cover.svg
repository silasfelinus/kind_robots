<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Zuzu Pinball: The Last Bell</title>
  <desc id="desc">A glowing silver ball ricochets around a haunted abbey pinball table above a dark river as a great bronze bell looms overhead.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#101b31"/>
      <stop offset=".52" stop-color="#20384a"/>
      <stop offset="1" stop-color="#0b1c29"/>
    </linearGradient>
    <radialGradient id="moon-glow">
      <stop stop-color="#fad99b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fad99b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabinet" x2="1" y2="1">
      <stop stop-color="#a87751"/>
      <stop offset=".46" stop-color="#583628"/>
      <stop offset="1" stop-color="#231e25"/>
    </linearGradient>
    <linearGradient id="felt" x2="0" y2="1">
      <stop stop-color="#293b4a"/>
      <stop offset=".52" stop-color="#143640"/>
      <stop offset="1" stop-color="#12212e"/>
    </linearGradient>
    <linearGradient id="bronze" x2="1" y2=".7">
      <stop stop-color="#f7d38b"/>
      <stop offset=".36" stop-color="#9b6944"/>
      <stop offset=".8" stop-color="#eabf75"/>
      <stop offset="1" stop-color="#68432f"/>
    </linearGradient>
    <radialGradient id="ball" cx=".3" cy=".2" r=".8">
      <stop stop-color="#fffcee"/>
      <stop offset=".35" stop-color="#bcecf0"/>
      <stop offset=".8" stop-color="#607e99"/>
      <stop offset="1" stop-color="#223846"/>
    </radialGradient>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="stars" width="147" height="121" patternUnits="userSpaceOnUse">
      <circle cx="26" cy="17" r="1.6" fill="#f8deb0" opacity=".65"/>
      <circle cx="116" cy="68" r="1" fill="#b6dcde" opacity=".65"/>
      <circle cx="67" cy="105" r="1.2" fill="#e4d9e2" opacity=".7"/>
    </pattern>
    <clipPath id="playfield">
      <path d="M704 143 976 143 1088 635 594 635Z"/>
    </clipPath>
  </defs>
  <rect width="1200" height="750" fill="url(#night)"/>
  <rect width="1200" height="750" fill="url(#stars)"/>
  <circle cx="886" cy="125" r="300" fill="url(#moon-glow)"/>
  <circle cx="886" cy="125" r="62" fill="#e7d9ac" opacity=".8"/>
