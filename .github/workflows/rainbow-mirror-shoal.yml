name: Rainbow Mirror Shoal Combat

on:
  pull_request:
    branches: [main]
    paths:
      - 'utils/arcade/games/rainbowMirrorShoal.ts'
      - 'utils/arcade/games/rainbowGuardian.ts'
      - 'utils/scripts/verifyRainbowMirrorShoal.test.ts'
      - '.github/workflows/rainbow-mirror-shoal.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  shoal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Verify Mirror Shoal X4 score and guardian
        run: npx tsx utils/scripts/verifyRainbowMirrorShoal.test.ts
      - name: Guard existing Sunken Lighthouse encounter
        run: npx tsx utils/scripts/verifyRainbowLighthouseGuardian.test.ts
