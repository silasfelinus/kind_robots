name: Entity Art Manager Contract

on:
  pull_request:
    paths:
      - 'components/art/entity-art-manager.vue'
      - 'components/bots/bot-interact.vue'
      - 'components/characters/character-interact.vue'
      - 'components/scenarios/scenario-interact.vue'
      - 'components/rewards/reward-interact.vue'
      - 'components/facets/facet-manager.vue'
      - 'server/api/art/enqueue.post.ts'
      - 'server/api/art/queue/[id]/complete.post.ts'
      - 'server/api/art/entities/**'
      - 'server/utils/entityArt.ts'
      - 'utils/scripts/verifyEntityArtManager.ts'
      - '.github/workflows/entity-art-manager-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/kindrobots
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shared-entity-art-manager-final
          fetch-depth: 0
      - name: Apply validated TypeScript corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('components/art/entity-art-manager.vue')
          text = component.read_text()
          if 'const qualityPreset: GenerationPreset' not in text:
              preset_anchor = """const recreatePresets: GenerationPreset[] = [
  {
    key: 'quality',
    label: 'Quality default',
    description: 'Uses the current quality-focused workflow defaults.',
  },
"""
              preset_replacement = """const qualityPreset: GenerationPreset = {
  key: 'quality',
  label: 'Quality default',
  description: 'Uses the current quality-focused workflow defaults.',
}
const recreatePresets: GenerationPreset[] = [
  qualityPreset,
"""
              selected_anchor = """const selectedPreset = computed(
  () =>
    availablePresets.value.find((preset) => preset.key === presetKey.value) ||
    availablePresets.value[0] ||
    recreatePresets[0],
)
"""
              selected_replacement = """const selectedPreset = computed<GenerationPreset>(
  () =>
    availablePresets.value.find((preset) => preset.key === presetKey.value) ??
    availablePresets.value[0] ??
    qualityPreset,
)
"""
              if preset_anchor not in text or selected_anchor not in text:
                  raise RuntimeError('Entity art preset correction anchors changed.')
              component.write_text(
                  text.replace(preset_anchor, preset_replacement, 1)
                      .replace(selected_anchor, selected_replacement, 1)
              )

          service = Path('server/utils/entityArt.ts')
          text = service.read_text()
          if "import type prisma from '~/server/utils/prisma'" not in text:
              import_anchor = """import type {
  Prisma,
  PrismaClient,
} from '~/prisma/generated/prisma/client'
"""
              import_replacement = """import type { Prisma } from '~/prisma/generated/prisma/client'
import type prisma from '~/server/utils/prisma'
"""
              db_anchor = 'type EntityArtDb = PrismaClient | Prisma.TransactionClient\n'
              db_replacement = """type EntityArtDb = Pick<
  typeof prisma,
  'bot' | 'character' | 'scenario' | 'reward' | 'facet' | 'artImage'
>
"""
              if import_anchor not in text or db_anchor not in text:
                  raise RuntimeError('Entity art Prisma correction anchors changed.')
              service.write_text(
                  text.replace(import_anchor, import_replacement, 1)
                      .replace(db_anchor, db_replacement, 1)
              )
          PY
          if git diff --quiet; then
            echo 'Entity art TypeScript corrections already applied.'
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add components/art/entity-art-manager.vue server/utils/entityArt.ts
            git commit -m "Fix shared entity art TypeScript boundaries"
            git push origin HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx utils/scripts/verifyEntityArtManager.ts
