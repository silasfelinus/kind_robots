name: PR 3889 formatting repair
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ecotone-pr3889-format.yml
      - utils/ecotone/**
      - utils/scripts/verifyEcotone.test.ts
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.number == 3889
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: worker/weird-humboldt-t-019-quest-signatures-20261020-q8e6g
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write utils/ecotone/engine.ts utils/ecotone/questExpansion.ts utils/ecotone/finaleExpansion.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/ecotone/engine.ts utils/ecotone/questExpansion.ts utils/ecotone/finaleExpansion.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(ecotone): format authored expansion and engine"
            git push origin HEAD:worker/weird-humboldt-t-019-quest-signatures-20261020-q8e6g
          fi
