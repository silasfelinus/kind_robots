name: Temporary issue 1451 seed serialization patch

on:
  push:
    branches:
      - worker/facet-maintenance-pool-20260804
    paths:
      - .github/workflows/temporary-issue-1451-seed-serialization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/facet-maintenance-pool-20260804

      - name: Await the canonical seed before importing later seed modules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('utils/scripts/seedFacetCatalog.ts')
          text = path.read_text(encoding='utf-8')
          old = "\nmain()\n  .catch((error: unknown) => {"
          new = "\nawait main()\n  .catch((error: unknown) => {"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one unawaited seed main call, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit durable patch and remove temporary workflow
        run: |
          git config user.name "workflow-patch-bot"
          git config user.email "workflow-patch-bot@users.noreply.github.com"
          git rm .github/workflows/temporary-issue-1451-seed-serialization.yml
          git add utils/scripts/seedFacetCatalog.ts
          git diff --staged --check
          git commit -m "fix: serialize canonical facet seed modules"
          git push
