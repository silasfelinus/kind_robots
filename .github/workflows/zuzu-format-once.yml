name: Format Zuzu Studio Once

on:
  push:
    branches:
      - 'worker/zuzu-world-studio-*'
    paths:
      - '.github/workflows/zuzu-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Format changed Zuzu Studio sources
        run: |
          npx prettier --write \
            pages/admin/worlds/zuzu.vue \
            server/api/worlds/zuzu/assign.post.ts \
            server/api/worlds/zuzu/index.get.ts \
            server/api/worlds/zuzu/request.post.ts \
            server/utils/zuzuWorldLedger.ts \
            stores/zuzuWorldStore.ts \
            utils/scripts/verifyZuzuWorldStudio.test.ts \
            utils/zuzuWorld.ts
      - name: Commit scoped formatting
        run: |
          git config user.name "kindrobots-format-bot"
          git config user.email "kindrobots-format-bot@users.noreply.github.com"
          git add pages/admin/worlds/zuzu.vue server/api/worlds/zuzu/assign.post.ts server/api/worlds/zuzu/index.get.ts server/api/worlds/zuzu/request.post.ts server/utils/zuzuWorldLedger.ts stores/zuzuWorldStore.ts utils/scripts/verifyZuzuWorldStudio.test.ts utils/zuzuWorld.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(zuzu): Prettier-format world studio implementation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
