name: Storybook Object-Entry Links Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/storybook-object-entry-links-contract.yml'
      - 'components/facets/facet-profile.vue'
      - 'components/rewards/reward-encounter.vue'
      - 'components/characters/character-manager.vue'
      - 'components/scenarios/scenario-manager.vue'
      - 'utils/scripts/verifyStorybookObjectEntryLinks.mjs'
  workflow_dispatch:

concurrency:
  group: storybook-object-entry-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Facet/Reward -> Storybook object-entry contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Storybook object-entry links
        run: node utils/scripts/verifyStorybookObjectEntryLinks.mjs
