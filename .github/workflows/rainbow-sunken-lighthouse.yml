name: Rainbow Sunken Lighthouse Score

on:
  pull_request:
    branches: [main]
    paths:
      - 'utils/arcade/games/rainbowSunkenLighthouse.ts'
      - 'utils/scripts/verifyRainbowSunkenLighthouse.test.ts'
      - 'utils/scripts/verifyRainbowLighthouseFlight.test.ts'
      - 'utils/arcade/games/rainbowPrincessPreview.ts'
      - 'utils/arcade/games/rainbowCheckpoints.ts'
      - 'utils/arcade/games/rainbowLoadouts.ts'
      - '.github/workflows/rainbow-sunken-lighthouse.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  authored-score:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Validate earned detour, six lamps and bellkeeper
        run: npx tsx utils/scripts/verifyRainbowSunkenLighthouse.test.ts
      - name: Verify solo and four-pilot Bellkeeper combat
        run: npx tsx utils/scripts/verifyRainbowLighthouseGuardian.test.ts
      - name: Verify playable X3 route, checkpoint and one-to-four-pilot flight
        run: npx tsx utils/scripts/verifyRainbowLighthouseFlight.test.ts
