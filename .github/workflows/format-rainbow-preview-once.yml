name: Format Rainbow Preview Once
on:
  push:
    branches:
      - worker/rainbow-t003-private-front-20261011-p7nk
    paths:
      - .github/workflows/format-rainbow-preview-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Format only scoped Arcade files
        run: |
          npx prettier --write pages/admin/rainbow-bullet-hell-space-princess.vue utils/arcade/games.ts utils/arcade/games/rainbowPrincessPreview.ts utils/scripts/verifyRainbowPrincessPreview.test.ts
          git add pages/admin/rainbow-bullet-hell-space-princess.vue utils/arcade/games.ts utils/arcade/games/rainbowPrincessPreview.ts utils/scripts/verifyRainbowPrincessPreview.test.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(rainbow): format private preview with project Prettier'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
