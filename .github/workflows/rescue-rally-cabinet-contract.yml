name: Rescue Rally Cabinet Browser Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/arcade/arcade-cabinet.vue'
      - 'utils/arcade/**'
      - 'utils/scripts/arcadeCabinetFixture.mjs'
      - 'utils/scripts/verifyRescueRallyCabinet.browser.test.mjs'
      - '.github/workflows/rescue-rally-cabinet-contract.yml'

permissions:
  contents: read

concurrency:
  group: rescue-rally-cabinet-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rescue-rally-cabinet:
    name: Rescue Rally seats, menus and aim through the actual cabinet in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Drive 1-4 seats by keyboard, gamepad and touch through the cabinet
        run: node utils/scripts/verifyRescueRallyCabinet.browser.test.mjs
        env:
          RESCUE_RALLY_SHOTS: rescue-rally-cabinet-shots
      - name: Preserve cabinet states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-rally-cabinet-states
          path: rescue-rally-cabinet-shots
