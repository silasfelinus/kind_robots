name: Ecotone Gameplay Contract
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths:
      - 'utils/ecotone/**'
      - 'stores/ecotoneStore.ts'
      - 'components/ecotone-board.vue'
      - 'components/ecotone-scene.vue'
      - 'components/ecotone-emblem.vue'
      - 'components/ecotone-mystery-card.vue'
      - 'pages/play/ecotone.vue'
      - 'content/channels/arcade/ecotone.md'
      - 'public/ecotone/**'
      - 'utils/scripts/verifyEcotone.test.ts'
      - 'utils/scripts/verifyEcotonePlaystyles.test.ts'
      - 'utils/scripts/verifyEcotoneMysteries.test.ts'
      - 'utils/scripts/validateEcotoneMystery.ts'
      - 'utils/playbook/**'
      - 'stores/playbookStore.ts'
      - 'server/utils/playbook.ts'
      - 'server/api/admin/playbook/**'
      - 'server/api/playbook/**'
      - 'components/playbook/playbook-node.vue'
      - 'components/playbook/playbook-art.vue'
      - 'utils/shiftingLands/**'
      - 'utils/shiftingDesks/**'
      - 'utils/zuzuGamebook/**'
      - 'utils/emperorOfDust/**'
      - 'components/playbook/playbook-detail.vue'
      - 'pages/admin/playbook-manager.vue'
      - 'content/channels/admin/playbook-manager.md'
      - 'prisma/playbook.prisma'
      - 'utils/scripts/verifyPlaybook.test.ts'
      - '.github/workflows/ecotone-gameplay.yml'
concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npm run test:ecotone
      - run: npm run test:ecotone-mysteries
      - run: npm run test:ecotone-companion-continuity
      - run: npm run test:playbook
