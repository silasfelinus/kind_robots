name: Comment Migration Contract

on:
  pull_request:
    paths:
      - 'utils/comments/**'
      - 'utils/scripts/verifyCommentMigrationFoundation.ts'
      - 'utils/scripts/verifyCommentSignals.ts'
      - 'utils/scripts/verifyCommentCalibrationBatch.ts'
      - 'config/**'
      - 'docs/architecture/comment-migration-foundation.md'
      - '.github/workflows/comment-migration-contract.yml'
  push:
    branches: [main]
    paths:
      - 'utils/comments/**'
      - 'utils/scripts/verifyCommentMigrationFoundation.ts'
      - 'utils/scripts/verifyCommentSignals.ts'
      - 'utils/scripts/verifyCommentCalibrationBatch.ts'
      - 'config/**'
      - 'docs/architecture/comment-migration-foundation.md'
      - '.github/workflows/comment-migration-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Verify comment casting boundary, signals, and calibration batch
        run: npm run test:comments
