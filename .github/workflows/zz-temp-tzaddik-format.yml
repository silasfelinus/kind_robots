name: Temporary Tzaddik Formatter

on:
  push:
    branches:
      - fix/tzaddik-production-publish-and-seed-20260927-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Format Tzaddik production-fix files
        run: |
          npx --yes prettier@3.6.2 --write \
            .github/workflows/tzaddik-seed-bootstrap.yml \
            config/tzaddik-initial-seeds.json \
            scripts/import-tzaddik-seeds.mjs

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tzaddik-seed-bootstrap.yml config/tzaddik-initial-seeds.json scripts/import-tzaddik-seeds.mjs
          git commit -m "style(tzaddik): format production seed files"
          git push
