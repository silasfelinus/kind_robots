name: Shifting Desks gameplay contract
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths:
      - 'utils/shiftingDesks/**'
      - 'stores/shiftingDesksStore.ts'
      - 'components/shifting-desks/**'
      - 'pages/play/shifting-desks.vue'
      - 'content/channels/arcade/shifting-desks.md'
      - 'public/shifting-desks/**'
      - 'utils/scripts/verifyShiftingDesks.test.ts'
      - 'utils/scripts/verifyShiftingDesksBalance.test.ts'
      - 'utils/scripts/verifyShiftingDesksAdversarial.test.ts'
      - 'utils/scripts/verifyShiftingDesksReleaseQA.test.ts'
      - 'utils/scripts/verifyShiftingDesksClueChains.test.ts'
      - 'utils/scripts/shiftingDesksAdversarialReport.ts'
      - 'utils/scripts/verifyShiftingDesksArtStyles.test.ts'
      - 'utils/scripts/shiftingDesksBalanceReport.ts'
      - 'cypress/public/shifting-desks-endings.cy.ts'
      - '.github/workflows/shifting-desks-gameplay.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed base URL to verify'
        required: false
        default: 'https://kindrobots.org'
concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx tsx utils/scripts/verifyShiftingDesks.test.ts
      - run: npx tsx utils/scripts/verifyShiftingDesksBalance.test.ts
      - run: npx tsx utils/scripts/verifyShiftingDesksAdversarial.test.ts
      - name: Run 2000-seed release gameplay and reward QA
        shell: bash
        run: npx tsx utils/scripts/verifyShiftingDesksReleaseQA.test.ts | tee shifting-desks-release-qa.txt
      - run: npx tsx utils/scripts/verifyShiftingDesksClueChains.test.ts
      - name: Generate adversarial playtest report
        shell: bash
        run: npx tsx utils/scripts/shiftingDesksAdversarialReport.ts 200 | tee shifting-desks-adversarial-report.md
      - name: Upload adversarial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-adversarial-report
          path: shifting-desks-adversarial-report.md
            shifting-desks-release-qa.txt
          if-no-files-found: ignore
      - run: npx tsx utils/scripts/verifyShiftingDesksArtStyles.test.ts

  # t-026: every ending, loaded from a naturally reached save through real
  # localStorage into the mounted page, at 390/768/1440, plus a real reload
  # and an art-failure fallback. Read-only: no API writes, no deployment.
  browser-contract:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run the endings browser contract
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          config-file: cypress.public.config.ts
          spec: cypress/public/shifting-desks-endings.cy.ts
        env:
          CYPRESS_BASE_URL: ${{ inputs.base_url || 'https://kindrobots.org' }}
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-endings-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
