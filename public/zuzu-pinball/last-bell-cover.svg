  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="76" y="146" font-size="26" letter-spacing="8" fill="#f4ca87">ZUZU PRESENTS</text>
    <text x="73" y="255" font-size="99" font-weight="bold" fill="#f8e7b8" letter-spacing="2">THE</text>
    <text x="67" y="357" font-size="110" font-weight="bold" fill="#f8e7b8" letter-spacing="-4">LAST</text>
    <text x="69" y="457" font-size="110" font-weight="bold" fill="#f8e7b8" letter-spacing="-4">BELL</text>
  </g>
  <path d="M74 484 H469" stroke="#dda46b" stroke-width="4"/>
  <text x="76" y="527" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" letter-spacing="8" fill="#e2c09a">PINBALL</text>
  <text x="76" y="585" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="1.5" fill="#c2d6d5">THE ABBEY • THE RIVER • THE BELL</text>
