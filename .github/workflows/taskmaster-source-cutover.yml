name: Taskmaster Source Cutover

on:
  push:
    branches:
      - codex/taskmaster-permanent-rename

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/taskmaster-permanent-rename
          fetch-depth: 0

      - name: Apply permanent Taskmaster registry migration
        run: node utils/scripts/applyTaskmasterSourceCutover.mjs

      - name: Commit migrated sources and remove one-time machinery
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source migration changes were needed."
            exit 0
          fi
          git config user.name "kind-robots-conductor"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git commit -m "Complete permanent Taskmaster source cutover"
          git push origin HEAD:codex/taskmaster-permanent-rename
