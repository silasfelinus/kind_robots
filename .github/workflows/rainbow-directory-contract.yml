name: Rainbow Community Directory Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/api/rainbow/directory/**'
      - 'server/utils/rainbowDirectory.ts'
      - 'prisma/migrations/**'
      - 'tests/contracts/verifyRainbowDirectory.ts'
      - '.github/workflows/rainbow-directory-contract.yml'

concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --include=optional
      - run: npx tsx tests/contracts/verifyRainbowDirectory.ts
