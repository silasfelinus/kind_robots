name: One-shot Arcade viewport fit formatting
on:
  push:
    branches:
      - worker/interface-vision-t143-arcade-real-fit-c7e2
    paths:
      - .github/workflows/format-arcade-real-fit-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/interface-vision-t143-arcade-real-fit-c7e2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write components/arcade/arcade-cabinet.vue pages/play/arcade/index.vue utils/scripts/auditResponsiveLayout.mjs utils/scripts/verifyArcadeGameSubtabs.test.ts
      - name: Commit formatted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/arcade/arcade-cabinet.vue pages/play/arcade/index.vue utils/scripts/auditResponsiveLayout.mjs utils/scripts/verifyArcadeGameSubtabs.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Arcade contained cabinet viewport fit'
            git push origin HEAD:worker/interface-vision-t143-arcade-real-fit-c7e2
          fi
