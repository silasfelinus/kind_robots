<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hopeful Hues key art</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family:
          'Baloo 2', 'Fredoka', 'Nunito', ui-rounded, system-ui, sans-serif;
        background: linear-gradient(
          180deg,
          #ffd9ec 0%,
          #fff1cf 38%,
          #d9fff0 70%,
          #dfe4ff 100%
        );
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .tile {
        position: absolute;
        filter: drop-shadow(0 6px 6px #a66cff44);
      }
      .hero {
        position: absolute;
        bottom: 6%;
        filter: drop-shadow(0 10px 12px #7d42e055);
      }
      .logo {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }
      .logo svg {
        width: 100%;
        height: auto;
      }
      .tag {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        font-weight: 800;
        color: #6c4aa8;
        background: #ffffffd9;
        border-radius: 999px;
        padding: 0.35em 1.1em;
        box-shadow: 0 4px 0 #e9cdf7;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage"></div>
    <script src="../art.js"></script>
    <script>
      const A = window.HopefulHuesArt
      const params = new URLSearchParams(location.search)
      const mode = params.get('mode') || 'wide'
      const stage = document.getElementById('stage')
      const W = innerWidth
      const H = innerHeight
      const unit = Math.min(W, H)

      function svgLayer(markup) {
        const div = document.createElement('div')
        div.className = 'layer'
        div.innerHTML = markup
        stage.appendChild(div)
      }

      const bands = [
        '#ff5fa2',
        '#ff9f43',
        '#ffd93b',
        '#3ddc97',
        '#4cc9f0',
        '#a66cff',
      ]
      const cx = W / 2
      const cy = H * (mode === 'icon' ? 0.82 : 0.95)
      const r0 = mode === 'icon' ? W * 0.46 : Math.max(W * 0.48, H * 0.9)
      const bandW = mode === 'icon' ? W * 0.06 : r0 * 0.07
      let arcs = ''
      bands.forEach((color, i) => {
        const r = r0 - i * bandW
        arcs += `<path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="${color}" stroke-width="${bandW + 1}" opacity=".85"/>`
      })
      const hills = `<path d="M0 ${H * 0.78} C ${W * 0.2} ${H * 0.66}, ${W * 0.35} ${H * 0.86}, ${W * 0.55} ${H * 0.76} S ${W * 0.85} ${H * 0.68}, ${W} ${H * 0.74} L ${W} ${H} L 0 ${H} Z" fill="#b5f5d9"/><path d="M0 ${H * 0.88} C ${W * 0.25} ${H * 0.8}, ${W * 0.5} ${H * 0.95}, ${W * 0.75} ${H * 0.84} S ${W} ${H * 0.86}, ${W} ${H * 0.86} L ${W} ${H} L 0 ${H} Z" fill="#ffc2dc"/>`
      let sparkles = ''
      for (let i = 0; i < 26; i++) {
        const x = (i * 197) % W
        const y = ((i * 131) % (H * 0.7)) + 10
        const s = 6 + (i % 4) * 4
        sparkles += `<path transform="translate(${x} ${y}) scale(${s / 10})" d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z" fill="${bands[i % 6]}" opacity=".75"/>`
      }
      const cloud = `<g transform="translate(${W * 0.84} ${H * 0.16}) scale(${unit / 520})"><path d="M-40 30 a28 28 0 0 1 6 -54 a34 34 0 0 1 62 -6 a25 25 0 0 1 10 60 z" fill="#c9c4d8"/><circle cx="-10" cy="8" r="4" fill="#5b5470"/><circle cx="14" cy="8" r="4" fill="#5b5470"/><path d="M-6 20 Q2 25 10 20" stroke="#5b5470" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="-20" cy="16" r="5" fill="#ffb3d1" opacity=".7"/><circle cx="24" cy="16" r="5" fill="#ffb3d1" opacity=".7"/></g>`
      svgLayer(
        `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${arcs}${hills}${mode === 'icon' ? '' : sparkles}${mode === 'icon' ? '' : cloud}</svg>`,
      )

      const tileSpots =
        mode === 'icon'
          ? [[0.5, 0.58, 0, 0.44, 0]]
          : [
              [0.07, 0.2, 0, 0.12, -12],
              [0.18, 0.42, 4, 0.1, 10],
              [0.06, 0.62, 2, 0.11, 6],
              [0.93, 0.42, 1, 0.11, 12],
              [0.82, 0.6, 3, 0.1, -8],
              [0.95, 0.72, 5, 0.1, 4],
              [0.27, 0.18, 2, 0.08, 0],
              [0.7, 0.15, 5, 0.08, 14],
              [0.34, 0.6, 0, 0.07, -10],
              [0.64, 0.56, 4, 0.07, 8],
            ]
      for (const [x, y, color, size, rot] of tileSpots) {
        const el = document.createElement('div')
        el.className = 'tile'
        const px = unit * size * (mode === 'icon' ? 1 : 1.3)
        el.style.cssText = `left:${x * W - px / 2}px;top:${y * H - px / 2}px;width:${px}px;height:${px}px;transform:rotate(${rot}deg)`
        el.innerHTML =
          mode === 'icon'
            ? A.rainbowSvg()
            : A.gemSvg(
                color,
                color === 4 ? 'bomb' : color === 1 ? 'h' : null,
                false,
              )
        stage.appendChild(el)
      }

      if (mode !== 'icon') {
        const cast = ['juniper', 'kate', 'sprocket', 'marigold']
        const size = unit * (mode === 'tall' ? 0.3 : 0.34)
        cast.forEach((id, i) => {
          const el = document.createElement('div')
          el.className = 'hero'
          const offset = (i - 1.5) * size * 0.95
          const lift = id === 'kate' || id === 'sprocket' ? size * 0.12 : 0
          el.style.cssText = `left:${W / 2 + offset - size / 2}px;width:${size}px;height:${size}px;bottom:${H * 0.05 + lift}px`
          el.innerHTML = A.portraitSvg(id, size)
          stage.appendChild(el)
        })
        if (params.get('logo') !== '0') {
          const logo = document.createElement('div')
          logo.className = 'logo'
          const lw = Math.min(W * 0.78, H * 1.5)
          logo.style.cssText = `width:${lw}px;top:${H * 0.06}px`
          logo.innerHTML = A.logoSvg()
          stage.appendChild(logo)
          const tag = document.createElement('div')
          tag.className = 'tag'
          tag.style.cssText = `top:${H * 0.06 + lw * 0.27}px;font-size:${Math.max(14, unit * 0.045)}px`
          tag.textContent =
            'Superkate & the Kind Robots · a rainbow match-three'
          stage.appendChild(tag)
        }
      }
    </script>
  </body>
</html>
