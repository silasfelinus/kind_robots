name: Temporary Harmonograph Finalizer
on:
  push:
    branches:
      - worker/animation-manager-t-007-openai-scheduled-2026-09-24T121526Z-animation-manager-t007-a11
    paths:
      - .github/workflows/temporary-harmonograph-finalizer.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/animation-manager-t-007-openai-scheduled-2026-09-24T121526Z-animation-manager-t007-a11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Register, format, and verify
        run: |
          cat > /tmp/harmonograph.json <<'JSON'
          {
            "id": "harmonograph-sand-table",
            "label": "Harmonograph Sand Table",
            "reveal": "The pendulums find a pattern",
            "icon": "kind-icon:vortex",
            "tooltip": "Damped pendulums trace shifting rosettes into sand; move nearby to bend the frequencies, click to rake the table clean 🌀",
            "color": "#c49a6c",
            "releasedAt": "2026-09-24T14:20:54Z",
            "generationSafe": true,
            "preferredSurface": "fullscreen"
          }
          JSON
          node utils/scripts/registerAnimationEffect.mjs --entry /tmp/harmonograph.json
          npx prettier --write components/screenfx/harmonograph-sand-table.vue stores/animationCatalog.ts
          npm run test:animation-catalog
      - name: Remove temporary workflow and commit product changes
        run: |
          git rm .github/workflows/temporary-harmonograph-finalizer.yml
          git add components/screenfx/harmonograph-sand-table.vue stores/animationCatalog.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: register and format harmonograph sand table"
          git push
