name: Storybook Play Again Board Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/storybook-play-again-board-contract.yml'
      - 'stores/storybookRunStore.ts'
      - 'components/storybook/storybook-storymaker.vue'
      - 'components/storybook/storybook-table.vue'
      - 'utils/scripts/verifyStorybookPlayAgainBoardGuard.mjs'
  workflow_dispatch:

concurrency:
  group: storybook-play-again-board-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Storybook play again board contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Storybook play again board guard
        run: node utils/scripts/verifyStorybookPlayAgainBoardGuard.mjs
