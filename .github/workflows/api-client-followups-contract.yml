name: API Client Follow-ups Contract

on:
  # NO paths filter, deliberately. This job is named `verify`, and `verify` is a
  # REQUIRED status check on main -- so a PR that touches none of a filter's paths
  # never produces it and can never merge, no matter how green everything else
  # is. A workflows-only PR hit exactly that and was stuck until this was fixed
  # (dispatching the workflow by hand does not satisfy the rule either; the rule
  # wants the check from the PR's own event).
  #
  # A required check must be unconditional. There is no push trigger: the PR run
  # already checked the merged change, and this contract is a ~40s text scan, so
  # running it on every PR costs nothing worth saving.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsx utils/scripts/verifyApiClientFollowups.ts
