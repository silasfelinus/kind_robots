name: Temporary Prettier diagnostics
on:
  push:
    branches:
      - worker/nav-zuzu-arcade-storybook-20261013-7e8d
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Emit formatted files without changing the branch
        shell: bash
        run: |
          files=(
            'components/home/home-page.vue'
            'components/home/home-visitor-directory.vue'
            'components/navigation/channel-select.vue'
            'components/navigation/channel-tab-list.vue'
            'components/navigation/workspace-header.vue'
            'content/channels/arcade/index.md'
            'pages/admin/zuzu-shifting-lands.vue'
            'pages/play/zuzu-pinball.vue'
            'pages/play/zuzu-shifting-lands.vue'
            'utils/scripts/verifyShiftingBoard.test.ts'
            'utils/scripts/verifyShiftingLands.test.ts'
          )
          npx prettier --write "${files[@]}"
          for path in "${files[@]}"; do
            printf 'FORMAT_BEGIN:%s\\n' "$path"
            base64 -w0 "$path"
            printf '\\nFORMAT_END:%s\\n' "$path"
          done
