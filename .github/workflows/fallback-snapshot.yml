name: Nightly fallback snapshot

# Fetches public content from the database and commits it into stores/fallback/.
# This lets the app serve read-only galleries even when the database is down.
#
# The workflow intentionally runs OUTSIDE the production deployment path. It
# joins the tailnet, reads the public rows, writes deterministic JSON, and opens
# a PR only when the snapshot changed. No production database writes occur.
#
# Required repository Actions secrets:
#   DATABASE_URL
#   DATABASE_SSL_CA_BASE64 or DATABASE_SSL_CA
#   TS_OAUTH_CLIENT_ID
#   TS_OAUTH_SECRET

on:
  schedule:
    - cron: '17 11 * * *' # daily, 11:17 UTC ≈ 3:17am Pacific
  workflow_dispatch:

concurrency:
  group: fallback-snapshot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_CA_BASE64: ${{ secrets.DATABASE_SSL_CA_BASE64 }}
      DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
    steps:
      - name: Require secrets
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty. Add it as a REPOSITORY ACTIONS SECRET (Settings → Secrets and variables → Actions). Runtime env files, Codespaces/Dependabot secrets, and Actions variables do not resolve here."
            exit 1
          fi
          if [ -z "$TS_OAUTH_CLIENT_ID" ] || [ -z "$TS_OAUTH_SECRET" ]; then
            echo "::error::TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET are empty. The database is not reachable from GitHub runner IPs without joining the tailnet."
            exit 1
          fi
          if [ -z "$DATABASE_SSL_CA_BASE64" ] && [ -z "$DATABASE_SSL_CA" ]; then
            echo "::warning::No database CA secret set. ProxySQL enforces TLS, so this run will likely fail with 'Access denied ... SSL is required'."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Generate fallback snapshot
        run: npm run snapshot:fallback

      - name: Verify generated fallback files
        run: |
          set -euo pipefail
          test -f stores/fallback/bots.json
          test -f stores/fallback/characters.json
          test -f stores/fallback/dreams.json
          test -f stores/fallback/facets.json
          test -f stores/fallback/prompts.json
          test -f stores/fallback/rewards.json
          test -f stores/fallback/scenarios.json
          test -f stores/fallback/smart-icons.json
          test -f stores/fallback/metadata.json
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const dir = path.resolve('stores/fallback')
          const files = fs.readdirSync(dir).filter((file) => file.endsWith('.json'))
          for (const file of files) {
            JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'))
          }
          console.log(`Validated ${files.length} fallback JSON file(s).`)
          NODE

      - name: Check for snapshot changes
        id: changes
        run: |
          if git diff --quiet -- stores/fallback; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fallback snapshot unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- stores/fallback
          fi

      - name: Create snapshot branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="bot/fallback-snapshot-$(date -u +%Y%m%d)"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add stores/fallback
          git commit -m "chore: refresh fallback snapshot"
          git push --force-with-lease origin "$branch"

      - name: Open or update snapshot PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Snapshot PR #$existing already exists; branch updated."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: refresh fallback snapshot" \
              --body "Automated nightly refresh of stores/fallback from the current public Kind Robots catalog. Read-only database export; no production writes."
          fi
