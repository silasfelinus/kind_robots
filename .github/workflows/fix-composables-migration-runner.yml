name: Repair Composables Migration Runner

on:
  push:
    branches:
      - agent/remove-composables-island

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-composables-island
          fetch-depth: 0
      - name: Repair nested template literal quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('utils/scripts/migrateComposableIsland.mjs')
          text = path.read_text()
          old = "if (!agents.includes('Do not create a root `composables/` directory'))"
          new = "if (!agents.includes('Do not create a root \\`composables/\\` directory'))"
          if old in text:
              path.write_text(text.replace(old, new))
          PY
      - name: Validate migration script syntax
        run: node --check utils/scripts/migrateComposableIsland.mjs
      - name: Commit only when repaired
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "kind-robots-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add utils/scripts/migrateComposableIsland.mjs
          git commit -m "chore: fix composables migration runner [migration-script-fixed]"
          git push origin HEAD:agent/remove-composables-island
