name: Ruler Hooked

on:
  pull_request:
    paths:
      - 'utils/rulerHooked/**'
      - 'stores/rulerHookedStore.ts'
      - 'components/ruler-hooked/**'
      - 'components/conductor/ruler-hooked-page.vue'
      - '.github/workflows/ruler-hooked.yml'
concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Game loop self-test
        run: npx tsx utils/rulerHooked/game.selftest.ts
      - name: Fishing encounter self-test
        run: npx tsx utils/rulerHooked/encounter.selftest.ts
      - name: Simplified fishing self-test
        run: npx tsx utils/rulerHooked/simpleFishing.selftest.ts
      - name: First-person console and coronation contract
        run: node utils/rulerHooked/consolePOV.selftest.mjs
      - name: Core engine self-test
        run: npx tsx utils/rulerHooked/engine.selftest.ts
      - name: Advisor self-test
        run: npx tsx utils/rulerHooked/advisor.selftest.ts
      - name: Economy (treasure/gear/shop) self-test
        run: npx tsx utils/rulerHooked/economy.selftest.ts
      - name: Kingdom incidents self-test
        run: npx tsx utils/rulerHooked/incidents.selftest.ts
      - name: Kingdom quests self-test
        run: npx tsx utils/rulerHooked/quests.selftest.ts
      - name: Art prompt self-test
        run: npx tsx utils/rulerHooked/artPrompts.selftest.ts
      - name: Card art self-test
        run: npx tsx utils/rulerHooked/cardArt.selftest.ts
      - name: Timing bar self-test
        run: npx tsx utils/rulerHooked/timingBar.selftest.ts
