  <text x="74" y="386" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#e6e6f0" opacity="0.88">gamebook with dice, combat, powers</text>
  <text x="74" y="428" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#e6e6f0" opacity="0.88">and many endings. Free to read and play.</text>
