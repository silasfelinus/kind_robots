name: Shifting Desks gameplay contract
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths:
      - 'utils/shiftingDesks/**'
      - 'stores/shiftingDesksStore.ts'
      - 'components/shifting-desks/**'
      - 'pages/play/shifting-desks.vue'
      - 'content/channels/arcade/shifting-desks.md'
      - 'public/shifting-desks/**'
      - 'utils/scripts/verifyShiftingDesks.test.ts'
      - 'utils/scripts/verifyShiftingDesksBalance.test.ts'
      - 'utils/scripts/verifyShiftingDesksArtStyles.test.ts'
      - 'utils/scripts/shiftingDesksBalanceReport.ts'
      - 'cypress/public/shifting-desks-endings.cy.ts'
      - '.github/workflows/shifting-desks-gameplay.yml'
  push:
    branches: [main]
    paths:
      - 'utils/shiftingDesks/**'
      - 'stores/shiftingDesksStore.ts'
      - 'components/shifting-desks/**'
      - 'pages/play/shifting-desks.vue'
      - 'content/channels/arcade/shifting-desks.md'
      - 'public/shifting-desks/**'
      - 'utils/scripts/verifyShiftingDesks.test.ts'
      - 'utils/scripts/verifyShiftingDesksBalance.test.ts'
      - 'utils/scripts/verifyShiftingDesksArtStyles.test.ts'
      - 'utils/scripts/shiftingDesksBalanceReport.ts'
      - 'cypress/public/shifting-desks-endings.cy.ts'
      - '.github/workflows/shifting-desks-gameplay.yml'
  # The browser contract reads a deployed site, so it runs on demand against
  # the URL given (default production) once a deploy has landed.
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed base URL to verify'
        required: false
        default: 'https://kindrobots.org'
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx tsx utils/scripts/verifyShiftingDesks.test.ts
      - run: npx tsx utils/scripts/verifyShiftingDesksBalance.test.ts
      - run: npx tsx utils/scripts/verifyShiftingDesksArtStyles.test.ts

  # t-026: every ending, loaded from a naturally reached save through real
  # localStorage into the mounted page, at 390/768/1440, plus a real reload
  # and an art-failure fallback. Read-only: no API writes, no deployment.
  browser-contract:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run the endings browser contract
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          config-file: cypress.public.config.ts
          spec: cypress/public/shifting-desks-endings.cy.ts
        env:
          CYPRESS_BASE_URL: ${{ inputs.base_url || 'https://kindrobots.org' }}
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shifting-desks-endings-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
