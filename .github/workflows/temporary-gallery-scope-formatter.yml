name: Temporary Gallery Scope Formatter

on:
  push:
    branches:
      - worker/gallery-scope-chooser-20260923t2148

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/gallery-scope-chooser-20260923t2148
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Format touched files
        run: >-
          npx prettier --write
          components/art/art-gallery.vue
          server/api/art/collection/index.get.ts
          server/api/art/collection/unsorted.get.ts
          server/api/art/gallery/chooser.get.ts
          stores/artCollectionBrowseStore.ts
          stores/collectionStore.ts
          utils/scripts/verifyMaturityPrivacyContract.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/art/art-gallery.vue server/api/art/collection/index.get.ts server/api/art/collection/unsorted.get.ts server/api/art/gallery/chooser.get.ts stores/artCollectionBrowseStore.ts stores/collectionStore.ts utils/scripts/verifyMaturityPrivacyContract.ts
          git commit -m "style: format gallery scope changes"
          git push origin HEAD:worker/gallery-scope-chooser-20260923t2148
