name: Normalize Storybook t-010 rollback formatting

on:
  push:
    branches:
      - worker/storybook-t010-seed-notice-20260813-8af3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/storybook-t010-seed-notice-20260813-8af3
          fetch-depth: 0
      - name: Normalize bounded rollback block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('stores/storybookStore.ts')
          text = path.read_text()
          old = '''    )
          if (!openingWove) {
            // Keep the setup draft and generation error visible so the reader can
            // retry instead of being stranded inside an empty active session.
            session.value = null
            persist()
          }
          return openingWove
          }'''
          if old in text:
              raise SystemExit('unexpected already-indented workflow source leaked into product file')
          old = '''    )
          '''
          # Operate only inside beginStory and normalize leading whitespace on the inserted lines.
          start = text.index('  async function beginStory(input: StorybookStartInput): Promise<boolean> {')
          end = text.index('\n  async function answerCurrentBeat', start)
          block = text[start:end]
          block = block.replace('\n  if (!openingWove) {', '\n    if (!openingWove) {', 1)
          block = block.replace('\n  return openingWove', '\n    return openingWove', 1)
          path.write_text(text[:start] + block + text[end:])
          PY
          rm .github/workflows/worker-storybook-t010-format.yml
          git diff --check
          node utils/scripts/verifyStorybookStudio.mjs
      - name: Commit formatting repair
        shell: bash
        run: |
          git config user.name "Conductor Worker"
          git config user.email "actions@users.noreply.github.com"
          git add stores/storybookStore.ts .github/workflows/worker-storybook-t010-format.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m "style: align Storybook opening rollback"
          git push origin HEAD:worker/storybook-t010-seed-notice-20260813-8af3
