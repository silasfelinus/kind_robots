name: Temporary Zuzu Format
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-zuzu-authored-format.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'worker/zuzu-shifting-lands-t020-playable-20261010-f8a7'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/zuzu-shifting-lands-t020-playable-20261010-f8a7
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx prettier --write components/navigation/flip-card.vue components/shifting-lands-journey-board.vue stores/shiftingLandsJourneyStore.ts pages/admin/zuzu-shifting-lands.vue utils/shiftingLands/authoredJourney.ts utils/shiftingLands/authoredHomestead.json utils/scripts/verifyShiftingAuthored.test.ts utils/scripts/verifyShiftingBoard.test.ts
      - name: Push scoped format
        run: |
          git add -- components/navigation/flip-card.vue components/shifting-lands-journey-board.vue stores/shiftingLandsJourneyStore.ts pages/admin/zuzu-shifting-lands.vue utils/shiftingLands/authoredJourney.ts utils/shiftingLands/authoredHomestead.json utils/scripts/verifyShiftingAuthored.test.ts utils/scripts/verifyShiftingBoard.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prettier format playable Zuzu board and authored engine'
          git push origin HEAD:refs/heads/worker/zuzu-shifting-lands-t020-playable-20261010-f8a7
