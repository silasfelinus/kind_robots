name: One-shot Shifting Lands V4 formatter
on:
  push:
    branches:
      - worker/zuzu-shifting-lands-t025-v4-later-lands-20261011-d41e
    paths:
      - .github/workflows/zuzu-t025-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/zuzu-shifting-lands-t025-v4-later-lands-20261011-d41e
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Format scoped files and remove temporary workflow
        run: |
          npx prettier --write utils/shiftingLands/authoredFiveLands.ts utils/shiftingLands/saveLedgerV4.ts utils/shiftingLands/authoredLaterLands.json utils/shiftingLands/README.md utils/scripts/verifyShiftingV4.test.ts utils/scripts/verifyShiftingBoard.test.ts stores/shiftingLandsJourneyStore.ts components/shifting-lands-journey-board.vue
          git rm .github/workflows/zuzu-t025-format-once.yml
          git add utils/shiftingLands/authoredFiveLands.ts utils/shiftingLands/saveLedgerV4.ts utils/shiftingLands/authoredLaterLands.json utils/shiftingLands/README.md utils/scripts/verifyShiftingV4.test.ts utils/scripts/verifyShiftingBoard.test.ts stores/shiftingLandsJourneyStore.ts components/shifting-lands-journey-board.vue
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(shifting-lands): format V4 five-land authored integration'
          git push origin HEAD:refs/heads/worker/zuzu-shifting-lands-t025-v4-later-lands-20261011-d41e
