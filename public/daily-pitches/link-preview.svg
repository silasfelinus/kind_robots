  <g transform="translate(1060 150) rotate(14)"><circle r="56" fill="#ffd36b"/><text y="-6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="22" fill="#5a2d4a">NEW</text><text y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="18" fill="#5a2d4a">daily</text></g>
  <text x="70" y="220" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-weight="900" font-size="84" fill="#ffd36b" letter-spacing="3" textLength="560" lengthAdjust="spacingAndGlyphs">DAILY PITCHES</text>
  <text x="74" y="292" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="32" fill="#ffffff">A fresh idea every single day.</text>
  <text x="74" y="336" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#e6e6f0" opacity="0.85">New games, robots and stories pitched</text>
  <text x="74" y="380" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#e6e6f0" opacity="0.85">daily. Browse the latest and pick a</text>
  <text x="74" y="424" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#e6e6f0" opacity="0.85">favourite. Free in your browser.</text>
  <text x="74" y="590" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#ff8f6b" letter-spacing="2">kindrobots.org</text>
