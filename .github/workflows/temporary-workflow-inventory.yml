name: Temporary workflow inventory

on:
  push:
    branches:
      - worker/workflow-audit-20260804
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Report compact workflow inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request
          import yaml

          root = pathlib.Path('.github/workflows')
          paths = sorted([*root.glob('*.yml'), *root.glob('*.yaml')])
          print(f'WORKFLOW_FILE_COUNT={len(paths)}')
          print('SOURCE_WORKFLOWS_BEGIN')
          for path in paths:
              data = yaml.load(path.read_text(encoding='utf-8'), Loader=yaml.BaseLoader) or {}
              triggers = data.get('on', {})
              if isinstance(triggers, str):
                  events = [triggers]
              elif isinstance(triggers, list):
                  events = triggers
              elif isinstance(triggers, dict):
                  events = list(triggers.keys())
              else:
                  events = []
              schedules = []
              if isinstance(triggers, dict):
                  schedule = triggers.get('schedule', []) or []
                  if isinstance(schedule, list):
                      schedules = [entry.get('cron') for entry in schedule if isinstance(entry, dict)]
              print(json.dumps({
                  'path': path.as_posix(),
                  'name': data.get('name'),
                  'events': events,
                  'cron': schedules,
              }, sort_keys=True))
          print('SOURCE_WORKFLOWS_END')

          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']

          def api(path):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          workflows = api('/actions/workflows?per_page=100').get('workflows', [])
          print(f'API_WORKFLOW_COUNT={len(workflows)}')
          print('API_WORKFLOWS_BEGIN')
          for workflow in workflows:
              runs = api(f"/actions/workflows/{workflow['id']}/runs?per_page=2").get('workflow_runs', [])
              print(json.dumps({
                  'id': workflow['id'],
                  'name': workflow.get('name'),
                  'path': workflow.get('path'),
                  'state': workflow.get('state'),
                  'runs': [
                      {
                          'id': run.get('id'),
                          'event': run.get('event'),
                          'conclusion': run.get('conclusion'),
                          'created_at': run.get('created_at'),
                          'head_branch': run.get('head_branch'),
                      }
                      for run in runs
                  ],
              }, sort_keys=True))
          print('API_WORKFLOWS_END')
          PY
