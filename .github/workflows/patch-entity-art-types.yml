name: Patch Entity Art Types

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/patch-entity-art-types.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/shared-entity-art-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shared-entity-art-manager
          fetch-depth: 0
      - name: Patch precise TypeScript errors
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('components/art/entity-art-manager.vue')
          text = component.read_text()
          old = """const recreatePresets: GenerationPreset[] = [
  {
    key: 'quality',
    label: 'Quality default',
    description: 'Uses the current quality-focused workflow defaults.',
  },
"""
          new = """const qualityPreset: GenerationPreset = {
  key: 'quality',
  label: 'Quality default',
  description: 'Uses the current quality-focused workflow defaults.',
}
const recreatePresets: GenerationPreset[] = [
  qualityPreset,
"""
          if old not in text:
              raise RuntimeError('quality preset anchor not found')
          text = text.replace(old, new, 1)
          old = """const selectedPreset = computed(
  () =>
    availablePresets.value.find((preset) => preset.key === presetKey.value) ||
    availablePresets.value[0] ||
    recreatePresets[0],
)
"""
          new = """const selectedPreset = computed<GenerationPreset>(
  () =>
    availablePresets.value.find((preset) => preset.key === presetKey.value) ??
    availablePresets.value[0] ??
    qualityPreset,
)
"""
          if old not in text:
              raise RuntimeError('selected preset anchor not found')
          component.write_text(text.replace(old, new, 1))

          service = Path('server/utils/entityArt.ts')
          text = service.read_text()
          old = """import type {
  Prisma,
  PrismaClient,
} from '~/prisma/generated/prisma/client'
"""
          new = """import type { Prisma } from '~/prisma/generated/prisma/client'
import type prisma from '~/server/utils/prisma'
"""
          if old not in text:
              raise RuntimeError('Prisma import anchor not found')
          text = text.replace(old, new, 1)
          old = "type EntityArtDb = PrismaClient | Prisma.TransactionClient\n"
          new = """type EntityArtDb = Pick<
  typeof prisma,
  'bot' | 'character' | 'scenario' | 'reward' | 'facet' | 'artImage'
>
"""
          if old not in text:
              raise RuntimeError('EntityArtDb anchor not found')
          service.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/art/entity-art-manager.vue server/utils/entityArt.ts
          git commit -m "Fix shared entity art TypeScript boundaries"
          git push origin HEAD
