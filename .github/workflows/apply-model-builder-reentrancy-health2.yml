name: Apply Model Builder reentrancy patch

on:
  push:
    branches:
      - worker/model-builder-t029-reentrancy-health2
    paths:
      - .github/workflows/apply-model-builder-reentrancy-health2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/model-builder-t029-reentrancy-health2
          fetch-depth: 1

      - name: Apply focused patch and regression coverage
        shell: python
        run: |
          from pathlib import Path

          store_path = Path('stores/modelBuilderStore.ts')
          store = store_path.read_text()
          old_store = """    const item = findItem(itemId)
              if (!item || !state.run) return false

              const isAsset = item.action === 'ASSET_ONLY'
          """.replace('          ', '')
          new_store = """    const item = findItem(itemId)
              if (!item || !state.run) return false

              if (state.autoBuildingItemId === item.id) return false

              const isAsset = item.action === 'ASSET_ONLY'
          """.replace('          ', '')
          if store.count(old_store) != 1:
              raise SystemExit(f'expected one autoBuildItem insertion point, found {store.count(old_store)}')
          store_path.write_text(store.replace(old_store, new_store, 1))

          checker_path = Path('utils/scripts/verifyModelBuilderAutoBuildDraftGate.ts')
          checker = checker_path.read_text()
          old_checker = """  for (const { field, stageKey } of DRAFT_GATES) {
          """
          new_checker = """  const claimIndex = fn.body.indexOf('autoBuildingItemSingleton.claim(item.id)')
          const reentrancyGuard = /if\\s*\\(\\s*state\\.autoBuildingItemId\\s*===\\s*item\\.id\\s*\\)\\s*return false/.exec(
            fn.body,
          )
          if (
            claimIndex < 0 ||
            !reentrancyGuard ||
            reentrancyGuard.index > claimIndex
          ) {
            errors.push(
              `${FN_NAME}() must return false when state.autoBuildingItemId already ` +
                'equals item.id before claiming autoBuildingItemSingleton. Without ' +
                'that entry guard, the item-level Auto action can overlap with batch ' +
                'or run-level auto-build for the same item and duplicate draft, render, ' +
                'or commit work.',
            )
          }

          for (const { field, stageKey } of DRAFT_GATES) {
          """
          if checker.count(old_checker) != 1:
              raise SystemExit(f'expected one checker insertion point, found {checker.count(old_checker)}')
          checker_path.write_text(checker.replace(old_checker, new_checker, 1))

          test_path = Path('utils/scripts/verifyModelBuilderAutoBuildDraftGate.test.ts')
          test = test_path.read_text()
          fixed_anchor = """    const item = findItem(itemId)
              if (!item || !state.run) return false

              const isAsset = item.action === 'ASSET_ONLY'
          """.replace('          ', '')
          fixed_replacement = """    const item = findItem(itemId)
              if (!item || !state.run) return false

              if (state.autoBuildingItemId === item.id) return false

              const isAsset = item.action === 'ASSET_ONLY'
          """.replace('          ', '')
          first = test.find(fixed_anchor)
          second = test.find(fixed_anchor, first + 1)
          if first < 0 or second < 0:
              raise SystemExit('expected buggy and fixed autoBuildItem fixtures')
          test = test[:second] + test[second:].replace(fixed_anchor, fixed_replacement, 1)
          test = test.replace(
            "  3,\n  'expected the pre-fix shape (all three discarded draftText results) to ' +\n    `raise 3 errors, got ${buggyErrors.length}: ${JSON.stringify(buggyErrors)}`,",
            "  4,\n  'expected the pre-fix shape (three discarded draftText results plus the ' +\n    'missing same-item reentrancy guard) to raise 4 errors, got ' +\n    `${buggyErrors.length}: ${JSON.stringify(buggyErrors)}`,",
            1,
          )
          buggy_assert_anchor = """assert.ok(
            buggyErrors.some((e) => e.includes(\"'artPrompt'\") && e.includes('discarded')),
            'expected a violation for the discarded artPrompt draft result',
          )

          const fixedErrors = checkAutoBuildDraftGate(FIXED_FIXTURE)
          """
          buggy_assert_replacement = """assert.ok(
            buggyErrors.some((e) => e.includes(\"'artPrompt'\") && e.includes('discarded')),
            'expected a violation for the discarded artPrompt draft result',
          )
          assert.ok(
            buggyErrors.some((e) => e.includes('autoBuildingItemId')),
            'expected a violation for the missing same-item reentrancy guard',
          )

          const fixedErrors = checkAutoBuildDraftGate(FIXED_FIXTURE)
          """
          if test.count(buggy_assert_anchor) != 1:
              raise SystemExit('expected buggy assertion anchor')
          test = test.replace(buggy_assert_anchor, buggy_assert_replacement, 1)
          fixed_assert_anchor = """assert.equal(
            fixedErrors.length,
            0,
            `expected the fixed shape to raise no errors, got: ${JSON.stringify(fixedErrors)}`,
          )

          const missingFnErrors = checkAutoBuildDraftGate(MISSING_FIXTURE)
          """
          fixed_assert_replacement = """assert.equal(
            fixedErrors.length,
            0,
            `expected the fixed shape to raise no errors, got: ${JSON.stringify(fixedErrors)}`,
          )

          const REENTRANT_FIXTURE = FIXED_FIXTURE.replace(
            '    if (state.autoBuildingItemId === item.id) return false\\n\\n',
            '',
          )
          const reentrantErrors = checkAutoBuildDraftGate(REENTRANT_FIXTURE)
          assert.equal(
            reentrantErrors.length,
            1,
            'expected exactly one violation when only the same-item reentrancy guard is missing',
          )
          assert.ok(reentrantErrors[0]!.includes('autoBuildingItemId'))

          const missingFnErrors = checkAutoBuildDraftGate(MISSING_FIXTURE)
          """
          if test.count(fixed_assert_anchor) != 1:
              raise SystemExit('expected fixed assertion anchor')
          test = test.replace(fixed_assert_anchor, fixed_assert_replacement, 1)
          test_path.write_text(test)

          Path('.github/workflows/apply-model-builder-reentrancy-health2.yml').unlink()

      - name: Commit patch
        run: |
          git config user.name "kind-robots-health-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stores/modelBuilderStore.ts utils/scripts/verifyModelBuilderAutoBuildDraftGate.ts utils/scripts/verifyModelBuilderAutoBuildDraftGate.test.ts .github/workflows/apply-model-builder-reentrancy-health2.yml
          git commit -m "fix(model-builder): block duplicate same-item auto-builds"
          git push origin HEAD:worker/model-builder-t029-reentrancy-health2
