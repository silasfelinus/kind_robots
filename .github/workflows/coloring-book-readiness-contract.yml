name: Coloring Book Production Contract

on:
  pull_request:
    paths:
      - 'components/coloring/coloring-book-page.vue'
      - 'components/coloring/coloring-book-version-strip.vue'
      - 'components/coloring/coloring-book-render-settings.vue'
      - 'components/curation/coloring-book-curation.vue'
      - 'server/api/conductor/coloring-books/**'
      - 'server/utils/coloringBookStudio.ts'
      - 'server/utils/coloringBookEvents.ts'
      - 'server/utils/coloringBookRenderOptions.ts'
      - 'utils/coloringBookVersions.ts'
      - 'utils/scripts/verifyColoringBookCuration.ts'
      - 'types/coloringBookStudio.ts'
      - 'server/api/conductor/coloring-books/package.get.ts'
      - 'server/utils/coloringBookPackage.ts'
      - 'stores/coloringBookStudioStore.ts'
      - 'types/coloringBookPackage.ts'
      - 'utils/coloringBookReadiness.ts'
      - 'utils/coloringBookPackage.ts'
      - 'utils/scripts/verifyColoringBookReadiness.ts'
      - 'utils/scripts/verifyColoringBookPackage.ts'
      - '.github/workflows/coloring-book-readiness-contract.yml'
env:
  CYPRESS_INSTALL_BINARY: '0'

concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify interior and cover readiness
        run: npx tsx utils/scripts/verifyColoringBookReadiness.ts

      - name: Verify print-package readiness
        run: npx tsx utils/scripts/verifyColoringBookPackage.ts

      - name: Verify curation riff/recast edits and version revert
        run: npx tsx utils/scripts/verifyColoringBookCuration.ts
