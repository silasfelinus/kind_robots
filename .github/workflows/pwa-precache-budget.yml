name: PWA Precache Budget

on:
  pull_request:
    paths:
      - 'nuxt.config.ts'
      - 'utils/scripts/verifyPwaPrecacheBudget.ts'
      - '.github/workflows/pwa-precache-budget.yml'
env:
  CYPRESS_INSTALL_BINARY: '0'

concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx utils/scripts/verifyPwaPrecacheBudget.ts
