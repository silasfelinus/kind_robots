name: Arcade Cabinet Browser Contracts

# Real ArcadeCabinet + real game in headless Chromium, driven by synthetic keyboard,
# gamepad and touch (conductor kr-arcade t-147, t-148, t-151, t-152, t-153, t-150). One job installs Chromium once
# and runs every cabinet contract; add new ones as further steps.

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/arcade/arcade-cabinet.vue'
      - 'stores/arcadeStore.ts'
      - 'utils/arcade/**'
      - 'utils/scripts/arcadeCabinetFixture.mjs'
      - 'utils/scripts/*Cabinet.browser.test.mjs'
      - 'utils/scripts/verifySavePlumberAudio.test.ts'
      - 'utils/scripts/verifySavePlumberFrontPage.test.ts'
      - 'utils/scripts/verifySavePlumberBossTaunts.test.ts'
      - 'utils/scripts/verifySavePlumberReading.test.ts'
      - 'utils/scripts/verifySavePlumberNameEntry.test.ts'
      - 'pages/play/save-the-plumber.vue'
      - 'utils/scripts/verifySuperkateSpectrum.test.ts'
      - 'utils/scripts/verifySpectrumCampaign.test.ts'
      - 'utils/scripts/verifyArcadeSoundtrackMixer.test.ts'
      - 'utils/scripts/verifySpectrumRecordedMusic.test.ts'
      - 'utils/scripts/verifyCabinetSpectrumSaveRace.test.ts'
      - 'utils/scripts/verifyCabinetRibbonRidersFairgrounds.test.ts'
      - 'utils/scripts/verifyCabinetRibbonRidersLate.test.ts'
      - 'public/audio/arcade/superkate-spectrum/**'
      - 'server/api/arcade/saves/**'
      - '.github/workflows/arcade-cabinet-contracts.yml'

permissions:
  contents: read

concurrency:
  group: arcade-cabinet-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cabinet-contracts:
    name: Seats, menus, aim and saves through the actual cabinet in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Save the Plumber — original gameplay cue and mixer contract
        run: npx tsx utils/scripts/verifySavePlumberAudio.test.ts
      - name: Save the Plumber — console page contract, boss taunts, reading options and name entry
        run: |
          npx tsx utils/scripts/verifySavePlumberFrontPage.test.ts
          npx tsx utils/scripts/verifySavePlumberBossTaunts.test.ts
          npx tsx utils/scripts/verifySavePlumberReading.test.ts
          npx tsx utils/scripts/verifySavePlumberNameEntry.test.ts
      - name: Ribbon Riders — authored fairgrounds, bosses and secret finale
        run: |
          npx tsx utils/scripts/verifyCabinetRibbonRidersFairgrounds.test.ts
          npx tsx utils/scripts/verifyCabinetRibbonRidersLate.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Rescue Rally — 1-4 seats by keyboard, gamepad and touch
        run: node utils/scripts/verifyRescueRallyCabinet.browser.test.mjs
        env:
          RESCUE_RALLY_SHOTS: cabinet-contract-shots/rescue-rally
      - name: Battery Maze — saved-entry modes through the cabinet and arcade store
        if: always()
        run: node utils/scripts/verifyBatteryMazeSavesCabinet.browser.test.mjs
      - name: Bumper Bubbles — pantry cards through cabinet retirement and Continue
        if: always()
        run: node utils/scripts/verifyBumperBubblesSavesCabinet.browser.test.mjs
      - name: Butterfly Blaster — earned history through cabinet retirement and reload
        if: always()
        run: node utils/scripts/verifyButterflyBlasterSavesCabinet.browser.test.mjs
      - name: Cable Crawler — earned spares through cabinet retirement and the Workbench
        if: always()
        run: node utils/scripts/verifyCableCrawlerSavesCabinet.browser.test.mjs
      - name: Ribbon Riders — wraps steered through the cabinet, seam renderer
        if: always()
        run: node utils/scripts/verifyRibbonRidersWrapCabinet.browser.test.mjs
        env:
          RIBBON_SEAM_SHOTS: cabinet-contract-shots/ribbon-riders
      - name: Rainbow settings — bind a key and fly it, Escape cancels, comms and contrast switch
        if: always()
        run: node utils/scripts/verifyRainbowSettingsCabinet.browser.test.mjs
      - name: Save the Plumber — keyboard, gamepad and touch in Chromium
        if: always()
        run: node utils/scripts/verifySavePlumberCabinet.browser.test.mjs
      - name: Arcade key remap — bindable keys, moves, reserved keys and wiring
        if: always()
        run: npx tsx utils/scripts/verifyArcadeKeyRemap.test.ts
      - name: Rainbow performance — four pilots in a boss phase, engine and frame p50/p95 and heap
        if: always()
        run: node utils/scripts/verifyRainbowPerformance.browser.test.mjs
        env:
          RAINBOW_PERF_REPORT: cabinet-contract-shots/rainbow-performance.json
      - name: Superkate Spectrum — engine, boards, bosses, hub, career and touch plan
        if: always()
        run: npx tsx utils/scripts/verifySuperkateSpectrum.test.ts
      - name: Superkate Spectrum — full 30-stage campaign to all three endings, and careless play
        if: always()
        run: npx tsx utils/scripts/verifySpectrumCampaign.test.ts
      - name: Soundtrack mixer — recorded/oscillator buses, ducking, cues and game mix levels
        if: always()
        run: npx tsx utils/scripts/verifyArcadeSoundtrackMixer.test.ts
      - name: Superkate Spectrum — recorded music masters
        if: always()
        run: npx tsx utils/scripts/verifySpectrumRecordedMusic.test.ts
      - name: Superkate Spectrum — cloud save races and account switches
        if: always()
        run: npx tsx utils/scripts/verifyCabinetSpectrumSaveRace.test.ts
      - name: Superkate Spectrum — hub, touch, keyboard, gamepad and saves at 390/768/1440
        if: always()
        run: node utils/scripts/verifySuperkateSpectrumCabinet.browser.test.mjs
        env:
          SPECTRUM_CABINET_SHOTS: cabinet-contract-shots/superkate-spectrum
      - name: Superkate Spectrum — hub scrapbook, trophies, settings and save state at 390/768/1440
        if: always()
        run: node utils/scripts/verifySuperkateSpectrumHub.browser.test.mjs
        env:
          SPECTRUM_HUB_SHOTS: cabinet-contract-shots/superkate-spectrum-hub
      - name: Superkate Spectrum — two devices, one account (guest adoption, 409 merge, switch, outage)
        if: always()
        run: node utils/scripts/verifySuperkateSpectrumAccounts.browser.test.mjs
      - name: Preserve cabinet states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-cabinet-contract-states
          path: cabinet-contract-shots
          if-no-files-found: ignore
