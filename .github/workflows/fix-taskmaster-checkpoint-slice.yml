name: Fix Taskmaster Checkpoint Slice

on:
  push:
    branches:
      - codex/taskmaster-checkpoint-engine
    paths:
      - .github/workflows/fix-taskmaster-checkpoint-slice.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/taskmaster-checkpoint-engine
          fetch-depth: 0
      - name: Apply focused fixes
        run: python utils/scripts/fixTaskmasterCheckpointSlice.py
      - name: Remove one-time fix machinery
        run: |
          rm utils/scripts/fixTaskmasterCheckpointSlice.py
          rm .github/workflows/fix-taskmaster-checkpoint-slice.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stores/taskmasterStore.ts components/pages/taskmaster-page.vue utils/scripts/fixTaskmasterCheckpointSlice.py .github/workflows/fix-taskmaster-checkpoint-slice.yml
          git commit -m "fix: complete Taskmaster checkpoint transition"
          git push origin HEAD:codex/taskmaster-checkpoint-engine
