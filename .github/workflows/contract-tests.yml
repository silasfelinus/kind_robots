name: Contract Tests

# Fast, DB-free contract checks for cross-repo and content-driven contracts.
# No database or Nuxt build is needed, so these can gate every pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Contract verifiers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Art-request YAML indentation contract
        run: npm run test:art-request-yaml

      - name: Entity art primary/crop contract
        run: npm run test:entity-art-primary-crop

      - name: ArtJob smart-queue affinity contract
        run: npm run test:artjob-queue-affinity

      - name: GitHub file-read contract
        run: npm run test:github-file-contents

      - name: Art prompt contract
        run: npm run test:art-prompt-contract

      - name: Enqueue prompt gate contract
        run: npm run test:enqueue-prompt-gate

      - name: Facet catalog cache reuse
        run: npm run test:facet-catalog-cache

      - name: Object art history reachability
        run: npm run test:object-art-history

      - name: Facet taxonomy-first navigation
        run: npm run test:facet-taxonomy-first

      - name: Queued prompt gate contract
        run: npm run test:queued-prompt-gate

      - name: ArtJob sampler repair contract
        run: npm run test:artjob-sampler-repair

      - name: ArtJob priority bounds contract
        run: npm run test:artjob-priority-bounds

      - name: ArtJob slideshow rotation contract
        run: npm run test:art-slideshow-rotation

      - name: Art failure-signature grouping contract
        run: npm run test:art-failure-signature

      - name: Comfy-only generation contract
        run: npm run test:comfy-only-generation

      - name: LoRA cfg ceiling contract
        run: npm run test:lora-cfg-ceiling

      - name: LoRA cfg ceiling enqueue-path wiring contract
        run: npm run test:lora-cfg-wiring

      - name: LoRA probe subject injection contract
        run: npm run test:lora-probe-subject

      - name: LoRA category classification contract
        run: npm run test:lora-category

      # The lookup that silently did nothing: --fetch-tags keyed on a column
      # almost no row has, so it reached 2 of 1,221 and reported success.
      - name: Civitai id resolution contract
        run: npm run test:civitai-ids

      # The same sweep, silent for 25 minutes: every network round trip ran
      # before the first line printed, so "working" and "wedged" looked alike.
      - name: LoRA backfill progress-output contract
        run: npm run test:backfill-progress

      # The category is only as trustworthy as what produced it, and the field
      # that says which never rode the list select the triage grid reads from.
      - name: LoRA category provenance contract
        run: npm run test:lora-provenance

      # Both of these cover server/utils/promptVariants.ts, which is now shared
      # between the Challenge Center's variant generator and the art
      # randomizer's batch roll. test:prompt-variants existed but was wired
      # into no workflow, so the Challenge Center half of that contract was
      # unguarded at exactly the moment a second caller started depending on it.
      - name: Prompt variant generation contract
        run: npm run test:prompt-variants

      - name: Randomized art batch contract
        run: npm run test:art-random-batch

      - name: Model download taxonomy contract
        run: npx tsx utils/scripts/verifyResourceDownloadTaxonomy.ts

      - name: WAN image-to-video mode contract
        run: npm run test:wan-i2v-modes

      - name: Channel content contract
        run: npm run test:channel-content

      - name: No Promise in Pinia store state
        run: npm run test:no-promise-in-store-state

      - name: UI tier vocabulary (workspace stays with navigation)
        run: npm run test:ui-tier-vocabulary

      - name: Card action contract (cards emit, galleries decide)
        run: npm run test:card-action-contract

      - name: Channel resolver contract
        run: npm run test:channel-resolver

      - name: Gallery adoption contract
        run: npm run test:gallery-adoption

      - name: Gallery consistency contract
        run: npm run test:gallery-consistency

      - name: Disabled-affordance contract
        run: npm run test:disabled-affordances

      - name: Route gallery contract
        run: npm run test:route-gallery-contract

      - name: Narrative roles contract
        run: npm run test:narrative-roles

      - name: Narrative cast tiers contract
        run: npm run test:narrative-cast-tiers

      - name: Earned-karma wiring contract
        run: npm run test:earned-karma-wiring

      - name: Reaction target coverage contract
        run: npm run test:reaction-targets

      - name: Mandarin proficiency-coverage contract
        run: npm run test:mandarin-proficiency-coverage-selftest

      - name: Mandarin cloud-state merge contract
        run: npm run test:mandarin-cloud-merge-selftest

      - name: Mandarin art recipe contract
        run: npm run test:mandarin-art-recipe

      - name: Mandarin lesson derivation contract
        run: npm run test:mandarin-lesson

      - name: Mandarin lesson-coverage audit contract
        run: npm run test:mandarin-lesson-coverage-selftest

      - name: Mandarin points contract
        run: npm run test:mandarin-points

      - name: Mandarin course contract
        run: npm run test:mandarin-course

      - name: Reaction route auth contract
        run: npm run test:reaction-route-auth

      - name: Component reachability contract
        run: npm run test:component-reachability

      - name: Page backdrop contract
        run: npm run test:page-backdrop

      - name: Tzaddik source-image contract
        run: npx tsx utils/scripts/verifyTzaddikSourceImages.test.ts

      - name: Art image caching contract
        run: npm run test:art-image-caching

      - name: ArtImage offload contract
        run: npm run test:art-image-offload

      - name: Animated art offload contract
        run: npm run test:animated-art-offload

      - name: Scene Animator resubmit contract
        run: npm run test:scene-animator-resubmit

      - name: Scene Animator prompt contract
        run: npm run test:scene-animator-prompt

      - name: Scene Animator prompt override contract
        run: npm run test:scene-animator-prompt-override

      - name: ESLint ratchet
        run: npm run test:lint-ratchet

      - name: Prettier ratchet
        run: npm run test:prettier-ratchet

      - name: Data surface manifest contract
        run: npm run test:data-surface-manifest

      - name: Mature-term matcher self-test
        run: npm run test:mature-terms

      - name: No content route shadowed by a page
        run: npm run test:no-shadowed-content-routes

      - name: Nav manifest contract
        run: npm run test:nav-manifest

      - name: Database pool defaults contract
        run: npm run test:database-pool-defaults

      - name: Migrate-on-deploy contract
        run: npm run test:migrate-on-deploy

      - name: Project scaffold Todo parity contract
        run: npm run test:project-scaffold-todo-parity

      - name: Maturity and privacy generation contract
        run: npx tsx utils/scripts/verifyMaturityPrivacyContract.ts

      - name: Art generator preset contract
        run: npm run test:art-generator-presets

      - name: LoRA chain contract
        run: npm run test:lora-chain

      - name: Dream store fetch merge contract
        run: npx tsx utils/scripts/verifyDreamStoreFetchMerge.ts

      - name: User directory cache safety contract
        run: npx tsx utils/scripts/verifyUserStoreCacheSafety.ts

      - name: Achievement hydration safety contract
        run: npm run test:achievement-store

      - name: Achievement catalog, trigger, popup, and artwork contract
        run: npm run test:achievement-catalog

      - name: Known failed Prisma migration repair contract
        run: node utils/scripts/verify-known-migration-repair.mjs

      - name: Academy style-detail caller-doc contract
        run: npm run test:academy-style-detail-callers

      - name: Academy starter manifest provenance contract
        run: npm run test:academy-starter-manifest

      - name: Academy examples manifest provenance contract
        shell: bash
        run: npm run test:academy-examples-manifest 2>&1 | tee academy-examples-contract.txt

      - name: Academy artist-portraits manifest provenance contract
        run: npm run test:academy-artist-portraits-manifest

      - name: Academy style gallery disclosure contract
        run: npm run test:academy-style-gallery-disclosure

      - name: Academy failureMode coverage contract
        run: npm run test:academy-failuremode-coverage

      - name: Navigation route access contract
        run: npx tsx utils/scripts/verifyNavigationRouteAccess.ts

      - name: Workflow path references contract
        run: npm run test:workflow-paths

      - name: Workflow pipefail contract
        run: npm run test:workflow-pipefail

      - name: Nightly workflow schema/config contract
        run: npm run test:nightly-workflows

      - name: Deploy-wait ancestry check contract
        run: npm run test:deploy-wait-ancestry

      - name: Deploy-wait no-op check contract
        run: npm run test:deploy-wait-noop

      - name: Prisma JSON-cast contract
        run: npm run test:no-prisma-json-cast

      - name: Admin-flag cast contract
        run: npm run test:admin-flag-casts

      - name: UserRole expand migration contract
        run: npm run test:user-role-expand

      - name: UserRole predicate contract
        run: npm run test:user-role-predicates

      - name: CHILD maturity restriction contract
        run: npm run test:child-maturity

      - name: Narrative conversation kit contract
        run: npm run test:narrative-kit

      - name: Unquoted reserved-word table identifier contract
        run: npm run test:no-unquoted-reserved-word-tables

      - name: $fetch generic-pinning contract
        run: npm run test:fetch-generic-pinning

      - name: Existing-owner-id nullability contract
        run: npm run test:existing-owner-id-nullability

      - name: Ownership nullability regression contract
        run: npm run test:ownership-nullability

      - name: Ratchet-baseline helper self-test
        run: npm run test:ratchet-baseline-selftest

      - name: Capture-group guard checker self-test
        run: npm run test:capture-group-guards-selftest

      - name: Conductor API auth-guard checker self-test
        run: npm run test:conductor-api-auth-guards-selftest

      - name: Conductor API auth-guard contract
        run: npm run test:conductor-api-auth-guards

      - name: Conductor roadmap progress parity contract
        run: npm run test:conductor-progress-parity

      - name: AppMaker slug-candidate guard self-test
        run: npm run test:appmaker-slug-candidate-guard-selftest

      - name: AppMaker slug-candidate guard
        run: npm run test:appmaker-slug-candidate-guard

      - name: AppMaker fleet-description guard self-test
        run: npm run test:appmaker-fleet-description-guard-selftest

      - name: AppMaker fleet-description guard
        run: npm run test:appmaker-fleet-description-guard
