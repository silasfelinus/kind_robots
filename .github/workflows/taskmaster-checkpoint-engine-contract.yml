name: Taskmaster Checkpoint Engine Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/taskmaster-checkpoint-engine-contract.yml'
      - 'server/utils/storybookQuest.ts'
      - 'server/utils/storybookRuns.ts'
      - 'components/storybook/storybook-table.vue'
      - 'components/storybook/storybook-reading.vue'
      - 'utils/scripts/verifyTaskmasterCheckpointEngine.mjs'
  workflow_dispatch:

concurrency:
  group: taskmaster-checkpoint-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Taskmaster checkpoint contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Taskmaster checkpoint engine
        run: node utils/scripts/verifyTaskmasterCheckpointEngine.mjs
