name: Facet Catalog Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: facet-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  facet-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql://facet_contract:facet_contract@127.0.0.1:3306/facet_contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Validate schema and cutover contract
        run: npm run test:facet-catalog
