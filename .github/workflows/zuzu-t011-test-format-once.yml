name: One-shot Shifting Lands trial test formatter
on:
  push:
    branches: [worker/zuzu-shifting-lands-t011-authored-trials-20261011-b58c]
    paths: ['.github/workflows/zuzu-t011-test-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/zuzu-shifting-lands-t011-authored-trials-20261011-b58c
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Format test, remove one-shot, push
        run: |
          npx prettier --write utils/scripts/verifyShiftingTrials.test.ts
          git rm .github/workflows/zuzu-t011-test-format-once.yml
          git add utils/scripts/verifyShiftingTrials.test.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(shifting-lands): format trial provenance guards'
          git push origin HEAD:refs/heads/worker/zuzu-shifting-lands-t011-authored-trials-20261011-b58c
