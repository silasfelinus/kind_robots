name: Playbook Kit

# Audit every playbook built on the kit against its complexity budget, and
# prove the scaffold, settings and saved-progress contracts. DB-free.
on:
  pull_request:
    paths:
      - 'utils/playbookKit/**'
      - 'utils/playbookForge/**'
      - 'utils/consoleInput.ts'
      - 'assets/css/playbook-console.css'
      - 'stores/playbookKitStore.ts'
      - 'stores/playbookForgeStore.ts'
      - 'components/playbook-kit/**'
      - 'components/playbook-forge/**'
      - 'pages/admin/playbook-kit.vue'
      - 'pages/admin/playbook-forge.vue'
      - 'content/channels/admin/playbook-forge.md'
      - 'utils/scripts/verifyPlaybookForge.test.ts'
      - 'utils/scripts/verifyPlaybookArtPrompts.test.ts'
      - 'utils/playbook/**'
      - 'utils/gameOfCaptains/**'
      - 'utils/cometAcademy/**'
      - 'utils/crystalStreet/**'
      - 'utils/ecotone/**'
      - 'utils/cthulhuquariumBook.ts'
      - 'utils/cthulhuquariumCanon.generated.ts'
      - 'utils/rulerHooked/**'
      - 'utils/memoryDungeon/**'
      - 'content/channels/admin/playbook-kit.md'
      - 'utils/scripts/verifyPlaybookKit.test.ts'
      - 'utils/scripts/scaffoldPlaybook.ts'
      - '.github/workflows/playbook-kit.yml'
  push:
    branches: [main]
    paths:
      - 'utils/playbookKit/**'
      - 'utils/playbookForge/**'
      - 'stores/playbookKitStore.ts'
      - 'stores/playbookForgeStore.ts'
      - 'components/playbook-kit/**'
      - 'components/playbook-forge/**'
      - 'utils/playbook/**'
      - '.github/workflows/playbook-kit.yml'
  workflow_dispatch:

jobs:
  budget:
    name: Playbook budgets, kit and forge contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Audit every playbook against its complexity budget
        run: npm run test:playbook-kit
      - name: Forge factors, forecasts, handoff and live counts of existing playbooks
        run: npm run test:playbook-forge
      - name: Art prompts for every unpainted beat in games marked complete
        run: npm run test:playbook-art-prompts -- --report
