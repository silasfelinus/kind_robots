# Temporary, narrowly scoped branch-only generator for PR #4348.
# Remove this workflow after it has committed regenerated Prisma client files.
name: Plumber Maker Prisma Client Sync (Temporary)
on:
  push:
    branches:
      - worker/save-the-plumber-maker-20261027-1524
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'silasfelinus/kind_robots' && github.ref == 'refs/heads/worker/save-the-plumber-maker-20261027-1524'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client against an inert local datasource URL
        env:
          DATABASE_URL: mysql://unused:unused@127.0.0.1:3306/prisma_codegen
        run: npx prisma generate
      - name: Commit generated Prisma client to this branch only
        run: |
          git add prisma/generated/prisma
          if git diff --cached --quiet; then
            echo "Prisma client is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(plumber-maker): regenerate Prisma client for reaction schema"
          git push origin HEAD:refs/heads/worker/save-the-plumber-maker-20261027-1524
