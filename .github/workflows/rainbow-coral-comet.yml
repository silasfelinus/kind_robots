name: Rainbow X2 Coral Comet Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'utils/arcade/games/rainbowCoralComet.ts'
      - 'utils/arcade/games/rainbowGuardian.ts'
      - 'utils/arcade/games/rainbowPrincessPreview.ts'
      - 'utils/arcade/games/rainbowCheckpoints.ts'
      - 'utils/arcade/games/rainbowLoadouts.ts'
      - 'utils/scripts/verifyRainbowCoralComet.test.ts'
      - '.github/workflows/rainbow-coral-comet.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  x2-contract:
    name: X2 authored waves, rescued cadets and checkpoint proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Verify deterministic X2 flight model
        run: npx tsx utils/scripts/verifyRainbowCoralComet.test.ts
