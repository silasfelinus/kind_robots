name: Temporary Tzaddik Image Audit

on:
  push:
    branches:
      - fix/tzaddik-wikipedia-images-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect missing Wikipedia image fallbacks
        run: |
          set -euo pipefail
          for title in Azim_Khamisa Narayanan_Krishnan Shabana_Basij-Rasikh; do
            echo "=== $title pageimages/pageprops ==="
            curl -fsSG https://en.wikipedia.org/w/api.php \
              --data-urlencode action=query \
              --data-urlencode "prop=pageimages|pageprops" \
              --data-urlencode "piprop=original|thumbnail" \
              --data-urlencode pithumbsize=1600 \
              --data-urlencode "titles=$title" \
              --data-urlencode format=json \
              --data-urlencode formatversion=2 |
              jq -c '.query.pages[0] | {title, original, thumbnail, wikibase_item: .pageprops.wikibase_item}'

            qid="$(curl -fsSG https://en.wikipedia.org/w/api.php \
              --data-urlencode action=query \
              --data-urlencode prop=pageprops \
              --data-urlencode "titles=$title" \
              --data-urlencode format=json \
              --data-urlencode formatversion=2 |
              jq -r '.query.pages[0].pageprops.wikibase_item // empty')"

            if [ -n "$qid" ]; then
              echo "=== $title Wikidata P18 ($qid) ==="
              curl -fsS "https://www.wikidata.org/wiki/Special:EntityData/$qid.json" |
                jq -r --arg q "$qid" '.entities[$q].claims.P18[0].mainsnak.datavalue.value // "NO_P18"'
            fi
          done
