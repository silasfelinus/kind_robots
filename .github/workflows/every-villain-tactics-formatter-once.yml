name: Format tactics combat once
on:
  push:
    branches:
      - worker/every-villain-tactics-t-002-20261029-c9v4
    paths:
      - '.github/workflows/every-villain-tactics-formatter-once.yml'
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/every-villain-tactics-t-002-20261029-c9v4
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install formatter
        run: npm ci --ignore-scripts
      - name: Apply scoped Prettier
        run: npx prettier --write .github/workflows/every-villain-tactics.yml package.json pages/admin/every-villain-tactics.vue stores/everyVillainTacticsStore.ts utils/everyVillainTactics/combat.ts utils/everyVillainTactics/training.ts utils/scripts/verifyEveryVillainCombat.test.ts
      - name: Commit formatting without force
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/every-villain-tactics.yml package.json pages/admin/every-villain-tactics.vue stores/everyVillainTacticsStore.ts utils/everyVillainTactics/combat.ts utils/everyVillainTactics/training.ts utils/scripts/verifyEveryVillainCombat.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(tactics): apply canonical Prettier rules"
            git push origin HEAD:worker/every-villain-tactics-t-002-20261029-c9v4
          fi
