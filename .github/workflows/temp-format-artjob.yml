name: Temporary format ArtJob queue

on:
  push:
    branches:
      - worker/kind-robots-t133-default-filter-20261007T055600Z

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/kind-robots-t133-default-filter-20261007T055600Z
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Format changed files
        run: npx prettier --write components/art/artjob-queue-browser.vue utils/scripts/verifyArtJobQueueDefaultStatus.ts .github/workflows/entity-art-manager-contract.yml
      - name: Commit formatted output
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "kind-robots-format[bot]"
          git config user.email "kind-robots-format[bot]@users.noreply.github.com"
          git add components/art/artjob-queue-browser.vue utils/scripts/verifyArtJobQueueDefaultStatus.ts .github/workflows/entity-art-manager-contract.yml
          git commit -m "style: apply prettier [skip ci]"
          git push origin HEAD:worker/kind-robots-t133-default-filter-20261007T055600Z
