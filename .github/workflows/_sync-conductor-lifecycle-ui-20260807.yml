name: Sync Conductor lifecycle UI branch 2026-08-07

on:
  push:
    branches:
      - claude/conductor-lifecycle-ui-20260807
    paths:
      - .github/workflows/_sync-conductor-lifecycle-ui-20260807.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/conductor-lifecycle-ui-20260807
          fetch-depth: 0
      - name: Merge current main without force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge origin/main --no-edit
          git rm .github/workflows/_sync-conductor-lifecycle-ui-20260807.yml
          git commit -m 'chore: remove one-shot branch sync workflow'
          git push origin HEAD:claude/conductor-lifecycle-ui-20260807
