name: One-shot Conductor lifecycle UI patch 2026-08-07

on:
  push:
    branches:
      - claude/conductor-lifecycle-ui-20260807
    paths:
      - utils/scripts/_conductorLifecycleUiPatch20260807.py
      - .github/workflows/_conductor-lifecycle-ui-patch-20260807.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'claude/conductor-lifecycle-ui-20260807')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/conductor-lifecycle-ui-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply lifecycle UI patch
        run: python utils/scripts/_conductorLifecycleUiPatch20260807.py
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          npx nuxi prepare
          npx vue-tsc --noEmit
          npx eslint components/pages/conductor-page.vue stores/conductorStore.ts
          npx prettier --check components/pages/conductor-page.vue stores/conductorStore.ts
      - name: Remove one-shot patch
        run: git rm utils/scripts/_conductorLifecycleUiPatch20260807.py .github/workflows/_conductor-lifecycle-ui-patch-20260807.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: honor Conductor lifecycle in project workspace'
          git push origin HEAD:claude/conductor-lifecycle-ui-20260807
