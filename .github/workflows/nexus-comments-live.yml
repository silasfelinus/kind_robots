name: Nexus Comments Live

# The second comment pass: extra voices on the places people pass through.
#
# The population lane skipped any target that already had a first-party comment,
# which is exactly what makes it useless here -- every target in this pass has
# one. So idempotency is on the COMMENT TEXT: a comment is written only if no
# Reaction already exists on that target, by that speaker, with that exact body.
# Two speakers can share a target and one speaker can visit twice, but the same
# speaker saying the same sentence twice on the same card is always a re-run.
#
# Required repository Actions secrets:
#   DATABASE_URL
#   DATABASE_SSL_CA_BASE64 or DATABASE_SSL_CA
#   TS_OAUTH_CLIENT_ID
#   TS_OAUTH_SECRET

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to write the second-pass comments to production'
        required: true
        default: ''
      dry_run:
        description: 'Validate against live state and stop before the first write'
        type: boolean
        default: false

concurrency:
  group: nexus-comments-live
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_CA_BASE64: ${{ secrets.DATABASE_SSL_CA_BASE64 }}
      DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
    steps:
      - name: Require the typed confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "PUBLISH" ]; then
            echo "::error::confirm must be exactly PUBLISH. Got: '${{ inputs.confirm }}'"
            exit 1
          fi

      - name: Require production DB lane
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty. Add it as a REPOSITORY ACTIONS SECRET."
            exit 1
          fi
          if [ -z "$TS_OAUTH_CLIENT_ID" ] || [ -z "$TS_OAUTH_SECRET" ]; then
            echo "::error::Tailscale OAuth secrets are empty."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: '0'

      # Offline, before the tailnet opens. Measures freshness against BOTH
      # shipped corpora as well as this one -- a nexus target already has
      # somebody talking on it, so a speaker reusing their own earlier phrasing
      # would land the repeat on the very card where both are visible at once.
      - name: Verify nexus prose offline
        run: npm run test:nexus-comments

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Publish the second-pass comments
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx utils/scripts/publishNexusComments.ts --dry-run
          else
            npx tsx utils/scripts/publishNexusComments.ts
          fi
