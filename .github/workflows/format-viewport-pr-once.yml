name: One-shot viewport PR formatting
on:
  push:
    branches:
      - worker/interface-vision-t105-viewport-first-7c2e
    paths:
      - .github/workflows/format-viewport-pr-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/interface-vision-t105-viewport-first-7c2e
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write pages/admin/emperor-of-dust.vue utils/scripts/verifyEmperorMap.test.ts
      - name: Commit formatted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/admin/emperor-of-dust.vue utils/scripts/verifyEmperorMap.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: format viewport court and regression tests'
            git push origin HEAD:worker/interface-vision-t105-viewport-first-7c2e
          fi
