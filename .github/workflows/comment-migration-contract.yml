name: Comment Migration Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'utils/comments/**'
      - 'utils/scripts/**'
      - 'config/**'
      - 'artifacts/comment-census.json'
      - 'docs/architecture/**'
      - '.github/workflows/comment-migration-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'utils/comments/**'
      - 'utils/scripts/**'
      - 'config/**'
      - 'artifacts/comment-census.json'
      - 'docs/architecture/**'
      - '.github/workflows/comment-migration-contract.yml'

jobs:
  comment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsx utils/scripts/verifyCommentMigrationFoundation.ts
      - run: npx tsx utils/scripts/verifyCommentSignals.ts
      - run: npx tsx utils/scripts/verifyCommentCalibrationBatch.ts
      - run: npx tsx utils/scripts/runCommentCalibrationBatch002Contract.ts
      - run: npx tsx utils/scripts/verifyCommentCalibrationBatch003.ts
      - run: npx tsx utils/scripts/verifyPartialPublishPrefix.ts
