name: Finish Storybook t-010 rollback indentation
on:
  push:
    branches: [worker/storybook-t010-seed-notice-20260813-8af3]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/storybook-t010-seed-notice-20260813-8af3
      - name: Repair and verify
        run: |
          sed -i '/if (!openingWove)/,/return openingWove/ { s/^    \/\//      \/\//; s/^    session/      session/; s/^    persist/      persist/; s/^  }$/    }/; }' stores/storybookStore.ts
          rm .github/workflows/worker-storybook-t010-indent.yml
          git diff --check
          node utils/scripts/verifyStorybookStudio.mjs
          git config user.name "Conductor Worker"
          git config user.email "actions@users.noreply.github.com"
          git add stores/storybookStore.ts .github/workflows/worker-storybook-t010-indent.yml
          git commit -m "style: finish Storybook rollback indentation"
          git push origin HEAD:worker/storybook-t010-seed-notice-20260813-8af3
