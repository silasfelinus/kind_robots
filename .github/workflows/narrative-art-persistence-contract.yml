name: Narrative Art Persistence Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/narrative-art-persistence-contract.yml'
      - 'utils/narrativeArtProfiles.ts'
      - 'utils/narrativeArtJobs.ts'
      - 'stores/helpers/narrativeArtJobsHelper.ts'
      - 'stores/artStore.ts'
      - 'server/api/art/enqueue.post.ts'
      - 'server/api/art/queue/narrative.get.ts'
      - 'stores/storybookStore.ts'
      - 'utils/narrativeTurns.ts'
      - 'components/narrative/narrative-art-status.vue'
      - 'components/conductor/storybook-page.vue'
      - 'utils/scripts/verifyNarrativeArtPersistence.mjs'
  workflow_dispatch:

concurrency:
  group: narrative-art-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Narrative art persistence contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify narrative art persistence
        run: node utils/scripts/verifyNarrativeArtPersistence.mjs
