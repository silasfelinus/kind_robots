name: Memory Dungeon browser interruption

on:
  pull_request:
    paths:
      - 'stores/memoryWorldStore.ts'
      - 'components/pages/memory-dungeon-overworld.vue'
      - 'components/memory-dungeon/earth-chronicle.vue'
      - 'components/memory-dungeon/quest-log.vue'
      - 'utils/memoryDungeon/**'
      - 'utils/memoryDungeonWorld.ts'
      - 'utils/memoryDungeonWaves.ts'
      - 'utils/scripts/verifyMemoryWorldBrowser.browser.test.mjs'
      - 'utils/scripts/verifyMemoryChokingBrowser.browser.test.mjs'
      - 'utils/scripts/verifyMemoryWorldOnePlaytest.test.mjs'
      - 'utils/scripts/verifyMemoryDarkRealmPlaytest.test.mjs'
      - 'utils/scripts/memoryWorldPlaytestKit.mjs'
      - 'utils/scripts/verifyMemoryDungeonSiteAchievements.test.ts'
      - 'utils/achievements/catalog/main/memory-dungeon.ts'
      - '.github/workflows/memory-world-browser.yml'
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  browser-interruptions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Live achievements come from play, never a restore
        run: npx tsx utils/scripts/verifyMemoryDungeonSiteAchievements.test.ts

      # About three minutes: 20 seeded personas, ~37k store actions, ~2.4k reloads.
      - name: Adversarially play World One through the real store
        run: node utils/scripts/verifyMemoryWorldOnePlaytest.test.mjs

      # About a minute: 36 seeded runs through Dark Briar and the mirrored
      # House, ~19k store actions, ~1.7k reloads, every last save rescued.
      - name: Adversarially play Dark Briar and the mirrored House
        run: node utils/scripts/verifyMemoryDarkRealmPlaytest.test.mjs

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Test real Memory World store timers and browser reloads
        run: node utils/scripts/verifyMemoryWorldBrowser.browser.test.mjs

      - name: Test Choking Works save and restore in Chromium
        run: node utils/scripts/verifyMemoryChokingBrowser.browser.test.mjs

      - name: Preserve browser interruption results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-world-browser-interruptions
          path: test-results/memory-browser/
          if-no-files-found: ignore
          retention-days: 7
