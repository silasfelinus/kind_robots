name: Cthulhuquarium Feeding

on:
  pull_request:
    paths:
      - 'components/cthulhuquarium/cthulhuquarium-game.vue'
      - 'utils/cthulhuquariumFood.ts'
      - 'utils/cthulhuquariumFood.selftest.ts'
      - 'utils/cthulhuquariumConsole.ts'
      - 'utils/cthulhuquariumRarity.ts'
      - 'components/cthulhuquarium/cthulhuquarium-ui-art.vue'
      - 'utils/scripts/verifyCthulhuquariumConsoleNav.test.ts'
      - 'stores/cthulhuquariumTankStore.ts'
      - 'utils/cthulhuquariumAchievements.ts'
      - 'utils/achievements/catalog/main/cthulhuquarium.ts'
      - 'utils/scripts/verifyCthulhuquariumAchievements.test.ts'
      - '.github/workflows/cthulhuquarium-feeding.yml'

concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  food-interaction:
    runs-on: ubuntu-24.04
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Feeding animation logic
        run: npx tsx utils/cthulhuquariumFood.selftest.ts
      - name: Console deck navigation (feed mode, tabs, painted-art fallbacks)
        run: npx tsx utils/scripts/verifyCthulhuquariumConsoleNav.test.ts
      - name: Achievement awards (server-confirmed deeds only)
        run: npx tsx utils/scripts/verifyCthulhuquariumAchievements.test.ts
