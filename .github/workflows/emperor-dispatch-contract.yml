name: Emperor of Dust Dispatch Contract

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'utils/emperorOfDust/**'
      - 'utils/scripts/verifyEmperorDispatch.test.ts'
      - '.github/workflows/emperor-dispatch-contract.yml'
  push:
    branches: [main]
    paths:
      - 'utils/emperorOfDust/**'
      - 'utils/scripts/verifyEmperorDispatch.test.ts'
      - '.github/workflows/emperor-dispatch-contract.yml'

jobs:
  dispatch:
    name: Seeded dispatch and recovery contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx tsx utils/scripts/verifyEmperorDispatch.test.ts
      - name: Inspect exact Prettier output for two authored source files
        run: |
          npx prettier --write utils/emperorOfDust/engine.ts utils/scripts/verifyEmperorDispatch.test.ts
          printf 'EMPEROR_ENGINE_BEGIN\\n'
          base64 -w0 utils/emperorOfDust/engine.ts
          printf '\\nEMPEROR_ENGINE_END\\n'
          printf 'EMPEROR_TEST_BEGIN\\n'
          base64 -w0 utils/scripts/verifyEmperorDispatch.test.ts
          printf '\\nEMPEROR_TEST_END\\n'
