name: Ecotone Gameplay Contract
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths:
      - 'utils/ecotone/**'
      - 'stores/ecotoneStore.ts'
      - 'components/ecotone-board.vue'
      - 'components/ecotone-scene.vue'
      - 'components/ecotone-emblem.vue'
      - 'components/ecotone-mystery-card.vue'
      - 'components/ecotone-choice-hand.vue'
      - 'components/narrative/kr-choice-hand.vue'
      - 'utils/scripts/verifyKrChoiceHand.test.ts'
      - 'pages/play/ecotone.vue'
      - 'content/channels/arcade/ecotone.md'
      - 'public/ecotone/**'
      - 'utils/scripts/verifyEcotone*.test.ts'
      - 'utils/scripts/ecotoneBrowserFixtures.ts'
      - 'utils/scripts/auditEcotoneViewports.browser.mjs'
      - 'utils/achievements/catalog/main/weird-humboldt.ts'
      - 'utils/scripts/validateEcotoneMystery.ts'
      - 'utils/playbook/**'
      - 'stores/playbookStore.ts'
      - 'server/utils/playbook.ts'
      - 'server/api/admin/playbook/**'
      - 'server/api/playbook/**'
      - 'components/playbook/playbook-node.vue'
      - 'components/playbook/playbook-art.vue'
      - 'utils/shiftingLands/**'
      - 'utils/shiftingDesks/**'
      - 'utils/zuzuGamebook/**'
      - 'utils/emperorOfDust/**'
      - 'components/playbook/playbook-detail.vue'
      - 'pages/admin/playbook-manager.vue'
      - 'content/channels/admin/playbook-manager.md'
      - 'prisma/playbook.prisma'
      - 'utils/scripts/verifyPlaybook.test.ts'
      - '.github/workflows/ecotone-gameplay.yml'
concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx tsx utils/scripts/verifyKrChoiceHand.test.ts
      # Every Ecotone contract, not a hand-picked subset: 19 of the 27 suites
      # used to run only when someone remembered to (weird-humboldt/t-021).
      - name: All Ecotone suites
        run: |
          set -e
          for suite in utils/scripts/verifyEcotone*.test.ts; do
            echo "::group::$suite"
            npx tsx "$suite"
            echo "::endgroup::"
          done
      # The mounted viewport audit's saves must stay engine-reachable (t-016).
      - run: npx tsx utils/scripts/ecotoneBrowserFixtures.ts > /dev/null
      - run: npm run test:playbook
