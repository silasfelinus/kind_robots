name: One-shot Every Villain formatting

on:
  push:
    branches:
      - worker/every-villain-tactics-t-001-20261028-k7p2
    paths:
      - '.github/workflows/every-villain-tactics-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/every-villain-tactics-t-001-20261028-k7p2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install formatter
        run: npm ci --ignore-scripts
      - name: Apply canonical formatting to the scoped files only
        run: |
          npx prettier --write \
            .github/workflows/every-villain-tactics.yml \
            content/channels/admin/every-villain-tactics.md \
            package.json \
            pages/admin/every-villain-tactics.vue \
            stores/everyVillainTacticsStore.ts \
            utils/everyVillainTactics/training.ts \
            utils/playbookKit/games/everyVillainTactics.ts \
            utils/playbookKit/games/index.ts \
            utils/projectPlacements.ts \
            utils/scripts/verifyEveryVillainTactics.test.ts
      - name: Commit formatting on the owned feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/every-villain-tactics.yml content/channels/admin/every-villain-tactics.md package.json pages/admin/every-villain-tactics.vue stores/everyVillainTacticsStore.ts utils/everyVillainTactics/training.ts utils/playbookKit/games/everyVillainTactics.ts utils/playbookKit/games/index.ts utils/projectPlacements.ts utils/scripts/verifyEveryVillainTactics.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(tactics): apply repository Prettier rules"
            git push origin HEAD:worker/every-villain-tactics-t-001-20261028-k7p2
          fi
