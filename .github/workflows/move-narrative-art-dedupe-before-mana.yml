name: Move Narrative Art Dedupe Before Mana

on:
  push:
    branches:
      - codex/narrative-scene-art-persistence
    paths:
      - .github/workflows/move-narrative-art-dedupe-before-mana.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/narrative-scene-art-persistence
          fetch-depth: 0
      - name: Apply pre-gate idempotency migration
        run: python utils/scripts/moveNarrativeArtDedupeBeforeMana.py
      - name: Remove one-time migration machinery
        run: |
          rm utils/scripts/moveNarrativeArtDedupeBeforeMana.py
          rm .github/workflows/move-narrative-art-dedupe-before-mana.yml
      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/api/art/enqueue.post.ts utils/scripts/moveNarrativeArtDedupeBeforeMana.py .github/workflows/move-narrative-art-dedupe-before-mana.yml
          git commit -m "fix: reuse narrative art jobs before mana gating"
          git push origin HEAD:codex/narrative-scene-art-persistence
