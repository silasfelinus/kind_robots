name: Format Shifting Lands Once
on:
  push:
    branches:
      - 'worker/zuzu-shifting-lands-homestead-*'
    paths:
      - '.github/workflows/shifting-lands-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx prettier --write utils/shiftingLands/homestead.ts stores/shiftingLandsStore.ts pages/play/zuzu-shifting-lands.vue utils/scripts/verifyShiftingLands.test.ts utils/zuzuWorld.ts
      - run: |
          git config user.name "kindrobots-format-bot"
          git config user.email "kindrobots-format-bot@users.noreply.github.com"
          git add utils/shiftingLands/homestead.ts stores/shiftingLandsStore.ts pages/play/zuzu-shifting-lands.vue utils/scripts/verifyShiftingLands.test.ts utils/zuzuWorld.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(shifting-lands): format playable Homestead sources"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
