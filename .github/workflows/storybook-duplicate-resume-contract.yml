name: Storybook Duplicate Resume Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: storybook-duplicate-resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Storybook duplicate resume contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Storybook duplicate resume guard
        run: node utils/scripts/verifyStorybookDuplicateResumeGuard.mjs
