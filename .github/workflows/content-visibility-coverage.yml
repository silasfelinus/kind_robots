# Every read endpoint serving a model with isPublic/isMature applies the
# visibility rule -- or is listed in the sweep's allowlist with a reason about
# the data.
#
# Silas, 2026-09-17: "this should be an api barrier, not a front end barrier",
# and "it should cover all relevant objects. this is a global situation."
#
# A one-time grep answered that once. The failure mode is a NEW endpoint added
# later without the guard, which is exactly how the ones found on 2026-09-17
# came to exist -- so this runs on every touch of server/api, not only when the
# verifier itself changes.
name: Content Visibility Coverage

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/api/**'
      - 'server/utils/contentAccess.ts'
      - 'server/utils/artImageAccess.ts'
      - 'server/utils/forumApi.ts'
      - 'utils/scripts/verifyContentVisibility.test.ts'
      - 'utils/scripts/verifyContentVisibilityCoverage.ts'
      - '.github/workflows/content-visibility-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      # The rule itself: the Prisma fragment's shape, and that a CHILD who is
      # also an ADMIN stays maturity-restricted. Database-free by design.
      - name: Verify the visibility rule
        run: npx tsx utils/scripts/verifyContentVisibility.test.ts

      # The coverage sweep: reads each prisma.<model>.find*() call's own where.
      - name: Verify every read endpoint applies it
        run: npx tsx utils/scripts/verifyContentVisibilityCoverage.ts
