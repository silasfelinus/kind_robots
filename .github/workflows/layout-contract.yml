name: Layout Contract

# Guards the Kind Robots layout contract (conductor project interface-vision).
# The baseline in utils/scripts/layout-contract-baseline.json is a RATCHET: this
# job fails when a PR introduces a violation that is not already in it, and the
# --update flag refuses to record a larger count. See
# utils/scripts/verifyLayoutContract.ts for the rules and the reasoning.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: layout-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Verify layout contract
        run: npm run test:layout-contract

      - name: Verify kr-* class coverage
        run: npm run test:kr-class-coverage

      - name: Verify mixed pane primitive fixture
        run: npx tsx utils/scripts/verifyMixedPanePrimitivesFixture.ts

      - name: Layout header contract self-test
        run: npm run test:layout-header-contract-selftest

      - name: Syntax-check changed shell scripts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mapfile -d '' shell_files < <(git diff --name-only --diff-filter=ACMR -z "${{ github.event.pull_request.base.sha }}...HEAD" -- '*.sh')
          for file in "${shell_files[@]}"; do
            echo "bash -n $file"
            bash -n "$file"
          done
          # Non-blocking shellcheck pass over the same changed-file set (reuses the
          # mapfile discovery above rather than re-running git diff): flags real shell
          # bugs (unquoted expansions, unsafe globbing, etc.) that `bash -n` can't catch.
          # Warning-only while its false-positive rate on real PR traffic is unknown;
          # `|| true` keeps it from failing the job even though the step itself still
          # runs under `bash -e` for the syntax-check loop above.
          if [ "${#shell_files[@]}" -gt 0 ]; then
            echo "shellcheck ${shell_files[*]}"
            shellcheck "${shell_files[@]}" || true
          fi

      - name: Blocking shellcheck (high-confidence rules)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # interface-vision/t-133: promotes specific shellcheck rule classes from
          # the warning-only pass above to hard-failing, now that real PR traffic
          # plus a full audit of this repo's *.sh corpus has shown their
          # false-positive rate. Re-discovers the changed *.sh set rather than
          # sharing the previous step's mapfile array, since each `run:` block gets
          # its own shell.
          #
          # Promoted so far (2026-09-14): SC2086 (unquoted variable expansion) --
          # every SC2086 hit found (the full 12-script repo corpus, plus available
          # CI history) was a genuine bug (unquoted $var in echo/curl on JSON/URL
          # values), zero false positives; fixed the 4 pre-existing hits in
          # utils/scripts/image_gen.sh so this starts from a clean baseline.
          # NOT promoted: SC2207/SC2010/SC2209/SC1003 each had only a single
          # occurrence in the same audit, and SC2209 was a confirmed false positive
          # (sync-comfy-models.sh:184's `COPY_TOOL=rsync` flagged as a likely-intended
          # command substitution when it's just a tool-name string) -- they stay
          # warning-only until more traffic clears them.
          mapfile -d '' shell_files < <(git diff --name-only --diff-filter=ACMR -z "${{ github.event.pull_request.base.sha }}...HEAD" -- '*.sh')
          if [ "${#shell_files[@]}" -gt 0 ]; then
            echo "shellcheck --include=SC2086 ${shell_files[*]}"
            shellcheck --include=SC2086 "${shell_files[@]}"
          fi

      - name: Audit test-prefixed commits for executable assertions
        if: github.event_name == 'pull_request'
        run: bash scripts/check-test-commit-assertions.sh "${{ github.event.pull_request.base.sha }}"
