name: Save Plumber Maker Gameplay Contract
on:
  pull_request:
    paths:
      - 'utils/arcade/games/savePlumberMaker.ts'
      - 'utils/arcade/games/savePlumberLevels.ts'
      - 'utils/arcade/games/savePlumberPreview.ts'
      - 'utils/arcade/games/savePlumberWorlds.ts'
      - 'components/arcade/plumber-level-maker.vue'
      - 'components/arcade/plumber-maker-sidebar.vue'
      - 'stores/savePlumberMakerStore.ts'
      - 'utils/scripts/verifySavePlumberMaker.test.ts'
      - '.github/workflows/save-plumber-maker-contract.yml'
permissions:
  contents: read
env:
  CYPRESS_INSTALL_BINARY: '0'

concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  maker-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify playable Maker geometry, templates, controls and campaign isolation
        run: npx tsx utils/scripts/verifySavePlumberMaker.test.ts
