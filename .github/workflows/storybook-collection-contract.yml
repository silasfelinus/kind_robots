name: Storybook Collection Contract

on:
  pull_request:
    paths:
      - 'components/storybook/storybook-collection.vue'
      - 'utils/scripts/verifyStorybookCollection.mjs'
      - '.github/workflows/storybook-collection-contract.yml'
permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  collection-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Storybook Collection contract
        run: node utils/scripts/verifyStorybookCollection.mjs
