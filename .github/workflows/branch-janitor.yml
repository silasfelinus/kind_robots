name: Branch janitor

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - scripts/branch_janitor.py
      - scripts/tests/test_branch_janitor.py
      - ops/branch-retirements.json
      - .github/workflows/branch-janitor.yml
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only; delete nothing'
        type: boolean
        default: false
      force_delete_branches:
        description: 'Comma-separated branch names to delete regardless of merge state'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-janitor
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify retirement safety
        run: python -m unittest discover -s scripts/tests -p 'test_branch_janitor.py'

      - name: Delete merged branches and report stranded work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/branch_janitor.py \
            ${{ (github.event.inputs.dry_run == 'true') && '--dry-run' || '' }} \
            --force-delete "${{ github.event.inputs.force_delete_branches }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
