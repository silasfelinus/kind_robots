name: Apply Narrative Art Queue Contract

on:
  push:
    branches:
      - codex/narrative-scene-art-persistence
    paths:
      - .github/workflows/apply-narrative-art-queue-contract.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/narrative-scene-art-persistence
          fetch-depth: 0
      - name: Apply queue contract migration
        run: python utils/scripts/applyNarrativeArtQueueContract.py
      - name: Remove one-time migration machinery
        run: |
          rm utils/scripts/applyNarrativeArtQueueContract.py
          rm .github/workflows/apply-narrative-art-queue-contract.yml
      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stores/artStore.ts server/api/art/enqueue.post.ts utils/scripts/applyNarrativeArtQueueContract.py .github/workflows/apply-narrative-art-queue-contract.yml
          git commit -m "feat: support deduplicated Krea narrative art jobs"
          git push origin HEAD:codex/narrative-scene-art-persistence
