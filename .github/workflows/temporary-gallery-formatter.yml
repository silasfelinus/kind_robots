name: Temporary Gallery Formatter

on:
  push:
    branches:
      - worker/gallery-maturity-filter-20260923t1512

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/gallery-maturity-filter-20260923t1512
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Format touched files
        run: >-
          npx prettier --write
          server/api/art/collection/index.get.ts
          server/api/art/collection/unsorted.get.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/api/art/collection/index.get.ts server/api/art/collection/unsorted.get.ts
          git commit -m "style: format gallery maturity endpoints"
          git push origin HEAD:worker/gallery-maturity-filter-20260923t1512
