name: Superkate Prisma client generation (temporary branch repair)

on:
  push:
    branches:
      - worker/kr-arcade-t-009-superkate-spectrum-s7q4

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/kr-arcade-t-009-superkate-spectrum-s7q4
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies without app lifecycle scripts
        run: npm ci --ignore-scripts
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Prepare Nuxt project tsconfig for the Prisma generator
        run: npx nuxi prepare
        env:
          DATABASE_URL: mysql://user:pass@127.0.0.1:3306/kindrobots
      - name: Regenerate checked-in Prisma client for additive Arcade model
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://user:pass@127.0.0.1:3306/kindrobots
      - name: Commit generated client without force pushing
        run: |
          git add prisma/generated/
          if git diff --cached --quiet; then
            echo "Prisma client already matches schema."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate Prisma client for Arcade cloud saves"
          git push origin HEAD:worker/kr-arcade-t-009-superkate-spectrum-s7q4
