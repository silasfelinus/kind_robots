name: Storybook Picker Restored Selection Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: storybook-picker-restored-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Storybook picker restored selection contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Storybook picker restored selection guard
        run: node utils/scripts/verifyStorybookPickerRestoredSelectionGuard.mjs
