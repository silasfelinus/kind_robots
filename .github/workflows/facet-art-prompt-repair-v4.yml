name: Facet Art Prompt Repair v4

# One-shot production repair for the v2/v3 Facet Krea producer. The workflow is
# intentionally triggered only by this file landing on main; after a successful
# repair run the worker deletes this workflow in a cleanup PR. The repair keeps
# old ArtImages as provenance and enqueues semantic v4 replacements only for
# legacy jobs that still own their Facet slot.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/facet-art-prompt-repair-v4.yml'

concurrency:
  group: facet-art-prompt-repair-v4
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_CA_BASE64: ${{ secrets.DATABASE_SSL_CA_BASE64 }}
      DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
    steps:
      - name: Require production queue secrets
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty."
            exit 1
          fi
          if [ -z "$TS_OAUTH_CLIENT_ID" ] || [ -z "$TS_OAUTH_SECRET" ]; then
            echo "::error::TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET are empty."
            exit 1
          fi
          if [ -z "$DATABASE_SSL_CA_BASE64" ] && [ -z "$DATABASE_SSL_CA" ]; then
            echo "::warning::No database CA secret is set; ProxySQL normally requires TLS."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Resubmit tainted Facet artwork with semantic Krea prompts
        run: >-
          npx tsx scripts/run_facet_catalog_maintenance.ts
          --art-only
          --repair-tainted
          --reason=one-shot-krea-context-prompt-repair-v4
