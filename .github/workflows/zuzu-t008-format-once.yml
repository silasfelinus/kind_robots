name: One-shot Shifting Lands formatter
on:
  push:
    branches:
      - worker/zuzu-shifting-lands-t008-progression-20261011-c52b91
    paths:
      - .github/workflows/zuzu-t008-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/zuzu-shifting-lands-t008-progression-20261011-c52b91
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Format new source and remove this one-shot workflow
        run: |
          npx prettier --write utils/shiftingLands/progression.ts utils/scripts/verifyShiftingProgression.test.ts
          git rm .github/workflows/zuzu-t008-format-once.yml
          git add utils/shiftingLands/progression.ts utils/scripts/verifyShiftingProgression.test.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(shifting-lands): format progression contract'
          git push origin HEAD:refs/heads/worker/zuzu-shifting-lands-t008-progression-20261011-c52b91
