name: Finish Storybook t-010 rollback indentation

on:
  push:
    branches:
      - worker/storybook-t010-seed-notice-20260813-8af3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/storybook-t010-seed-notice-20260813-8af3
          fetch-depth: 0
      - name: Fix rollback indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('stores/storybookStore.ts')
          text = path.read_text()
          start = text.index('  async function beginStory(input: StorybookStartInput): Promise<boolean> {')
          end = text.index('\n  async function answerCurrentBeat', start)
          block = text[start:end]
          old = '''    if (!openingWove) {
            // Keep the setup draft and generation error visible so the reader can
            // retry instead of being stranded inside an empty active session.
            session.value = null
            persist()
          }'''
          # The previous bounded pass normalized the outer lines only; match the
          # actual current block explicitly and refuse unrelated edits.
          current = '''    if (!openingWove) {
            // Keep the setup draft and generation error visible so the reader can
            // retry instead of being stranded inside an empty active session.
            session.value = null
            persist()
          }'''
          if current not in block:
              current = '''    if (!openingWove) {
    // Keep the setup draft and generation error visible so the reader can
    // retry instead of being stranded inside an empty active session.
    session.value = null
    persist()
  }'''
          if current not in block:
              raise SystemExit('expected rollback block not found; refusing to edit')
          fixed = '''    if (!openingWove) {
      // Keep the setup draft and generation error visible so the reader can
      // retry instead of being stranded inside an empty active session.
      session.value = null
      persist()
    }'''
          block = block.replace(current, fixed, 1)
          path.write_text(text[:start] + block + text[end:])
          PY
          rm .github/workflows/worker-storybook-t010-indent.yml
          git diff --check
          node utils/scripts/verifyStorybookStudio.mjs
      - name: Commit indentation repair
        shell: bash
        run: |
          git config user.name "Conductor Worker"
          git config user.email "actions@users.noreply.github.com"
          git add stores/storybookStore.ts .github/workflows/worker-storybook-t010-indent.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m "style: finish Storybook rollback indentation"
          git push origin HEAD:worker/storybook-t010-seed-notice-20260813-8af3
