name: Rainbow X1 Nursery Flight Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'utils/arcade/games/rainbowLanternNursery.ts'
      - 'utils/arcade/games/rainbowPrincessPreview.ts'
      - 'utils/arcade/games/rainbowCheckpoints.ts'
      - 'utils/arcade/games/rainbowLoadouts.ts'
      - 'utils/scripts/verifyRainbowNurseryFlight.test.ts'
      - '.github/workflows/rainbow-nursery-flight.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nursery-flight:
    name: X1 route eligibility, authored waves and checkpoint safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Verify X1 deterministic flight model
        run: npx tsx utils/scripts/verifyRainbowNurseryFlight.test.ts
