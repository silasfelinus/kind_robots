name: Publish Production Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - prisma/**
      - .github/workflows/publish-container.yml
  workflow_dispatch:

concurrency:
  group: production-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    name: Build production image
    runs-on: ubuntu-latest
    # Not a required status check for merge -- this only validates the image still
    # builds (and, on push to main, publishes it). Typical duration is ~9 minutes;
    # 30 minutes let a genuine hang run silently in the background well past when
    # merge already fired on the required checks (kaizen from model-builder/t-029,
    # kind_robots PR #1882, 2026-08-14: every required check on #1882 was green by
    # 06:04:19Z but this job was still running past its typical duration when the
    # merge fired at 06:04:54Z). Tightened so a hang surfaces as a clear CI failure
    # instead of dangling -- still generous headroom over the ~9-minute norm.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Kind Robots
            org.opencontainers.image.description=Kind Robots production Nuxt/Nitro image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image so /api/version reports a real commit and
          # runtimeConfig.public.buildId stops saying 'development'. Both use
          # the explicit COMMIT_SHA build argument.
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
