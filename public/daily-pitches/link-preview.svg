    <text x="732" y="292" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="28" fill="#2a2140">A lighthouse run by</text>
    <text x="732" y="337" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="28" fill="#2a2140">a nervous robot who</text>
    <text x="732" y="382" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="28" fill="#2a2140">collects lost songs...</text>
