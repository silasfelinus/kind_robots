name: Shifting Lands Gameplay Contract
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths:
      - 'utils/shiftingLands/**'
      - 'stores/shiftingLandsStore.ts'
      - 'stores/shiftingLandsJourneyStore.ts'
      - 'components/shifting-lands-journey-board.vue'
      - 'components/shifting-lands-character-rail.vue'
      - 'components/shifting-lands-character-creator.vue'
      - 'components/shifting-lands-title.vue'
      - 'components/shifting-lands-scrapbook.vue'
      - 'components/navigation/flip-card.vue'
      - 'public/shifting-lands/**'
      - 'pages/admin/zuzu-shifting-lands.vue'
      - 'content/channels/arcade/zuzu-shifting-lands.md'
      - 'pages/play/zuzu-shifting-lands.vue'
      - 'utils/scripts/verifyShiftingLands.test.ts'
      - 'utils/scripts/verifyShiftingJourney.test.ts'
      - 'utils/scripts/verifyShiftingBoard.test.ts'
      - 'utils/scripts/verifyShiftingAuthored.test.ts'
      - 'utils/scripts/verifyShiftingProgression.test.ts'
      - 'utils/scripts/verifyShiftingSaveLedger.test.ts'
      - 'utils/scripts/verifyShiftingV4.test.ts'
      - 'utils/scripts/verifyShiftingTrials.test.ts'
      - 'utils/scripts/verifyShiftingCharacterRail.test.ts'
      - 'utils/scripts/verifyShiftingSceneArt.test.ts'
      - 'utils/scripts/verifyShiftingV6.test.ts'
      - 'utils/scripts/verifyShiftingV7Endings.test.ts'
      - 'utils/scripts/verifyShiftingV8.test.ts'
      - 'utils/scripts/verifyShiftingFollowerEchoesV8.test.ts'
      - 'utils/scripts/verifyShiftingFollowerRecruitmentV9.test.ts'
      - 'utils/scripts/verifyShiftingSpentDeeds.test.ts'
      - 'utils/scripts/verifyShiftingCharacterCreator.test.ts'
      - 'utils/scripts/verifyShiftingJourneyDeeds.test.ts'
      - 'utils/scripts/verifyShiftingPersonalTravelers.test.ts'
      - 'utils/scripts/verifyShiftingEndingsGraph.test.ts'
      - 'utils/scripts/verifyShiftingScrapbook.test.ts'
      - 'utils/achievements/catalog/main/zuzu-shifting-lands.ts'
      - 'utils/playbook/shiftingLands.ts'
      - 'components/shifting-lands-scene-image.vue'
      - 'utils/scripts/importShiftingLandsWorld.mjs'
      - '.github/workflows/shifting-lands-gameplay.yml'
concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx tsx utils/scripts/verifyShiftingLands.test.ts
      - run: npx tsx utils/scripts/verifyShiftingJourney.test.ts
      - run: npx tsx utils/scripts/verifyShiftingBoard.test.ts
      - run: npx tsx utils/scripts/verifyShiftingAuthored.test.ts
      - run: npx tsx utils/scripts/verifyShiftingProgression.test.ts
      - run: npx tsx utils/scripts/verifyShiftingSaveLedger.test.ts
      - run: npx tsx utils/scripts/verifyShiftingV4.test.ts
      - run: npx tsx utils/scripts/verifyShiftingTrials.test.ts
      - run: npx tsx utils/scripts/verifyShiftingCharacterRail.test.ts
      - run: npx tsx utils/scripts/verifyShiftingSceneArt.test.ts
      - run: npx tsx utils/scripts/verifyShiftingV6.test.ts
      - run: npx tsx utils/scripts/verifyShiftingSpentDeeds.test.ts
      - run: npx tsx utils/scripts/verifyShiftingCharacterCreator.test.ts
      - run: npx tsx utils/scripts/verifyShiftingJourneyDeeds.test.ts
      - run: npx tsx utils/scripts/verifyShiftingPersonalTravelers.test.ts
      - run: npx tsx utils/scripts/verifyShiftingEndingsGraph.test.ts
      - run: npx tsx utils/scripts/verifyShiftingScrapbook.test.ts
      - run: npx tsx utils/scripts/shiftingLandsV6BalanceReport.ts 300
      - run: npx tsx utils/scripts/verifyShiftingV7.test.ts 300
      - run: npx tsx utils/scripts/verifyShiftingV8.test.ts 300
      - run: npx tsx utils/scripts/verifyShiftingFollowerEchoesV8.test.ts
      - run: npx tsx utils/scripts/verifyShiftingFollowerRecruitmentV9.test.ts
      - run: npx tsx utils/scripts/verifyShiftingV7Endings.test.ts
      - run: npx tsx utils/scripts/verifyShiftingWorldEchoesV7.test.ts
      - run: npx tsx utils/scripts/verifyShiftingMoralChainsV7.test.ts
