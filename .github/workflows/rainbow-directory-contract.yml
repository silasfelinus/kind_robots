name: Rainbow Community Directory Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/api/rainbow/directory/**'
      - 'server/utils/rainbowDirectory.ts'
      - 'prisma/migrations/**'
      - 'tests/contracts/verifyRainbowDirectory.ts'
      - '.github/workflows/rainbow-directory-contract.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --include=optional
      - run: npx tsx tests/contracts/verifyRainbowDirectory.ts
