name: Resource Preview Checkpoint

on:
  pull_request:
    paths:
      - 'server/api/resources/**/generate-preview.post.ts'
      - 'utils/loraProbe.ts'
      - 'utils/scripts/verifyResourcePreviewCheckpoint.test.ts'
      - 'utils/scripts/verifyLoraProbePlan.test.ts'
      - '.github/workflows/resource-preview-checkpoint.yml'
concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx tsx utils/scripts/verifyResourcePreviewCheckpoint.test.ts
      - run: npx tsx utils/scripts/verifyLoraProbePlan.test.ts
