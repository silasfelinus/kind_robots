name: One-time Shifting Lands audit formatter
on:
  pull_request:
    types: [ready_for_review]
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: worker/zuzu-shifting-lands-t004-resource-audit-20261009
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: |
          npx prettier --write \
            pages/admin/worlds/zuzu.vue \
            server/api/worlds/zuzu/resource-audit.get.ts \
            stores/zuzuWorldStore.ts \
            utils/scripts/verifyZuzuResourceAudit.test.ts \
            utils/zuzuResourceAudit.ts
      - name: Commit formatting on same PR branch
        env:
          BRANCH: worker/zuzu-shifting-lands-t004-resource-audit-20261009
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/admin/worlds/zuzu.vue server/api/worlds/zuzu/resource-audit.get.ts stores/zuzuWorldStore.ts utils/scripts/verifyZuzuResourceAudit.test.ts utils/zuzuResourceAudit.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format scoped Zuzu resource audit files"
            git push origin "HEAD:$BRANCH"
          fi
