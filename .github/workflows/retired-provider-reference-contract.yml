name: Retired Provider Reference Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: retired-provider-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: No retired provider references
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify automation references
        run: node utils/scripts/verifyRetiredProviderRefs.mjs
