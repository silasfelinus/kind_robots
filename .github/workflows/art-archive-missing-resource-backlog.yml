name: Art Archive Missing Resource Backlog

on:
  pull_request:
    paths:
      - 'server/utils/artArchiveMissingResourceBacklog.ts'
      - 'utils/scripts/verifyArtArchiveMissingResourceBacklog.test.ts'
      - '.github/workflows/art-archive-missing-resource-backlog.yml'
concurrency:
  # Cancel superseded runs on the same PR; push/dispatch runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npx tsx utils/scripts/verifyArtArchiveMissingResourceBacklog.test.ts
