name: Component Runtime Retirement Contract

on:
  pull_request:
    paths:
      - 'components/animation/animation-manager.vue'
      - 'components/wonderlab/**'
      - 'content/play/memory.md'
      - 'content/play/screenfx.md'
      - 'content/build/animation-manager.md'
      - 'server/api/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'config/wonderlab-voice-polish-batch-*.json'
      - 'stores/animationManagerStore.ts'
      - 'stores/index.ts'
      - 'utils/scripts/verifyComponentRuntimeRetirement.ts'
      - 'utils/scripts/verifyComponentSchemaRetirement.ts'
      - '.github/workflows/component-runtime-retirement-contract.yml'
  push:
    branches: [main]
    paths:
      - 'components/animation/animation-manager.vue'
      - 'components/wonderlab/**'
      - 'content/play/memory.md'
      - 'content/play/screenfx.md'
      - 'content/build/animation-manager.md'
      - 'server/api/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'config/wonderlab-voice-polish-batch-*.json'
      - 'stores/animationManagerStore.ts'
      - 'stores/index.ts'
      - 'utils/scripts/verifyComponentRuntimeRetirement.ts'
      - 'utils/scripts/verifyComponentSchemaRetirement.ts'
      - '.github/workflows/component-runtime-retirement-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Verify live app no longer depends on Component runtime
        run: npx tsx utils/scripts/verifyComponentRuntimeRetirement.ts
      - name: Verify Component database schema is permanently retired
        run: npx tsx utils/scripts/verifyComponentSchemaRetirement.ts
