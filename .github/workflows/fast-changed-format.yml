name: Fast Changed-File Formatting

# Checks Prettier on the files a PR changes, after applying the mechanical
# ESLint fixes that used to trip the lint ratchet (attribute order, import
# placement/duplicates, prefer-const, unused imports; utils/scripts/
# lintFixChanged.mjs). On a same-repository PR whose files need either, the
# `autofix` job commits the exact patch back to the branch
# and re-runs the PR's checks on the new head (approving the runs GitHub holds
# for a bot push, or dispatching them), so connector-only agents
# no longer hand-apply diffs over several rounds. The patch is computed in the
# read-only job; the write job never runs PR code (it only `git apply`s).
on:
  pull_request:
    branches: [main]
  # Re-run on an autofix commit: pushes made with GITHUB_TOKEN do not trigger
  # pull_request events, but workflow_dispatch is allowed to.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same PR; dispatch runs never cancel.
  group: changed-format-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prettier-changed:
    name: Changed-file Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      has_patch: ${{ steps.patch.outputs.has_patch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install formatter without project lifecycle scripts
        run: npm ci --ignore-scripts
        env:
          CYPRESS_INSTALL_BINARY: '0'

      # Temporary, branch-scoped repair for t-041. The normal formatter bot
      # can commit the exact Prisma-generated diff without manual file edits.
      # This step is removed after the bot commit and before merge.
      - name: Space Couch t-041 regenerate checked-in Prisma client
        if: github.event_name == 'pull_request' && github.head_ref == 'worker/game-of-captains-t-041-account-backup-20261120-f9n4'
        env:
          DATABASE_URL: mysql://kindrobots:build-only@127.0.0.1:3306/kindrobots
        run: |
          npx prisma generate
          # Intent-to-add makes the new model visible to git diff --binary.
          git add -N prisma/generated/prisma/models/SpaceCouchVoyageSave.ts

      - name: Verify changed-file selector
        run: npm run test:format-changed

      # Job and check names stay "Changed-file Prettier" so required-check
      # settings keep matching; ESLint problems are fixed here, not gated.
      - name: Generate Nuxt ESLint config
        continue-on-error: true
        run: npx nuxi prepare

      - name: Apply safe ESLint fixes to changed files
        id: lintfix
        continue-on-error: true
        run: npm run lint:fix-changed

      - name: Check PR formatting and print exact fixes if needed
        id: check
        run: npm run format:check-changed -- --show-fix

      - name: Capture autofix patch
        id: patch
        if: always() && steps.check.outcome != 'skipped'
        run: |
          npm run format:changed
          # GITHUB_TOKEN cannot push workflow files; leave those to the printed patch.
          git diff --binary -- . ':(exclude).github/workflows' > "$RUNNER_TEMP/prettier-autofix.patch"
          if [ -s "$RUNNER_TEMP/prettier-autofix.patch" ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Same-repository PRs get this patch committed automatically by the 'Push Prettier autofix' job. Do not hand-apply it; re-read the files after the 'style: autoformat' commit lands."
          fi
          if ! git diff --quiet; then
            if [ "${{ steps.check.outcome }}" = 'success' ]; then
              echo 'ESLint autofixes (Prettier was already clean):'
              git diff -- . | head -c 60000
            fi
            echo "::error::Changed files need the ESLint/Prettier fixes above."
            exit 1
          fi

      - name: Upload Prettier patch
        if: failure() && steps.patch.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prettier-autofix-patch
          path: ${{ runner.temp }}/prettier-autofix.patch
          retention-days: 3

  autofix:
    name: Push Prettier autofix
    needs: prettier-changed
    if: >-
      failure() &&
      github.event_name == 'pull_request' &&
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.prettier-changed.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download Prettier patch
        uses: actions/download-artifact@v4
        with:
          name: prettier-autofix-patch
          path: ${{ runner.temp }}/autofix

      - name: Commit and push the patch
        id: push
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git apply --index "$RUNNER_TEMP/autofix/prettier-autofix.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: autoformat changed files (Prettier)"
          # A plain push is rejected if the branch moved since this run began;
          # the newer push gets its own check and autofix pass.
          if git push origin "HEAD:$HEAD_REF"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Branch advanced during autofix; the newer commit is checked on its own."
          fi

      - name: Re-run this PR's checks on the autofix commit
        if: steps.push.outputs.pushed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          OLD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          new_sha="$(git rev-parse HEAD)"
          runs_for() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$1&event=pull_request&per_page=100" --jq "$2"
          }
          runs_for "$OLD_SHA" '.workflow_runs[].path' | sed 's/@.*//' | sort -u > "$RUNNER_TEMP/ran.txt"
          {
            echo "### Autofix pushed ${new_sha:0:9}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # GitHub holds pull_request runs started by this bot push as
          # "awaiting approval" (action_required). Silas chose (2026-11-14) to
          # have the bot approve those: wait for them to appear, approve each;
          # if approval is refused, delete the held run so the PR is not left
          # waiting on a maintainer, and dispatch that workflow instead.
          last=-1
          stable=0
          for attempt in $(seq 1 18); do
            count="$(runs_for "$new_sha" '.workflow_runs | length')"
            if [ "$count" = "$last" ]; then stable=$((stable + 1)); else stable=0; fi
            if [ "$count" -gt 0 ] && [ "$stable" -ge 2 ]; then break; fi
            if [ "$count" -eq 0 ] && [ "$attempt" -ge 6 ]; then break; fi
            last="$count"
            sleep 5
          done
          : > "$RUNNER_TEMP/handled.txt"
          runs_for "$new_sha" '.workflow_runs[] | select(.conclusion == "action_required") | "\(.id) \(.path)"' > "$RUNNER_TEMP/held.txt"
          while read -r run_id workflow_path; do
            workflow_path="${workflow_path%%@*}"
            if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/${run_id}/approve" > /dev/null 2>&1; then
              echo "$workflow_path" >> "$RUNNER_TEMP/handled.txt"
              echo "- approved held run of \`${workflow_path##*/}\`" >> "$GITHUB_STEP_SUMMARY"
            elif ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/${run_id}" > /dev/null 2>&1; then
              echo "::warning::Could not approve or clear held run $run_id (${workflow_path##*/})."
            fi
          done < "$RUNNER_TEMP/held.txt"
          runs_for "$new_sha" '.workflow_runs[] | select(.conclusion != "action_required") | .path' \
            | sed 's/@.*//' >> "$RUNNER_TEMP/handled.txt"

          while read -r workflow_path; do
            workflow_file="${workflow_path##*/}"
            if grep -qxF "$workflow_path" "$RUNNER_TEMP/handled.txt"; then
              continue
            fi
            if gh workflow run "$workflow_file" --ref "$HEAD_REF" 2> "$RUNNER_TEMP/err.txt"; then
              echo "- re-dispatched \`$workflow_file\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$workflow_file has no workflow_dispatch trigger; it reruns on the next push to this PR."
              echo "- not re-runnable: \`$workflow_file\` ($(head -c 200 "$RUNNER_TEMP/err.txt"))" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$RUNNER_TEMP/ran.txt"
